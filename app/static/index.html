            const [ollamaHealthy, setOllamaHealthy] = useState(false);
            const [currentTime, setCurrentTime] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const chatEndRef = useRef(null);
            const fileInputRef = useRef(null);

            // Refs to avoid stale closures
            const messagesRef = useRef([]);
            const loadingRef = useRef(false);

            useEffect(() => {
                // Initial check for mobile screen size
                if (window.innerWidth <= 768) {
                    setSidebarOpen(false);
                }
                const handleResize = () => {
                    if (window.innerWidth <= 768) {
                        setSidebarOpen(false);
                    } else {
                        setSidebarOpen(true);
                    }
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            useEffect(() => {
                // Clock every second
                const updateTime = () => {
                    const now = new Date();
                    const options = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
                    setCurrentTime(now.toLocaleDateString('en-US', options));
                };
                updateTime();
                const interval = setInterval(updateTime, 1000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                messagesRef.current = messages;
            }, [messages]);

            useEffect(() => {
                loadingRef.current = loading;
            }, [loading]);

            useEffect(() => {
                checkAuth();
                loadServices();
                loadDocuments();
                loadApplications();
                checkHealth();
                // Poll health every 30s
                const interval = setInterval(checkHealth, 30000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            const checkAuth = async () => {
                const token = localStorage.getItem('token');
                const username = localStorage.getItem('username');
                if (token && username) {
                    // Verify the token is still valid on the server
                    try {
                        const res = await fetch(`${API_BASE}/auth/me?token=${encodeURIComponent(token)}`);
                        if (res.ok) {
                            const data = await res.json();
                            const verifiedUsername = data.user?.username || username;
                            setUser({ token, username: verifiedUsername });
                            loadDocuments();
                            loadApplications();
                            loadUserProfile();
                        } else {
                            // Token invalid on server — clear it
                            localStorage.removeItem('token');
                            localStorage.removeItem('username');
                        }
                    } catch (e) {
                        // Network error — assume token still valid to avoid logging out on startup
                        setUser({ token, username });
                        loadDocuments();
                        loadApplications();
                        loadUserProfile();
                    }
                }
            };

            const checkHealth = async () => {
                try {
                    const res = await fetch(`${API_BASE}/health`);
                    const data = await res.json();
                    setSystemHealthy(data.status === 'healthy');
                    setOllamaHealthy(data.services?.generation === 'healthy' || data.services?.generation === 'model_not_found');
                } catch (e) {
                    setSystemHealthy(false);
                    setOllamaHealthy(false);
                }
            };

            const loadUserProfile = async () => {
                try {
                    const token = getToken();
                    if (!token) return;
                    const res = await fetch(`${API_BASE}/auth/me?token=${encodeURIComponent(token)}`);
                    const data = await res.json();
                    if (data.success && data.user) {
                        const u = data.user;
                        setProfileForm({
                            full_name: u.full_name || '',
                            birthday: u.birthday || '',
                            gender: u.gender || '',
                            username: u.username || '',
                            email: u.email || '',
                            password: ''
                        });
                        setProfileInitial({
                            full_name: u.full_name || '',
                            birthday: u.birthday || '',
                            gender: u.gender || ''
                        });
                        if (u.full_name) {
                            localStorage.setItem('full_name', u.full_name);
                        }
                        if (u.username) {
                            localStorage.setItem('username', u.username);
                            setUser(prev => prev ? { ...prev, username: u.username } : { token, username: u.username });
                        }
                    }
                } catch (e) {
                    console.error('Failed to load profile:', e);
                }
            };

            const handleSaveProfile = async (e) => {
                if (e) e.preventDefault();
                setProfileSaving(true);
                setProfileMsg('');
                try {
                    const token = getToken();
                    const payload = {};
                    if (!profileInitial.full_name && profileForm.full_name) payload.full_name = profileForm.full_name;
                    if (!profileInitial.birthday && profileForm.birthday) payload.birthday = profileForm.birthday;
                    if (!profileInitial.gender && profileForm.gender) payload.gender = profileForm.gender;
                    if (profileForm.username) payload.username = profileForm.username;
                    if (profileForm.email) payload.email = profileForm.email;
                    if (profileForm.password) payload.password = profileForm.password;

                    const res = await fetch(`${API_BASE}/auth/profile?token=${encodeURIComponent(token)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        setProfileMsg('Profile updated successfully!');
                        const updatedUser = data.user || {};
                        if (updatedUser.full_name) {
                            localStorage.setItem('full_name', updatedUser.full_name);
                            setWizardName(updatedUser.full_name);
                        }
                        if (updatedUser.username) {
                            localStorage.setItem('username', updatedUser.username);
                            setUser(prev => prev ? { ...prev, username: updatedUser.username } : { token, username: updatedUser.username });
                        }
                        setProfileInitial({
                            full_name: updatedUser.full_name || profileInitial.full_name,
                            birthday: updatedUser.birthday || profileInitial.birthday,
                            gender: updatedUser.gender || profileInitial.gender
                        });
                        setProfileForm(prev => ({
                            ...prev,
                            full_name: updatedUser.full_name || prev.full_name,
                            birthday: updatedUser.birthday || prev.birthday,
                            gender: updatedUser.gender || prev.gender,
                            username: updatedUser.username || prev.username,
                            email: updatedUser.email || prev.email,
                            password: ''
                        }));
                        loadDocuments();
                        loadApplications();
                    } else {
                        setProfileMsg(data.detail || data.message || 'Failed to update profile');
                    }
                } catch (err) {
                    setProfileMsg('Error updating profile: ' + err.message);
                } finally {
                    setProfileSaving(false);
                }
            };

            const loadServices = async () => {
                try {
                    const token = getToken();
                    const res = await fetch(`${API_BASE}/services?token=${encodeURIComponent(token)}`);
                    const data = await res.json();
                    setServices(data.data?.services || []);
                } catch (e) {
                    console.error('Failed to load services:', e);
                }
            };

            const loadDocuments = async () => {
                try {
                    const token = getToken();
                    if (!token) return;
                    const res = await fetch(`${API_BASE}/documents?token=${encodeURIComponent(token)}`);
                    const data = await res.json();
                    setDocuments(data.data?.documents || []);
                } catch (e) {
                    console.error('Failed to load documents:', e);
                }
            };

            const loadApplications = async () => {
                try {
                    const token = getToken();
                    if (!token) return;
                    const res = await fetch(`${API_BASE}/applications?token=${encodeURIComponent(token)}`);
                    const data = await res.json();
                    setApplications(data.data?.applications || []);
                } catch (e) {
                    console.error('Failed to load applications:', e);
                }
            };

            const handleCancelApplication = async (appId) => {
                if (!window.confirm('Are you sure you want to cancel this application? The uploaded document(s) along with it will be permanently removed.')) {
                    return;
                }
                try {
                    setLoading(true);
                    const token = getToken();
                    const url = `${API_BASE}/applications/${encodeURIComponent(appId)}/cancel${token ? `?token=${encodeURIComponent(token)}` : ''}`;
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    const data = await res.json().catch(() => ({}));
                    if (res.ok && (data.success || data.deleted)) {
                        alert('Application has been cancelled and the uploaded documents have been removed.');
                        loadApplications();
                        loadDocuments();
                    } else {
                        const errMsg = data.detail || data.message || 'Could not cancel application';
                        alert(`Error: ${errMsg}`);
                    }
                } catch (e) {
                    console.error('Failed to cancel application:', e);
                    alert(`Failed to cancel application: ${e.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const handleAuth = async () => {
                setAuthError('');
                setAuthSuccess('');
                try {
                    if (authMode === 'reset') {
                        const identifier = authData.username.trim() || authData.email.trim();
                        if (!identifier) {
                            setAuthError('Please enter your username or email address.');
                            return;
                        }
                        const newPwd = (authData.new_password || authData.password || '').trim();
                        if (!newPwd) {
                            setAuthError('Please enter a new password.');
                            return;
                        }

                        const res = await fetch(`${API_BASE}/auth/reset-password`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ identifier, new_password: newPwd })
                        });
                        const data = await res.json().catch(() => ({}));
                        if (data.success) {
                            setAuthSuccess(data.message || 'Password reset successfully! You can now sign in.');
                            setAuthData(prev => ({ ...prev, password: '', new_password: '' }));
                            setTimeout(() => {
                                setAuthMode('login');
                                setAuthSuccess('');
                            }, 2500);
                        } else {
                            setAuthError(data.detail || data.message || 'Failed to reset password. Please check your username/email.');
                        }
                        return;
                    }

                    const endpoint = authMode === 'login' ? '/auth/login' : '/auth/register';
                    const emailVal = (authData.email || '').trim() || (authData.username.includes('@') ? authData.username.trim() : `${authData.username.trim()}@example.com`);
                    const body = authMode === 'login'
                        ? { username: authData.username.trim(), password: authData.password }
                        : { 
                            username: authData.username.trim(), 
                            password: authData.password, 
                            email: emailVal, 
                            name: authData.full_name || authData.name || authData.username.trim(),
                            full_name: authData.full_name || authData.name || authData.username.trim(),
                            birthday: authData.birthday,
                            gender: authData.gender
                        };

                    const res = await fetch(`${API_BASE}${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });

                    const data = await res.json().catch(() => ({}));

                    if (data.success && (authMode === 'login' || authMode === 'register')) {
                        const token = data.data?.token;
                        const username = data.data?.username || authData.username;
                        const displayName = data.data?.full_name || username;
                        if (token) {
                            localStorage.setItem('token', token);
                            localStorage.setItem('username', username);
                            if (data.data?.full_name) {
                                localStorage.setItem('full_name', data.data.full_name);
                            }
                            setUser({ token, username });
                        }
                        setShowAuth(false);
                        setAuthMode('login');
                        // Always redirect back to main page
                        setShowDocumentsPage(false);
                        setShowApplicationsPage(false);
                        setShowServicesPage(false);
                        setShowAccountPage(false);

                        const pending = pendingApplyRef.current;
                        const pendingApps = data.data?.pending_applications || [];
                        if (pending) {
                            pendingApplyRef.current = null;
                            addMessage('assistant', `Welcome ${displayName}! Let us pick up your application.`);
                            setTimeout(() => resumePendingApply(pending), 0);
                        } else if (pendingApps.length > 0) {
                            const latestApp = pendingApps[0];
                            addMessage('assistant', `Welcome ${displayName}! You have an incomplete application for ${latestApp.service_id.replace(/_/g, ' ')}. Would you like to resume it?`, null, { type: 'wizard_offer', serviceId: latestApp.service_id });
                        } else {
                            addMessage('assistant', authMode === 'register' 
                                ? `Welcome ${displayName}! Your account has been created successfully and you are now signed in.` 
                                : `Welcome back, ${displayName}!`);
                        }
                        loadDocuments();
                        loadApplications();
                        loadUserProfile();
                    } else {
                        let errText = 'Authentication failed';
                        if (typeof data.detail === 'string') {
                            errText = data.detail;
                        } else if (Array.isArray(data.detail)) {
                            errText = data.detail.map(d => (d.loc ? d.loc.slice(-1) + ': ' : '') + d.msg).join('; ');
                        } else if (data.message) {
                            errText = data.message;
                        } else if (data.error) {
                            errText = data.error;
                        }
                        setAuthError(errText);
                    }
                } catch (e) {
                    setAuthError(e.message || 'Connection error');
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('token');
                localStorage.removeItem('username');
                setUser(null);
                setDocuments([]);
                setApplications([]);
            };
            const handleChatScroll = (e) => {
                const { scrollTop, scrollHeight, clientHeight } = e.target;
                setShowScrollTop(scrollHeight - scrollTop - clientHeight > 100);
            };

            const scrollToTop = () => {
                if (chatMessagesRef.current) {
                    chatMessagesRef.current.scrollTop = 0;
                }
            };
            

            const handleFileUpload = async () => {
                if (!file) return;

                // During the wizard, the paperclip sends the file to the next missing required document
                if (wizardStep === 'upload') {
                    const next = wizardRequiredDocs().find(d => !wizardDocs.some(u => u.docType === d));
                    if (next) {
                        const f = file;
                        setFile(null);
                        if (fileInputRef.current) fileInputRef.current.value = '';
                        wizardUploadDocument(f, next);
                        return;
                    }
                }

                const formData = new FormData();
                formData.append('file', file);

                try {
                    const token = getToken();
                    // Use /upload (not /extract) so the document is persisted to the DB under this user
                    const res = await fetch(`${API_BASE}/documents/upload?token=${encodeURIComponent(token)}`, {
                        method: 'POST',
                        body: formData
                    });

                    const data = await res.json();

                    if (data.success) {
                        const extractedFields = data.data?.extracted_fields || {};
                        const fieldCount = Object.keys(extractedFields).filter(k => !k.startsWith('_')).length;

                        addMessage('system', `✅ Document uploaded: ${file.name}`);

                        if (fieldCount > 0) {
                            let fieldDetails = `\n📋 **Extracted Fields** (${fieldCount} fields):\n`;
                            for (const [key, value] of Object.entries(extractedFields)) {
                                if (!key.startsWith('_') && value) {
                                    fieldDetails += `• **${key}**: ${value}\n`;
                                }
                            }
                            addMessage('system', fieldDetails.trim());
                        }

                        setFile(null);
                        if (fileInputRef.current) fileInputRef.current.value = '';
                        loadDocuments();
                    } else {
                        addMessage('system', `❌ Upload failed: ${data.error || data.detail || 'Unknown error'}`);
                    }
                } catch (e) {
                    addMessage('system', `❌ Upload error: ${e.message}`);
                }
            };

            const isGreeting = (text) => {
                const greetings = ['hi', 'hello', 'hey', 'good morning', 'good afternoon', 'good evening', 'good night', 'greetings'];
                return greetings.some(g => text.toLowerCase().includes(g));
            };

            const getTimeGreeting = () => {
                const hour = new Date().getHours();
                if (hour < 12) return 'Good morning';
                if (hour < 17) return 'Good afternoon';
                if (hour < 21) return 'Good evening';
                return 'Good night';
            };

            const getLynxGreeting = () => {
                return `${getTimeGreeting()}! I'm Lynx, your DocIntake assistant. I'm ready to help you with document onboarding, service inquiries, and applications. How can I assist you?`;
            };

            const sendMessage = async (messageText) => {
                const query = messageText || input.trim();
                if (!query && !file) return;
                if (loadingRef.current) return;

                const userMessage = query;
                addMessage('user', userMessage);

                // While the wizard waits for the applicant's name, the chat input is the answer
                if (wizardStep === 'name' && wizardService) {
                    setInput('');
                    wizardProceedToUpload(userMessage);
                    return;
                }

                setLoading(true);
                setInput('');
                setFile(null);
                if (fileInputRef.current) fileInputRef.current.value = '';

                // Handle greetings locally with Lynx personality
                if (isGreeting(query)) {
                    setTimeout(() => {
                        addMessage('assistant', getLynxGreeting());
                        setLoading(false);
                    }, 500);
                    return;
                }

                try {
                    const token = getToken();
                    const res = await fetch(`${API_BASE}/chat/message?token=${encodeURIComponent(token)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query: userMessage })
                    });

                    const data = await res.json();

                    let responseText = data.response || 'No response';
                    let matchedService = data.matched_service;

                    addMessage('assistant', responseText, matchedService);

                    // Offer to start an application when the user wants to apply or is asking about services,
                    // provided the matched service is not 'coming soon'
                    const matchedSvcObj = matchedService ? services.find(s => s.id === matchedService) : null;
                    const isComingSoon = matchedSvcObj && matchedSvcObj.status && matchedSvcObj.status !== 'available';

                    const wantsApply = !isComingSoon && (data.intent === 'apply' || /\b(apply|application|register|registration|sign ?up|enrol+)\b/i.test(userMessage));
                    const asksServices = !isComingSoon && (!!matchedService || /\b(services?|offer(ed)?|available|requirements?|eligib\w+)\b/i.test(userMessage));
                    if ((wantsApply || asksServices) && !(wizardStep && wizardStep !== 'success')) {
                        offerApplication(matchedService, wantsApply);
                    }
                } catch (e) {
                    addMessage('assistant', `Error: ${e.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const addMessage = (role, content, service = null, extra = null) => {
                setMessages(prev => [...prev, { role, content, service, timestamp: new Date(), ...(extra || {}) }]);
            };

            const formatFileSize = (bytes) => {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            };

            const getServiceIcon = (serviceId) => {
                const icons = {
                    basic_registration: '🆔',
                    premium_crossborder: '🌍',
                    mobility_rental: '🚗'
                };
                return icons[serviceId] || '📋';
            };

            const requireAuth = (callback) => {
                if (!user) {
                    setShowAuth(true);
                    return false;
                }
                callback();
                return true;
            };

            const handleFeatureClick = (messageText) => {
                if (messageText === 'Upload a document') {
                    if (!requireAuth(() => fileInputRef.current?.click())) return;
                } else if (/apply|register/i.test(messageText)) {
                    const svcId = /basic|registration/i.test(messageText) ? 'basic_registration'
                        : /premium|cross/i.test(messageText) ? 'premium_crossborder'
                        : /mobility|rental/i.test(messageText) ? 'mobility_rental' : null;
                    startApplication(svcId);
                } else {
                    if (!requireAuth(() => sendMessage(messageText))) return;
                }
            };

            const handleServiceClick = (serviceId, serviceName) => {
                if (!requireAuth(() => sendMessage(`Tell me about ${serviceName}`))) return;
            };

            const handleResetChat = () => {
                setMessages([]);
                resetWizard();
            };

            const handleStartApplication = () => startApplication(null);

            // ================= In-chat application wizard =================
            // Every step (service, name, documents, review, submit) happens inside the chat. Nothing covers the page.
            const getToken = () => user?.token || localStorage.getItem('token') || '';
            const wizardRequiredDocs = () => wizardService?.documents_required || [];
            const isIdDocument = (d) => /national.?id|passport|driving.?licen|(^|[\s_])id([\s_]|$)/i.test(d);
            const prettyDoc = (d) => d.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

            // PII masking for anything shown in chat; the raw value appears only when the user taps "Show"
            const SENSITIVE_KEY = /(^|_)(id|eid|passport|dob|birth|phone|mobile|email|address|iban|account|licen[sc]e)(_|$)|number/i;
            const maskWizardValue = (key, value) => {
                const v = String(value);
                if (!SENSITIVE_KEY.test(key)) return v;
                if (/birth|dob/i.test(key)) return '••/••/••••';
                return v.length <= 4 ? '••••' : '•'.repeat(v.length - 3) + v.slice(-3);
            };

            const clearWizardState = () => {
                setWizardDocs([]);
                setWizardAppId(null);
                setWizardBusy(null);
            };

            const resetWizard = () => {
                clearWizardState();
                setWizardService(null);
                setWizardName('');
                setWizardStep(null);
            };

            const dismissOffers = () => setMessages(prev => prev.map(m => m.type === 'wizard_offer' ? { ...m, dismissed: true } : m));

            // Bot offers to start an application; needs a login first
            const offerApplication = (serviceId, explicit) => {
                const svc = services.find(s => s.id === serviceId);
                if (!getToken()) {
                    if (explicit) {
                        pendingApplyRef.current = serviceId || 'any';
                        addMessage('assistant', 'To start an application you need to be signed in. Please sign in and I will continue right here.');
                        setShowAuth(true);
                    } else {
                        addMessage('assistant', 'If you would like to apply, please sign in first and I can start the application for you here in chat.');
                    }
                    return;
                }
                addMessage('assistant', svc ? `Would you like me to start a new ${svc.name} application for you?` : 'Would you like me to start a new application for you?', null, { type: 'wizard_offer', serviceId: serviceId || null });
            };

            const startApplication = (serviceId) => {
                setShowServicesPage(false);
                setShowDocumentsPage(false);
                if (!getToken()) {
                    pendingApplyRef.current = serviceId || 'any';
                    addMessage('assistant', 'Please sign in to start an application. I will continue right here once you are in.');
                    setShowAuth(true);
                    return;
                }
                resumePendingApply(serviceId || 'any');
            };

            const resumePendingApply = (serviceId) => {
                const svc = serviceId && serviceId !== 'any' ? services.find(s => s.id === serviceId) : null;
                if (svc) beginService(svc); else initWizardSession();
            };

            const initWizardSession = () => {
                resetWizard();
                setWizardStep('welcome');
                addMessage('assistant', 'Which service would you like to apply for?', null, { type: 'wizard_services' });
            };

            const beginService = async (svc) => {
                if (svc.status && svc.status !== 'available') {
                    addMessage('assistant', `${svc.name} is not open for applications yet.`);
                    return;
                }
                dismissOffers();
                clearWizardState();
                setWizardService(svc);

                // Auto-create wizard session using authenticated user's name
                setLoading(true);
                try {
                    const token = getToken();
                    const res = await fetch(`${API_BASE}/wizard/create?token=${encodeURIComponent(token)}&service_id=${encodeURIComponent(svc.id)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    const data = await res.json().catch(() => ({}));
                    if (res.status === 409 || (data.detail && data.detail.includes('already active'))) {
                        addMessage('assistant', `⚠️ ${data.detail || 'An application for this service already exists under your name. Please delete or cancel your existing application before creating a new one.'}`);
                        return;
                    }
                    if (res.ok && data.success) {
                        const wizardSessionId = data.data.session_id;
                        const applicantName = data.data.applicant_name || localStorage.getItem('full_name') || localStorage.getItem('username') || '';
                        setWizardName(applicantName);
                        setWizardAppId(wizardSessionId);
                        setWizardStep('upload');

                        const totalDocs = (svc.documents_required || []).length;
                        const firstDocLabel = totalDocs > 0 ? prettyDoc(svc.documents_required[0]) : 'your document';
                        const docSummary = totalDocs > 1
                            ? `This service requires ${totalDocs} documents — we will go one step at a time, starting with your ${firstDocLabel}.`
                            : `You will need to provide your ${firstDocLabel}.`;

                        addMessage('assistant', `Let us start your ${svc.name} application for ${applicantName}. ${docSummary} Step 1 of ${totalDocs || 1}: please upload your ${firstDocLabel} using the card below.`, null, { type: 'wizard_upload' });
                        return;
                    }
                } catch (e) {
                    console.error("Could not auto-start wizard:", e);
                } finally {
                    setLoading(false);
                }

                // Fallback: if session creation failed, ask for name
                setWizardName('');
                setWizardStep('name');
                const totalDocs = (svc.documents_required || []).length;
                const firstDocLabel = totalDocs > 0 ? prettyDoc(svc.documents_required[0]) : 'your document';
                const docSummary = totalDocs > 1
                    ? `This service requires ${totalDocs} documents — we will go one step at a time, starting with your ${firstDocLabel}.`
                    : `You will need to provide your ${firstDocLabel}.`;
                addMessage('assistant', `Let us start your ${svc.name} application. ${docSummary} Everything happens right here in chat. What is your full name as it appears on your ID?`, svc.id);
            };

            const startWizardService = (serviceId) => {
                const svc = services.find(s => s.id === serviceId);
                if (svc) beginService(svc);
            };

            const wizardProceedToUpload = async (nameInput) => {
                const name = (nameInput || '').trim();
                const ask = (msg) => addMessage('assistant', msg + ' Please send your full name again.');
                if (name.length < 2) return ask('Your name must be at least 2 characters.');
                if (!/^[A-Za-zÀ-ÖØ-öø-ÿ\u00C0-\u024F ]+$/.test(name)) return ask('Names can only contain letters and single spaces.');

                setLoading(true);
                try {
                    const token = getToken();
                    // Step 1: Create wizard session
                    const res = await fetch(`${API_BASE}/wizard/create?token=${encodeURIComponent(token)}&service_id=${encodeURIComponent(wizardService.id)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok || !data.success) {
                        const d = data.detail || data.error || res.statusText;
                        addMessage('assistant', `I could not start your application${typeof d === 'string' ? ': ' + d : ''}. Please send your name again.`);
                        return;
                    }
                    const wizardSessionId = data.data.session_id;
                    // Step 2: Submit name
                    const nameRes = await fetch(`${API_BASE}/wizard/${wizardSessionId}/name?token=${encodeURIComponent(token)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name })
                    });
                    const nameData = await nameRes.json().catch(() => ({}));
                    if (!nameRes.ok || !nameData.success) {
                        const err = nameData.detail || nameData.error || nameData.message || nameRes.statusText;
                        addMessage('assistant', `I could not record your name${err ? ': ' + err : ''}. Please send it again.`);
                        return;
                    }
                    setWizardName(name);
                    setWizardAppId(wizardSessionId);
                    setWizardStep('upload');
                    const firstRequired = (wizardService && wizardService.documents_required && wizardService.documents_required.length > 0)
                    ? prettyDoc(wizardService.documents_required[0]) : 'document';
                addMessage('assistant',
                    `Thanks, ${name}. Step 1 of ${(wizardService.documents_required || []).length || 1}: please upload your ${firstRequired} using the card below.`,
                    null, { type: 'wizard_upload' });
                } catch (e) {
                    addMessage('assistant', `I could not start your application (${e.message}). Please send your name again.`);
                } finally {
                    setLoading(false);
                }
            };

            const wizardUploadDocument = async (file, docType) => {
                const wizardSessionId = wizardAppId;
                if (!wizardSessionId) {
                    addMessage('assistant', 'Your application has not been created yet. Please tell me your full name first.');
                    return false;
                }
                const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
                if (isIdDocument(docType) && !isPdf) {
                    addMessage('assistant', `"${file.name}" is not a PDF. Please send your ${prettyDoc(docType)} as a PDF or scanned PDF.`, null, { type: 'wizard_upload' });
                    return false;
                }
                if (file.size > 10 * 1024 * 1024) {
                    addMessage('assistant', `"${file.name}" is larger than 10 MB. Please send a smaller file.`, null, { type: 'wizard_upload' });
                    return false;
                }

                addMessage('user', `📎 ${file.name}`);
                setWizardBusy(docType);
                const resend = (why) => addMessage('assistant', `I could not accept "${file.name}": ${why} Please send your ${prettyDoc(docType)} again.`, null, { type: 'wizard_upload' });

                try {
                    const formData = new FormData();
                    formData.append('file', file);
                    const token = getToken();
                    const res = await fetch(`${API_BASE}/wizard/${wizardSessionId}/upload?token=${encodeURIComponent(token)}&doc_type=${encodeURIComponent(docType)}`, {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json().catch(() => ({}));

                    if (!res.ok || data.success === false) {
                        const d = data.detail || data.error || data.message;
                        const issues = data.data?.issues || [];
                        if (issues.length) {
                            resend(issues.join('; '));
                        } else {
                            resend(typeof d === 'string' ? d : 'the upload failed.');
                        }
                        return false;
                    }

                    // If the wizard backend returned clarity check results, show them
                    if (data.data?.clarity_status === 'fail' && data.data?.quality_score) {
                        addMessage('assistant', `⚠️ Document clarity check: quality score ${data.data.quality_score.toFixed(2)}. Please upload a clearer image.`, null, { type: 'wizard_upload' });
                        return false;
                    }

                    // For National ID, also check name match using existing logic
                    // (name was already verified when set via /wizard/{id}/name)

                    const checkData = data.data || {};
                    const confidencePct = checkData.confidence_pct !== undefined
                        ? checkData.confidence_pct
                        : (checkData.confidence_score !== undefined ? Math.round(checkData.confidence_score * 100) : null);
                    const needsHumanReview = checkData.needs_human_review || (confidencePct !== null && confidencePct >= 51 && confidencePct <= 79);
                    const docs = [...wizardDocs.filter(d => d.docType !== docType),
                        {
                            docType,
                            filename: file.name,
                            extractedFields: checkData.extracted_fields || checkData.extractedFields || {},
                            malwareScan: checkData.malware_scan || 'clean',
                            malwareDetails: checkData.malware_details || '',
                            pdfValid: checkData.pdf_valid,
                            qualityScore: checkData.quality_score,
                            isBlurry: checkData.is_blurry || false,
                            blurryFields: checkData.blurry_fields || [],
                            confidencePct,
                            needsHumanReview,
                        }];
                    setWizardDocs(docs);
                    loadDocuments();   // the file is now stored server-side; refresh the Documents list

                    // If confidence < 50%, warn the user prominently
                    if (confidencePct !== null && confidencePct < 50) {
                        addMessage('assistant', `⚠️ Confidence score is ${confidencePct}% — too low to read the document clearly. Please upload a better, higher-resolution scan.`, null, { type: 'wizard_upload' });
                        return false;
                    }

                    // If 51–79%, human review message
                    if (needsHumanReview) {
                        addMessage('assistant', `📋 Confidence score is ${confidencePct}% — routed for human review. You may proceed to review the extracted data.`, null, { type: 'wizard_upload' });
                    }

                    const nextDoc = wizardRequiredDocs().find(d => !docs.some(u => u.docType === d));
                    if (nextDoc) {
                        const totalRequired = wizardRequiredDocs().length;
                        const uploadedCount = docs.length;
                        addMessage('assistant',
                            `✅ Your ${prettyDoc(docType)} has been verified and approved! `
                            + `Step ${uploadedCount + 1} of ${totalRequired}: now please upload your ${prettyDoc(nextDoc)} using the card below.`,
                            null, { type: 'wizard_upload' });
                    } else {
                        setWizardStep('review');
                        // Fetch fresh review data from backend
                        try {
                            const reviewRes = await fetch(`${API_BASE}/wizard/${wizardAppId}/review?token=${encodeURIComponent(token)}`);
                            const reviewData = await reviewRes.json().catch(() => ({}));
                            if (reviewData.success && reviewData.data && reviewData.data.document_checks) {
                                const docs = reviewData.data.document_checks.map(d => ({
                                    docType: d.doc_type,
                                    filename: d.file_name,
                                    extractedFields: d.extracted_fields || {},
                                    malwareScan: d.malware_scan || 'clean',
                                    malwareDetails: d.malware_details || '',
                                    pdfValid: d.pdf_valid,
                                    qualityScore: d.quality_score,
                                    isBlurry: d.is_blurry || false,
                                    blurryFields: d.blurry_fields || [],
                                    confidencePct: d.confidence_pct,
                                    needsHumanReview: d.needs_human_review,
                                }));
                                setWizardDocs(docs);
                            }
                        } catch (e) {
                            console.error('Failed to fetch review data:', e);
                        }
                        addMessage('assistant', 'All documents passed the checks. Please review what I filled in. Sensitive fields are masked and you can tap Show to double check them. Confirm when everything is correct, or replace a document.', null, { type: 'wizard_review' });
                    }
                    return true;
                } catch (e) {
                    resend('I could not reach the server.');
                    return false;
                } finally {
                    setWizardBusy(null);
                }
            };

            const wizardSubmitReview = async () => {
                if (wizardStep !== 'review') return;
                setWizardStep('submitting');
                setLoading(true);
                try {
                    const token = getToken();

                    // Step 3: record the confirmation on the server. /submit refuses (409)
                    // until the session is confirmed, and /edit resets that flag.
                    const confirmFields = {};
                    (wizardDocs || []).forEach(dc => Object.keys(dc.extractedFields || {}).forEach(k => { confirmFields[k] = true; }));
                    const confirmRes = await fetch(`${API_BASE}/wizard/${wizardAppId}/confirm?token=${encodeURIComponent(token)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },   // route requires a JSON body
                        body: JSON.stringify({ fields: confirmFields }),
                    });
                    const confirmData = await confirmRes.json().catch(() => ({}));
                    if (!confirmRes.ok || !confirmData.success) {
                        const cd = confirmData.detail || confirmData.error || confirmData.message;
                        const cmsg = typeof cd === 'string' ? cd : (cd?.message || JSON.stringify(cd) || 'unknown error');
                        setWizardStep('review');
                        addMessage('assistant', `Couldn't confirm your details: ${cmsg}. You can try Confirm again.`, null, { type: 'wizard_review' });
                        return;
                    }

                    // Step 4: submit
                    const res = await fetch(`${API_BASE}/wizard/${wizardAppId}/submit?token=${encodeURIComponent(token)}`, {
                        method: 'POST',
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok || !data.success) {
                        const d = data.detail || data.error || data.message;
                        const msg = typeof d === 'string' ? d : (d?.message || JSON.stringify(d) || 'unknown error');
                        setWizardStep('review');
                        addMessage('assistant', `Submission failed: ${msg}. You can try Confirm again.`, null, { type: 'wizard_review' });
                        return;
                    }
                    const refId = data.data?.reference_id;
                    const procTime = data.data?.processing_time || '1–2 business days';
                    const dispStatus = data.data?.display_status || (data.data?.status === 'needs_human_review' ? 'Under Review (Compliance)' : 'Submitted (Processing)');
                    const subAt = data.data?.submitted_at;
                    setWizardStep('success');
                    addMessage('assistant', `Your application has been received and registered under Reference ${refId}. It is now in the processing registry.`, null, {
                        type: 'wizard_success',
                        name: wizardName,
                        service: wizardService?.name || '',
                        refId: refId,
                        status: data.data?.status || 'Submitted',
                        displayStatus: dispStatus,
                        processingTime: procTime,
                        submittedAt: subAt
                    });
                    loadDocuments();
                    loadApplications();
                } catch (e) {
                    setWizardStep('review');
                    addMessage('assistant', `Submission failed: ${e.message}. You can try Confirm again.`, null, { type: 'wizard_review' });
                } finally {
                    setLoading(false);
                }
            };

            const wizardReplaceDoc = (docType) => {
                setWizardDocs(prev => prev.filter(d => d.docType !== docType));
                setWizardStep('upload');
                addMessage('assistant', `No problem. Please send a new ${prettyDoc(docType)}.`, null, { type: 'wizard_upload' });
            };

            const wizardRestart = () => {
                addMessage('user', 'Start over');
                if (wizardService) beginService(wizardService);
            };

            const wizardCancel = async () => {
                if (!window.confirm('Are you sure you want to cancel this application? Any uploaded documents will be removed.')) {
                    return;
                }
                setLoading(true);
                try {
                    const token = getToken();
                    if (wizardAppId) {
                        await fetch(`${API_BASE}/wizard/${encodeURIComponent(wizardAppId)}/cancel${token ? `?token=${encodeURIComponent(token)}` : ''}`, {
                            method: 'POST'
                        }).catch(() => {});
                    }
                    setWizardStep(null);
                    setWizardDocs([]);
                    setWizardService(null);
                    setWizardName('');
                    setWizardAppId(null);
                    addMessage('assistant', 'Application cancelled. Any uploaded documents have been removed.');
                    loadDocuments();
                    loadApplications();
                } catch (e) {
                    console.error('Failed to cancel wizard application:', e);
                } finally {
                    setLoading(false);
                }
            };

            // Inline edit handler
            const wizardEditField = async (fieldKey, newValue) => {
                if (!newValue || newValue.trim().length < 2) {
                    addMessage('assistant', 'Please enter a valid value for this field.');
                    return null;
                }
                setLoading(true);
                try {
                    const token = getToken();
                    const res = await fetch(`${API_BASE}/wizard/${wizardAppId}/edit?token=${encodeURIComponent(token)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ field_name: fieldKey, field_value: newValue.trim() })
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok || !data.success) {
                        addMessage('assistant', `Could not update that field: ${data.detail || data.error || 'Unknown error'}. Please try again.`);
                        return null;
                    }
                    addMessage('assistant', `✓ Updated: ${newValue.trim()}. Please review the full information below.`);
                    // Re-fetch review data
                    const reviewRes = await fetch(`${API_BASE}/wizard/${wizardAppId}/review?token=${encodeURIComponent(token)}`);
                    const reviewData = await reviewRes.json().catch(() => ({}));
                    if (reviewData.success && reviewData.data && reviewData.data.document_checks) {
                        const docs = reviewData.data.document_checks.map(d => ({
                            docType: d.doc_type,
                            filename: d.file_name,
                            extractedFields: d.extracted_fields || {},
                            malwareScan: d.malware_scan || 'clean',
                            pdfValid: d.pdf_valid,
                            qualityScore: d.quality_score,
                            isBlurry: d.is_blurry || false,
                            blurryFields: d.blurry_fields || [],
                        }));
                        setWizardDocs(docs);
                    }
                    return true;
                } catch (e) {
                    addMessage('assistant', `Could not reach the server: ${e.message}. Please try again.`);
                    return null;
                } finally {
                    setLoading(false);
                }
            };

            // Called from the message list: {renderWizardMessage(msg)}. Only the newest card of each kind is shown.
            const renderWizardMessage = (msg) => {
                if (!msg.type || msg.dismissed) return null;
                if (messages.filter(m => m.type === msg.type).slice(-1)[0] !== msg) return null;
                if (msg.type === 'wizard_offer') {
                    if (wizardStep && wizardStep !== 'success') return null;
                    return <WizardOffer
                        onYes={() => { addMessage('user', 'Yes, start my application'); const svc = services.find(s => s.id === msg.serviceId); if (svc) beginService(svc); else initWizardSession(); }}
                        onNo={() => { dismissOffers(); addMessage('user', 'Not now'); addMessage('assistant', 'No problem. Just say the word whenever you want to apply.'); }} />;
                }
                if (msg.type === 'wizard_services') return <WizardServices services={services} onPick={startWizardService} />;
                if (msg.type === 'wizard_upload') {
                    return <WizardUpload docs={wizardRequiredDocs()} uploaded={wizardDocs} busy={wizardBusy}
                        onFile={wizardUploadDocument} isId={isIdDocument} pretty={prettyDoc} onCancel={wizardCancel} />;
                }
                if (msg.type === 'wizard_review') {
                    return <WizardReview name={wizardName} docs={wizardDocs} mask={maskWizardValue} pretty={prettyDoc}
                        disabled={wizardStep !== 'review'} onConfirm={wizardSubmitReview} onReplace={wizardReplaceDoc} onRestart={wizardRestart} onEdit={wizardEditField} onCancel={wizardCancel} />;
                }
                if (msg.type === 'wizard_success') {
                    return <SuccessResult
                        name={msg.name}
                        service={msg.service}
                        refId={msg.refId}
                        status={msg.status}
                        displayStatus={msg.displayStatus}
                        processingTime={msg.processingTime}
                        submittedAt={msg.submittedAt}
                        onTrackClick={() => {
                            setShowAccountPage(true);
                            setAccountTab('applications');
                            setShowServicesPage(false);
                            setShowApplicationFlow(false);
                            loadApplications();
                        }}
                    />;
                }
                return null;
            };

            // Field labels for display
            const NATIONAL_ID_LABELS = {
                full_name: 'Full Name',
                national_id_number: 'ID Number',
                date_of_birth: 'Date of Birth',
                nationality: 'Nationality',
                issue_date: 'Issue Date',
                expiry_date: 'Expiry Date',
                gender: 'Gender',
                card_number: 'Card Number',
                occupation: 'Occupation',
                issue_place: 'Issue Place',
            };
            
            const PASSPORT_LABELS = {
                given_name: 'Given Name',
                surname: 'Surname',
                passport_number: 'Passport Number',
                date_of_birth: 'Date of Birth',
                nationality: 'Nationality',
                sex: 'Sex',
                date_of_issue: 'Date of Issue',
                date_of_expiry: 'Date of Expiry',
            };
            
            const DRIVING_LICENSE_LABELS = {
                name: 'Name',
                full_name: 'Full Name',
                license_no: 'License Number',
                license_number: 'License Number',
                nationality: 'Nationality',
                date_of_birth: 'Date of Birth',
                issue_date: 'Issue Date',
                expiry_date: 'Expiry Date',
                licensing_authority: 'Licensing Authority',
                place_of_issue: 'Place of Issue',
                traffic_code_no: 'Traffic Code No',
                traffic_code: 'Traffic Code No',
                gear_type: 'Gear Type',
                glasses_requirement: 'Glasses Requirement',
                restrictions: 'Restrictions',
            };

            const formatFieldValue = (key, value, serviceId) => {
                if (value === null || value === undefined || value === '') return <span style={{ color: '#555' }}>—</span>;
                const fn = String(key).toLowerCase();
                const strVal = String(value).trim();

                // Glasses requirement: yes or no
                if (fn.includes('glasses')) {
                    const lower = strVal.toLowerCase();
                    if (lower === 'no' || lower === 'none' || lower === 'false' || lower.includes('no glasses')) {
                        return 'No';
                    }
                    if (lower === 'yes' || lower === 'true' || lower.includes('glasses') || lower.includes('logo') || lower.includes('required')) {
                        return 'Yes';
                    }
                    return 'Yes';
                }

                // For Mobility & Rental, capitalize each word in fields
                const isMobility = serviceId === 'mobility_rental' || (typeof serviceId === 'string' && serviceId.toLowerCase().includes('mobility'));
                if (isMobility) {
                    // Do not alter ISO dates or numbers
                    if (/^\d{1,4}[-/.]\d{1,2}[-/.]\d{1,4}$/.test(strVal) || /^\d+$/.test(strVal)) {
                        return strVal;
                    }
                    return strVal.replace(/\b\w+/g, txt => txt.charAt(0).toUpperCase() + txt.slice(1).toLowerCase());
                }

                return strVal;
            };

            const getDocLabels = (docType) => {
                if (!docType) return NATIONAL_ID_LABELS;
                const dt = String(docType).toLowerCase();
                if (dt.includes('licen')) return DRIVING_LICENSE_LABELS;
                if (dt.includes('passport')) return PASSPORT_LABELS;
                return NATIONAL_ID_LABELS;
            };
            
            const getDocType = (doc) => {
                if (doc.document_type) return doc.document_type;
                if (doc.filename && doc.filename.toLowerCase().includes('licen')) return 'driving_license';
                if (doc.filename && doc.filename.toLowerCase().includes('passport')) return 'passport';
                return 'national_id';
            };
            
            const renderDocumentsPage = () => (
                <div className="chat-area" style={{ overflowY: 'auto' }}>
                    <div className="page-header">
                        <h2><i className="fas fa-folder" style={{ marginRight: '8px' }}></i>Uploaded Documents ({documents.length})</h2>
                        <button className="btn btn-secondary" onClick={() => setShowDocumentsPage(false)}>
                            <i className="fas fa-arrow-left" style={{ marginRight: '4px' }}></i>Back to Chat
                        </button>
                    </div>
                    <div style={{ padding: '0 24px 24px' }}>
                        {documents.length === 0 ? (
                            <div style={{ textAlign: 'center', padding: '60px 20px', color: '#666' }}>
                                <div style={{ fontSize: '48px', marginBottom: '16px' }}>📄</div>
                                <div style={{ fontSize: '18px', marginBottom: '8px' }}>No documents yet</div>
                                <div style={{ fontSize: '14px', color: '#888' }}>
                                    Upload your first document using the paperclip icon in the chat input
                                </div>
                            </div>
                        ) : (
                            <div style={{ display: 'grid', gap: '16px' }}>
                                {documents.map((doc, idx) => {
                                    const docType = getDocType(doc);
                                    const labels = getDocLabels(docType);
                                    const extracted = doc.extracted_fields || doc.extractedFields || {};
                                    const fields = Object.entries(extracted).filter(([k]) => !k.startsWith('_'));
                                    
                                    const rawDate = doc.upload_date || doc.date || doc.uploaded_at;
                                    let formattedDate = 'Unknown date';
                                    if (rawDate) {
                                        try {
                                            const d = new Date(rawDate);
                                            formattedDate = isNaN(d.getTime()) ? rawDate : d.toLocaleString();
                                        } catch (e) {
                                            formattedDate = rawDate;
                                        }
                                    }
                                    const serviceDisplayName = doc.service_name || (doc.service_id ? doc.service_id.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()) : 'Basic Registration');
                                    const docTypeDisplay = docType.includes('licen') ? '🚗 Driving License' : docType === 'passport' ? '🛂 Passport' : '🆔 National ID';
                                    const token = getToken();
                                    const docId = doc.id || doc.document_id;
                                    const viewUrl = `${API_BASE}/documents/${encodeURIComponent(docId)}/view?token=${encodeURIComponent(token)}`;
                                    const downloadUrl = `${API_BASE}/documents/${encodeURIComponent(docId)}/download?token=${encodeURIComponent(token)}`;
                                    
                                    return (
                                        <div key={idx} style={{
                                            padding: '20px',
                                            background: '#1a1a1a',
                                            border: '1px solid #2a2a2a',
                                            borderRadius: '12px',
                                        }}>
                                            {/* Header */}
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px', paddingBottom: '12px', borderBottom: '1px solid #2a2a2a', flexWrap: 'wrap', gap: '12px' }}>
                                                <div>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '6px', flexWrap: 'wrap' }}>
                                                        <span style={{ fontSize: '15px', fontWeight: '600', color: '#f3f4f6' }}>
                                                            {doc.filename || doc.name || 'Unknown file'}
                                                        </span>
                                                        <span style={{
                                                            padding: '2px 8px',
                                                            background: '#1e3a5f',
                                                            color: '#60a5fa',
                                                            border: '1px solid #2563eb55',
                                                            borderRadius: '6px',
                                                            fontSize: '11px',
                                                            fontWeight: '500',
                                                            display: 'inline-flex',
                                                            alignItems: 'center',
                                                            gap: '4px'
                                                        }}>
                                                            <i className="fas fa-briefcase" style={{ fontSize: '10px' }}></i> {serviceDisplayName}
                                                        </span>
                                                    </div>
                                                    <div style={{ fontSize: '12px', color: '#888', display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' }}>
                                                        <span><i className="far fa-clock" style={{ marginRight: '4px' }}></i>{formattedDate}</span>
                                                        <span>·</span>
