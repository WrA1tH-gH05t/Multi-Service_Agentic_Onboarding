                    addMessage('assistant', 'Please sign in to start an application. I will continue right here once you are in.');
                    setShowAuth(true);
                    return;
                }
                resumePendingApply(serviceId || 'any');
            };

            const resumePendingApply = (serviceId) => {
                const svc = serviceId && serviceId !== 'any' ? services.find(s => s.id === serviceId) : null;
                if (svc) beginService(svc); else initWizardSession();
            };

            const initWizardSession = () => {
                resetWizard();
                setWizardStep('welcome');
                addMessage('assistant', 'Which service would you like to apply for?', null, { type: 'wizard_services' });
            };

            const beginService = (svc) => {
                if (svc.status && svc.status !== 'available') {
                    addMessage('assistant', `${svc.name} is not open for applications yet.`);
                    return;
                }
                dismissOffers();
                clearWizardState();
                setWizardName('');
                setWizardService(svc);
                setWizardStep('name');
                const totalDocs = (svc.documents_required || []).length;
                const firstDocLabel = totalDocs > 0 ? prettyDoc(svc.documents_required[0]) : 'your document';
                const docSummary = totalDocs > 1
                    ? `This service requires ${totalDocs} documents — we will go one step at a time, starting with your ${firstDocLabel}.`
                    : `You will need to provide your ${firstDocLabel}.`;
                addMessage('assistant', `Let us start your ${svc.name} application. ${docSummary} Everything happens right here in chat. What is your full name as it appears on your ID?`, svc.id);
            };

            const startWizardService = (serviceId) => {
                const svc = services.find(s => s.id === serviceId);
                if (svc) beginService(svc);
            };

            const wizardProceedToUpload = async (nameInput) => {
                const name = (nameInput || '').trim();
                const ask = (msg) => addMessage('assistant', msg + ' Please send your full name again.');
                if (name.length < 2) return ask('Your name must be at least 2 characters.');
                if (!/^[A-Za-zÀ-ÖØ-öø-ÿ\u00C0-\u024F ]+$/.test(name)) return ask('Names can only contain letters and single spaces.');

                setLoading(true);
                try {
                    const token = getToken();
                    // Step 1: Create wizard session
                    const res = await fetch(`${API_BASE}/wizard/create?token=${encodeURIComponent(token)}&service_id=${encodeURIComponent(wizardService.id)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok || !data.success) {
                        const d = data.detail || data.error || res.statusText;
                        addMessage('assistant', `I could not start your application${typeof d === 'string' ? ': ' + d : ''}. Please send your name again.`);
                        return;
                    }
                    const wizardSessionId = data.data.session_id;
                    // Step 2: Submit name
                    const nameRes = await fetch(`${API_BASE}/wizard/${wizardSessionId}/name?token=${encodeURIComponent(token)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name })
                    });
                    const nameData = await nameRes.json().catch(() => ({}));
                    if (!nameRes.ok || !nameData.success) {
                        const err = nameData.detail || nameData.error || nameData.message || nameRes.statusText;
                        addMessage('assistant', `I could not record your name${err ? ': ' + err : ''}. Please send it again.`);
                        return;
                    }
                    setWizardName(name);
                    setWizardAppId(wizardSessionId);
                    setWizardStep('upload');
                    const firstRequired = (wizardService && wizardService.documents_required && wizardService.documents_required.length > 0)
                    ? prettyDoc(wizardService.documents_required[0]) : 'document';
                addMessage('assistant',
                    `Thanks, ${name}. Step 1 of ${(wizardService.documents_required || []).length || 1}: please upload your ${firstRequired} using the card below.`,
                    null, { type: 'wizard_upload' });
                } catch (e) {
                    addMessage('assistant', `I could not start your application (${e.message}). Please send your name again.`);
                } finally {
                    setLoading(false);
                }
            };

            const wizardUploadDocument = async (file, docType) => {
                const wizardSessionId = wizardAppId;
                if (!wizardSessionId) {
                    addMessage('assistant', 'Your application has not been created yet. Please tell me your full name first.');
                    return false;
                }
                const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
                if (isIdDocument(docType) && !isPdf) {
                    addMessage('assistant', `"${file.name}" is not a PDF. Please send your ${prettyDoc(docType)} as a PDF or scanned PDF.`, null, { type: 'wizard_upload' });
                    return false;
                }
                if (file.size > 10 * 1024 * 1024) {
                    addMessage('assistant', `"${file.name}" is larger than 10 MB. Please send a smaller file.`, null, { type: 'wizard_upload' });
                    return false;
                }

                addMessage('user', `📎 ${file.name}`);
                setWizardBusy(docType);
                const resend = (why) => addMessage('assistant', `I could not accept "${file.name}": ${why} Please send your ${prettyDoc(docType)} again.`, null, { type: 'wizard_upload' });

                try {
                    const formData = new FormData();
                    formData.append('file', file);
                    const token = getToken();
                    const res = await fetch(`${API_BASE}/wizard/${wizardSessionId}/upload?token=${encodeURIComponent(token)}&doc_type=${encodeURIComponent(docType)}`, {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json().catch(() => ({}));

                    if (!res.ok || data.success === false) {
                        const d = data.detail || data.error || data.message;
                        const issues = data.data?.issues || [];
                        if (issues.length) {
                            resend(issues.join('; '));
                        } else {
                            resend(typeof d === 'string' ? d : 'the upload failed.');
                        }
                        return false;
                    }

                    // If the wizard backend returned clarity check results, show them
                    if (data.data?.clarity_status === 'fail' && data.data?.quality_score) {
                        addMessage('assistant', `⚠️ Document clarity check: quality score ${data.data.quality_score.toFixed(2)}. Please upload a clearer image.`, null, { type: 'wizard_upload' });
                        return false;
                    }

                    // For National ID, also check name match using existing logic
                    // (name was already verified when set via /wizard/{id}/name)

                    const checkData = data.data || {};
                    const confidencePct = checkData.confidence_pct !== undefined
                        ? checkData.confidence_pct
                        : (checkData.confidence_score !== undefined ? Math.round(checkData.confidence_score * 100) : null);
                    const needsHumanReview = checkData.needs_human_review || (confidencePct !== null && confidencePct >= 51 && confidencePct <= 79);
                    const docs = [...wizardDocs.filter(d => d.docType !== docType),
                        {
                            docType,
                            filename: file.name,
                            extractedFields: checkData.extracted_fields || checkData.extractedFields || {},
                            malwareScan: checkData.malware_scan || 'clean',
                            malwareDetails: checkData.malware_details || '',
                            pdfValid: checkData.pdf_valid,
                            qualityScore: checkData.quality_score,
                            isBlurry: checkData.is_blurry || false,
                            blurryFields: checkData.blurry_fields || [],
                            confidencePct,
                            needsHumanReview,
                        }];
                    setWizardDocs(docs);
                    loadDocuments();   // the file is now stored server-side; refresh the Documents list

                    // If confidence < 50%, warn the user prominently
                    if (confidencePct !== null && confidencePct < 50) {
                        addMessage('assistant', `⚠️ Confidence score is ${confidencePct}% — too low to read the document clearly. Please upload a better, higher-resolution scan.`, null, { type: 'wizard_upload' });
                        return false;
                    }

                    // If 51–79%, human review message
                    if (needsHumanReview) {
                        addMessage('assistant', `📋 Confidence score is ${confidencePct}% — routed for human review. You may proceed to review the extracted data.`, null, { type: 'wizard_upload' });
                    }

                    const nextDoc = wizardRequiredDocs().find(d => !docs.some(u => u.docType === d));
                    if (nextDoc) {
                        const totalRequired = wizardRequiredDocs().length;
                        const uploadedCount = docs.length;
                        addMessage('assistant',
                            `✅ Your ${prettyDoc(docType)} has been verified and approved! `
                            + `Step ${uploadedCount + 1} of ${totalRequired}: now please upload your ${prettyDoc(nextDoc)} using the card below.`,
                            null, { type: 'wizard_upload' });
                    } else {
                        setWizardStep('review');
                        // Fetch fresh review data from backend
                        try {
                            const reviewRes = await fetch(`${API_BASE}/wizard/${wizardAppId}/review?token=${encodeURIComponent(token)}`);
                            const reviewData = await reviewRes.json().catch(() => ({}));
                            if (reviewData.success && reviewData.data && reviewData.data.document_checks) {
                                const docs = reviewData.data.document_checks.map(d => ({
                                    docType: d.doc_type,
                                    filename: d.file_name,
                                    extractedFields: d.extracted_fields || {},
                                    malwareScan: d.malware_scan || 'clean',
                                    malwareDetails: d.malware_details || '',
                                    pdfValid: d.pdf_valid,
                                    qualityScore: d.quality_score,
                                    isBlurry: d.is_blurry || false,
                                    blurryFields: d.blurry_fields || [],
                                    confidencePct: d.confidence_pct,
                                    needsHumanReview: d.needs_human_review,
                                }));
                                setWizardDocs(docs);
                            }
                        } catch (e) {
                            console.error('Failed to fetch review data:', e);
                        }
                        addMessage('assistant', 'All documents passed the checks. Please review what I filled in. Sensitive fields are masked and you can tap Show to double check them. Confirm when everything is correct, or replace a document.', null, { type: 'wizard_review' });
                    }
                    return true;
                } catch (e) {
                    resend('I could not reach the server.');
                    return false;
                } finally {
                    setWizardBusy(null);
                }
            };

            const wizardSubmitReview = async () => {
                if (wizardStep !== 'review') return;
                setWizardStep('submitting');
                setLoading(true);
                try {
                    const token = getToken();

                    // Step 3: record the confirmation on the server. /submit refuses (409)
                    // until the session is confirmed, and /edit resets that flag.
                    const confirmFields = {};
                    (wizardDocs || []).forEach(dc => Object.keys(dc.extractedFields || {}).forEach(k => { confirmFields[k] = true; }));
                    const confirmRes = await fetch(`${API_BASE}/wizard/${wizardAppId}/confirm?token=${encodeURIComponent(token)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },   // route requires a JSON body
                        body: JSON.stringify({ fields: confirmFields }),
                    });
                    const confirmData = await confirmRes.json().catch(() => ({}));
                    if (!confirmRes.ok || !confirmData.success) {
                        const cd = confirmData.detail || confirmData.error || confirmData.message;
                        const cmsg = typeof cd === 'string' ? cd : (cd?.message || JSON.stringify(cd) || 'unknown error');
                        setWizardStep('review');
                        addMessage('assistant', `Couldn't confirm your details: ${cmsg}. You can try Confirm again.`, null, { type: 'wizard_review' });
                        return;
                    }

                    // Step 4: submit
                    const res = await fetch(`${API_BASE}/wizard/${wizardAppId}/submit?token=${encodeURIComponent(token)}`, {
                        method: 'POST',
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok || !data.success) {
                        const d = data.detail || data.error || data.message;
                        const msg = typeof d === 'string' ? d : (d?.message || JSON.stringify(d) || 'unknown error');
                        setWizardStep('review');
                        addMessage('assistant', `Submission failed: ${msg}. You can try Confirm again.`, null, { type: 'wizard_review' });
                        return;
                    }
                    const refId = data.data?.reference_id;
                    const procTime = data.data?.processing_time || '2-3 business days';
                    setWizardStep('success');
                    addMessage('assistant', 'Your application has been successfully submitted!', null, {
                        type: 'wizard_success',
                        name: wizardName,
                        service: wizardService?.name || '',
                        refId: refId,
                        status: data.data?.status || 'Submitted',
                        processingTime: procTime
                    });
                    loadDocuments();
                } catch (e) {
                    setWizardStep('review');
                    addMessage('assistant', `Submission failed: ${e.message}. You can try Confirm again.`, null, { type: 'wizard_review' });
                } finally {
                    setLoading(false);
                }
            };

            const wizardReplaceDoc = (docType) => {
                setWizardDocs(prev => prev.filter(d => d.docType !== docType));
                setWizardStep('upload');
                addMessage('assistant', `No problem. Please send a new ${prettyDoc(docType)}.`, null, { type: 'wizard_upload' });
            };

            const wizardRestart = () => {
                addMessage('user', 'Start over');
                if (wizardService) beginService(wizardService);
            };

            const wizardCancel = async () => {
                if (!window.confirm('Are you sure you want to cancel this application? Any uploaded documents will be removed.')) {
                    return;
                }
                setLoading(true);
                try {
                    const token = getToken();
                    if (wizardAppId) {
                        await fetch(`${API_BASE}/wizard/${encodeURIComponent(wizardAppId)}/cancel${token ? `?token=${encodeURIComponent(token)}` : ''}`, {
                            method: 'POST'
                        }).catch(() => {});
                    }
                    setWizardStep(null);
                    setWizardDocs([]);
                    setWizardService(null);
                    setWizardName('');
                    setWizardAppId(null);
                    addMessage('assistant', 'Application cancelled. Any uploaded documents have been removed.');
                    loadDocuments();
                    loadApplications();
                } catch (e) {
                    console.error('Failed to cancel wizard application:', e);
                } finally {
                    setLoading(false);
                }
            };

            // Inline edit handler
            const wizardEditField = async (fieldKey, newValue) => {
                if (!newValue || newValue.trim().length < 2) {
                    addMessage('assistant', 'Please enter a valid value for this field.');
                    return null;
                }
                setLoading(true);
                try {
                    const token = getToken();
                    const res = await fetch(`${API_BASE}/wizard/${wizardAppId}/edit?token=${encodeURIComponent(token)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ field_name: fieldKey, field_value: newValue.trim() })
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok || !data.success) {
                        addMessage('assistant', `Could not update that field: ${data.detail || data.error || 'Unknown error'}. Please try again.`);
                        return null;
                    }
                    addMessage('assistant', `✓ Updated: ${newValue.trim()}. Please review the full information below.`);
                    // Re-fetch review data
                    const reviewRes = await fetch(`${API_BASE}/wizard/${wizardAppId}/review?token=${encodeURIComponent(token)}`);
                    const reviewData = await reviewRes.json().catch(() => ({}));
                    if (reviewData.success && reviewData.data && reviewData.data.document_checks) {
                        const docs = reviewData.data.document_checks.map(d => ({
                            docType: d.doc_type,
                            filename: d.file_name,
                            extractedFields: d.extracted_fields || {},
                            malwareScan: d.malware_scan || 'clean',
                            pdfValid: d.pdf_valid,
                            qualityScore: d.quality_score,
                            isBlurry: d.is_blurry || false,
                            blurryFields: d.blurry_fields || [],
                        }));
                        setWizardDocs(docs);
                    }
                    return true;
                } catch (e) {
                    addMessage('assistant', `Could not reach the server: ${e.message}. Please try again.`);
                    return null;
                } finally {
                    setLoading(false);
                }
            };

            // Called from the message list: {renderWizardMessage(msg)}. Only the newest card of each kind is shown.
            const renderWizardMessage = (msg) => {
                if (!msg.type || msg.dismissed) return null;
                if (messages.filter(m => m.type === msg.type).slice(-1)[0] !== msg) return null;
                if (msg.type === 'wizard_offer') {
                    if (wizardStep && wizardStep !== 'success') return null;
                    return <WizardOffer
                        onYes={() => { addMessage('user', 'Yes, start my application'); const svc = services.find(s => s.id === msg.serviceId); if (svc) beginService(svc); else initWizardSession(); }}
                        onNo={() => { dismissOffers(); addMessage('user', 'Not now'); addMessage('assistant', 'No problem. Just say the word whenever you want to apply.'); }} />;
                }
                if (msg.type === 'wizard_services') return <WizardServices services={services} onPick={startWizardService} />;
                if (msg.type === 'wizard_upload') {
                    return <WizardUpload docs={wizardRequiredDocs()} uploaded={wizardDocs} busy={wizardBusy}
                        onFile={wizardUploadDocument} isId={isIdDocument} pretty={prettyDoc} onCancel={wizardCancel} />;
                }
                if (msg.type === 'wizard_review') {
                    return <WizardReview name={wizardName} docs={wizardDocs} mask={maskWizardValue} pretty={prettyDoc}
                        disabled={wizardStep !== 'review'} onConfirm={wizardSubmitReview} onReplace={wizardReplaceDoc} onRestart={wizardRestart} onEdit={wizardEditField} onCancel={wizardCancel} />;
                }
                if (msg.type === 'wizard_success') {
                    return <SuccessResult name={msg.name} service={msg.service} refId={msg.refId}

                }
                return null;

            // Field labels for display
            const NATIONAL_ID_LABELS = {

                date_of_birth: 'Date of Birth',
                nationality: 'Nationality',
                issue_date: 'Issue Date',
                expiry_date: 'Expiry Date',
                gender: 'Gender',
                card_number: 'Card Number',
                occupation: 'Occupation',
                issue_place: 'Issue Place',
            };
            
            const PASSPORT_LABELS = {
                given_name: 'Given Name',
                surname: 'Surname',
                passport_number: 'Passport Number',
                date_of_birth: 'Date of Birth',
                nationality: 'Nationality',
                sex: 'Sex',
                date_of_issue: 'Date of Issue',
                date_of_expiry: 'Date of Expiry',
            };
            
            const DRIVING_LICENSE_LABELS = {
                name: 'Name',
                full_name: 'Full Name',
                license_no: 'License Number',
                license_number: 'License Number',
                nationality: 'Nationality',
                date_of_birth: 'Date of Birth',
                issue_date: 'Issue Date',
                expiry_date: 'Expiry Date',
                licensing_authority: 'Licensing Authority',
                place_of_issue: 'Place of Issue',
                traffic_code_no: 'Traffic Code No',
                traffic_code: 'Traffic Code No',
                gear_type: 'Gear Type',
                glasses_requirement: 'Glasses Requirement',
                restrictions: 'Restrictions',
            };

            const formatFieldValue = (key, value, serviceId) => {

                const fn = String(key).toLowerCase();
                const strVal = String(value).trim();

                // Glasses requirement: yes or no
                if (fn.includes('glasses')) {
                    const lower = strVal.toLowerCase();
                    if (lower === 'no' || lower === 'none' || lower === 'false' || lower.includes('no glasses')) {
                        return 'No';
                    }
                    if (lower === 'yes' || lower === 'true' || lower.includes('glasses') || lower.includes('logo') || lower.includes('required')) {
                        return 'Yes';
                    }
                    return 'Yes';
                }

                // For Mobility & Rental, capitalize each word in fields
                const isMobility = serviceId === 'mobility_rental' || (typeof serviceId === 'string' && serviceId.toLowerCase().includes('mobility'));
                if (isMobility) {
                    // Do not alter ISO dates or numbers
                    if (/^\d{1,4}[-/.]\d{1,2}[-/.]\d{1,4}$/.test(strVal) || /^\d+$/.test(strVal)) {
                        return strVal;
                    }
                    return strVal.replace(/\b\w+/g, txt => txt.charAt(0).toUpperCase() + txt.slice(1).toLowerCase());
                }

                return strVal;
            };

            const getDocLabels = (docType) => {
                if (!docType) return NATIONAL_ID_LABELS;
                const dt = String(docType).toLowerCase();
                if (dt.includes('licen')) return DRIVING_LICENSE_LABELS;
                if (dt.includes('passport')) return PASSPORT_LABELS;
                return NATIONAL_ID_LABELS;

                                    const rawDate = doc.upload_date || doc.date || doc.uploaded_at;

                                    const docTypeDisplay = docType.includes('licen') ? '🚗 Driving License' : docType === 'passport' ? '🛂 Passport' : '🆔 National ID';
                                    const token = getToken();
                                    const docId = doc.id || doc.document_id;
                                    const viewUrl = `${API_BASE}/documents/${encodeURIComponent(docId)}/view?token=${encodeURIComponent(token)}`;
                                    const downloadUrl = `${API_BASE}/documents/${encodeURIComponent(docId)}/download?token=${encodeURIComponent(token)}`;
                                    
                                    return (
                                        <div key={idx} style={{
                                            padding: '20px',
                                            background: '#1a1a1a',
                                            border: '1px solid #2a2a2a',
                                            borderRadius: '12px',
                                        }}>
                                            {/* Header */}
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px', paddingBottom: '12px', borderBottom: '1px solid #2a2a2a', flexWrap: 'wrap', gap: '12px' }}>
                                                <div>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '6px', flexWrap: 'wrap' }}>
                                                        <span style={{ fontSize: '15px', fontWeight: '600', color: '#f3f4f6' }}>
                                                            {doc.filename || doc.name || 'Unknown file'}
                                                        </span>
                                                        <span style={{
                                                            padding: '2px 8px',
                                                            background: '#1e3a5f',
                                                            color: '#60a5fa',
                                                            border: '1px solid #2563eb55',
                                                            borderRadius: '6px',
                                                            fontSize: '11px',
                                                            fontWeight: '500',
                                                            display: 'inline-flex',
                                                            alignItems: 'center',
                                                            gap: '4px'
                                                        }}>
                                                            <i className="fas fa-briefcase" style={{ fontSize: '10px' }}></i> {serviceDisplayName}
                                                        </span>
                                                    </div>
                                                    <div style={{ fontSize: '12px', color: '#888', display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' }}>
                                                        <span><i className="far fa-clock" style={{ marginRight: '4px' }}></i>{formattedDate}</span>
                                                        <span>·</span>
                                                        <span>{formatFileSize(doc.file_size || doc.size || 0)}</span>
                                                        <span>·</span>
                                                        <span>{docTypeDisplay}</span>
                                                    </div>
                                                </div>
                                                <div style={{ display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' }}>
                                                    {doc.extraction_confidence !== undefined && (
                                                        <span style={{ fontSize: '12px', color: doc.extraction_confidence > 0.7 ? '#22c55e' : doc.extraction_confidence > 0.4 ? '#eab308' : '#ef4444' }}>
                                                            {(doc.extraction_confidence * 100).toFixed(0)}% confidence
                                                        </span>
                                                    )}
                                                    <span style={{ fontSize: '12px', color: '#22c55e', marginRight: '4px' }}>
                                                        ✓ Processed
                                                    </span>

                                                    {/* View & Download buttons */}
                                                    {docId && (
                                                        <a
                                                            href={viewUrl}
                                                            target="_blank"
                                                            rel="noopener noreferrer"
                                                            className="btn btn-secondary"
                                                            style={{ fontSize: '12px', padding: '6px 10px', textDecoration: 'none', display: 'inline-flex', alignItems: 'center', gap: '5px' }}
                                                            title="View original document"
                                                        >
                                                            <i className="fas fa-eye"></i> View
                                                        </a>
                                                    )}
                                                    {docId && (
                                                        <a
                                                            href={downloadUrl}
                                                            download
                                                            className="btn btn-primary"
                                                            style={{ fontSize: '12px', padding: '6px 10px', textDecoration: 'none', display: 'inline-flex', alignItems: 'center', gap: '5px' }}
                                                            title="Download original document"
                                                        >
                                                            <i className="fas fa-download"></i> Download
                                                        </a>
                                                    )}
                                                </div>

                                            {/* Extracted Fields Table */}

                                                </div>

                                    );

            );

            const renderApplicationsPage = () => (
                <div className="chat-area" style={{ overflowY: 'auto' }}>
                    <div className="page-header">

                        <div style={{ display: 'flex', gap: '8px' }}>

                            </button>

                            </button>
                        </div>
                    </div>
                    <div style={{ padding: '0 24px 24px' }}>
                        {applications.length === 0 ? (
                            <div style={{ textAlign: 'center', padding: '60px 20px', color: '#666' }}>
                                <div style={{ fontSize: '48px', marginBottom: '16px' }}>📝</div>
                                <div style={{ fontSize: '18px', marginBottom: '8px' }}>No applications submitted yet</div>
                                <div style={{ fontSize: '14px', color: '#888', marginBottom: '16px' }}>
                                    Your completed service onboarding applications will be securely stored and listed here.
                                </div>
                                <button className="btn btn-primary" onClick={() => {

                                    handleStartApplication();

                        ) : (

                                    const isReview = appStatus.includes('REVIEW');
                                    const badgeBg = isComplete ? 'rgba(34, 197, 94, 0.15)' : isReview ? 'rgba(245, 158, 11, 0.15)' : 'rgba(239, 68, 68, 0.15)';
                                    const badgeColor = isComplete ? '#22c55e' : isReview ? '#f59e0b' : '#ef4444';
                                    const badgeBorder = isComplete ? 'rgba(34, 197, 94, 0.35)' : isReview ? 'rgba(245, 158, 11, 0.35)' : 'rgba(239, 68, 68, 0.35)';

                                    return (

                                            boxShadow: '0 8px 32px rgba(0,0,0,0.3)',

                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>

                                                        </div>

                                                    {app.applicant_name && (
                                                        <div style={{ fontSize: '13px', color: '#84BD00', marginTop: '4px', fontWeight: '500' }}>
                                                            <i className="fas fa-user" style={{ marginRight: '6px', opacity: 0.8 }}></i>

                                                    <div style={{ fontSize: '12px', color: '#777', marginTop: '6px' }}>

                                                    </div>

                                                <span style={{
                                                    padding: '6px 14px',
                                                    borderRadius: '20px',
                                                    fontSize: '11px',

                                                    background: badgeBg,
                                                    color: badgeColor,
                                                    border: `1px solid ${badgeBorder}`,

                                                    {appStatus.replace(/_/g, ' ')}

                                            <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: '6px', paddingTop: '12px', borderTop: '1px solid rgba(255,255,255,0.06)' }}>
                                                <button

                                                    style={{
                                                        color: '#ef4444',
                                                        borderColor: 'rgba(239, 68, 68, 0.3)',
                                                        background: 'rgba(239, 68, 68, 0.08)',
                                                        fontSize: '12px',
                                                        padding: '6px 14px',
                                                        borderRadius: '8px',
                                                        cursor: 'pointer',
                                                        display: 'inline-flex',
                                                        alignItems: 'center',
                                                        gap: '6px',
                                                    }}
                                                    onClick={() => handleCancelApplication(app.id || app.application_id)}
                                                >
                                                    <i className="fas fa-times-circle"></i> Cancel Application
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </div>
            );

            const renderServicesPage = () => {
                const availableServices = services.filter(s => s.status === 'available');
                const comingSoonServices = services.filter(s => s.status !== 'available');

                const renderServiceCard = (svc, isAvailable) => (
                    <div key={svc.id} style={{
                        padding: '22px',
                        background: 'rgba(26, 26, 26, 0.75)',
                        border: isAvailable ? '1px solid rgba(132, 189, 0, 0.25)' : '1px dashed rgba(255, 255, 255, 0.15)',
                        borderRadius: '14px',
                        backdropFilter: 'blur(12px)',
                        display: 'flex',
                        flexDirection: 'column',
                        gap: '14px',
                        transition: 'all 0.25s ease',
                        boxShadow: isAvailable ? '0 4px 20px -5px rgba(0,0,0,0.5)' : 'none',
                        opacity: isAvailable ? 1 : 0.88
                    }}>
                        <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: '12px' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                                <div style={{ fontSize: '32px', filter: isAvailable ? 'drop-shadow(0 0 8px rgba(132,189,0,0.3))' : 'grayscale(60%)' }}>
                                    {getServiceIcon(svc.id)}
                                </div>
                                <div>
                                    <div style={{ fontSize: '16px', fontWeight: '700', color: '#fff', letterSpacing: '-0.01em' }}>
                                        {svc.name}
                                    </div>
                                    <div style={{ fontSize: '11px', fontWeight: '600', textTransform: 'uppercase', letterSpacing: '0.06em', color: isAvailable ? '#84BD00' : '#888', marginTop: '3px' }}>
                                        {isAvailable ? '● Available Now' : '⏳ Coming Soon'}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div style={{ fontSize: '13px', color: '#bbb', lineHeight: '1.6' }}>
                            {svc.description || 'Comprehensive document onboarding and verification service.'}
                        </div>

                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', fontSize: '12px', background: 'rgba(0, 0, 0, 0.25)', padding: '12px', borderRadius: '8px', border: '1px solid rgba(255, 255, 255, 0.04)' }}>
                            <div>
                                <span style={{ color: '#888', fontWeight: '600', textTransform: 'uppercase', fontSize: '10px', letterSpacing: '0.05em' }}>Required Documents:</span>
                                <div style={{ marginTop: '6px', display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
                                    {(svc.documents_required || []).length > 0 
                                        ? (svc.documents_required || []).map((d, i) => (
                                            <span key={i} style={{ 
                                                display: 'inline-flex',
                                                alignItems: 'center',
                                                padding: '3px 8px', 
                                                background: 'rgba(255, 255, 255, 0.06)', 
                                                border: '1px solid rgba(255, 255, 255, 0.08)',
                                                borderRadius: '6px', 
                                                fontSize: '11px',
                                                color: '#ddd'
                                            }}>
                                                <i className="fas fa-file-check" style={{ marginRight: '5px', fontSize: '10px', color: '#84BD00' }}></i>
                                                {d.replace(/_/g, ' ')}
                                            </span>
                                        ))
                                        : <span style={{ color: '#666', fontStyle: 'italic' }}>None specified</span>
                                    }
                                </div>
                            </div>
                            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: '4px', paddingTop: '6px', borderTop: '1px solid rgba(255, 255, 255, 0.05)' }}>
                                <span style={{ color: '#888', fontWeight: '600', textTransform: 'uppercase', fontSize: '10px', letterSpacing: '0.05em' }}>Processing Time:</span>
                                <span style={{ color: '#84BD00', fontWeight: '600' }}>{svc.processing_time || 'Instant'}</span>
                            </div>
                        </div>

                        <div style={{ display: 'flex', gap: '8px', marginTop: '4px' }}>
                            {isAvailable ? (
                                <button className="btn btn-primary" onClick={() => {
                                    setShowServicesPage(false);
                                    startApplication(svc.id);
                                }} style={{ flex: 1, padding: '8px 12px', fontSize: '13px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '6px', borderRadius: '8px' }}>
                                    <i className="fas fa-play"></i> Apply for this service
                                </button>
                            ) : (
                                <div style={{ flex: 1, padding: '8px 12px', fontSize: '12px', textAlign: 'center', color: '#777', background: 'rgba(255,255,255,0.03)', borderRadius: '8px', border: '1px solid rgba(255,255,255,0.05)' }}>
                                    <i className="fas fa-lock" style={{ marginRight: '6px' }}></i>Opening soon
                                </div>
                            )}
                            <button className="btn btn-secondary" onClick={() => {
                                if (user) {
                                    setShowServicesPage(false);
                                    sendMessage(`Tell me about ${svc.name}`);
                                } else {
                                    setShowAuth(true);
                                }
                            }} style={{ padding: '8px 14px', fontSize: '13px', borderRadius: '8px' }} title="Ask Lynx AI about this service">
                                <i className="fas fa-comment-dots" style={{ marginRight: '4px' }}></i> Ask
                            </button>
                        </div>
                    </div>
                );

                return (
                    <div className="chat-area" style={{ overflowY: 'auto' }}>
                        <div className="page-header" style={{ borderBottom: '1px solid rgba(255,255,255,0.08)', padding: '18px 24px' }}>
                            <div>
                                <h2 style={{ fontSize: '20px', fontWeight: '700', letterSpacing: '-0.02em', display: 'flex', alignItems: 'center', gap: '10px' }}>
                                    <i className="fas fa-cubes" style={{ color: '#84BD00' }}></i> Service Catalog
                                </h2>
                                <div style={{ fontSize: '13px', color: '#888', marginTop: '4px' }}>
                                    Browse available intake programs and upcoming automated verification pipelines.
                                </div>
                            </div>
                            <button className="btn btn-secondary" onClick={() => setShowServicesPage(false)} style={{ borderRadius: '8px' }}>
                                <i className="fas fa-arrow-left" style={{ marginRight: '6px' }}></i>Back to Chat
                            </button>
                        </div>

                        <div style={{ padding: '24px' }}>
                            {services.length === 0 ? (
                                <div style={{ textAlign: 'center', padding: '60px 20px', color: '#666' }}>
                                    <div style={{ fontSize: '48px', marginBottom: '16px' }}>🔧</div>
                                    <div style={{ fontSize: '18px', marginBottom: '8px' }}>No services available</div>
                                    <div style={{ fontSize: '14px', color: '#888' }}>
                                        No services have been loaded yet. Please check the system configuration.
                                    </div>
                                </div>
                            ) : (
                                <div style={{
                                    display: 'grid',
                                    gridTemplateColumns: 'repeat(auto-fit, minmax(340px, 1fr))',
                                    gap: '24px',
                                    alignItems: 'start'
                                }}>
                                    {/* Column 1: Available Services */}
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                                        <div style={{
                                            display: 'flex',
                                            alignItems: 'center',
                                            justifyContent: 'space-between',
                                            paddingBottom: '8px',
                                            borderBottom: '2px solid rgba(132, 189, 0, 0.4)'
                                        }}>
                                            <div style={{ fontSize: '15px', fontWeight: '700', color: '#fff', display: 'flex', alignItems: 'center', gap: '8px' }}>
                                                <i className="fas fa-check-circle" style={{ color: '#84BD00' }}></i>
                                                Available Services
                                            </div>
                                            <span style={{ fontSize: '12px', background: 'rgba(132, 189, 0, 0.15)', color: '#84BD00', padding: '2px 8px', borderRadius: '10px', fontWeight: '600' }}>
                                                {availableServices.length} Active
                                            </span>
                                        </div>

                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                                            {availableServices.length === 0 ? (
                                                <div style={{ padding: '20px', color: '#666', textAlign: 'center', background: '#161616', borderRadius: '10px' }}>
                                                    No available services right now.
                                                </div>
                                            ) : (
                                                availableServices.map(svc => renderServiceCard(svc, true))
                                            )}
                                        </div>
                                    </div>

                                    {/* Column 2: Coming Soon */}
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                                        <div style={{
                                            display: 'flex',
                                            alignItems: 'center',
                                            justifyContent: 'space-between',
                                            paddingBottom: '8px',
                                            borderBottom: '2px solid rgba(255, 255, 255, 0.15)'
                                        }}>
                                            <div style={{ fontSize: '15px', fontWeight: '700', color: '#bbb', display: 'flex', alignItems: 'center', gap: '8px' }}>
                                                <i className="fas fa-clock" style={{ color: '#888' }}></i>
                                                Coming Soon
                                            </div>
                                            <span style={{ fontSize: '12px', background: 'rgba(255, 255, 255, 0.08)', color: '#aaa', padding: '2px 8px', borderRadius: '10px', fontWeight: '600' }}>
                                                {comingSoonServices.length} In Pipeline
                                            </span>
                                        </div>

                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                                            {comingSoonServices.length === 0 ? (
                                                <div style={{ padding: '20px', color: '#666', textAlign: 'center', background: '#161616', borderRadius: '10px' }}>
                                                    No upcoming services announced yet.
                                                </div>
                                            ) : (
                                                comingSoonServices.map(svc => renderServiceCard(svc, false))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // Auth Modal
            if (showAuth) {
                return (
                    <div className="modal-overlay">
                        <div className="modal">
                            <div className="modal-title">
                                {authMode === 'login' ? 'Welcome Back' : 'Create Account'}
                            </div>
                            <div className="modal-subtitle">
                                {authMode === 'login' ? 'Sign in to continue' : 'Get started with DocIntake'}
                            </div>

                            <div className="form-group">
                                <label>Username</label>
                                <input
                                    className="form-input"
                                    value={authData.username}
                                    onChange={e => setAuthData({...authData, username: e.target.value})}
                                    placeholder="Enter username"
                                />
                            </div>

                            {authMode === 'register' && (
                                <div className="form-group">
                                    <label>Email Address</label>
                                    <input
                                        className="form-input"
                                        type="email"
                                        value={authData.email}
                                        onChange={e => setAuthData({...authData, email: e.target.value})}
                                        placeholder="Enter your email"
                                        autoComplete="email"
                                    />
                                </div>
                            )}

                            <div className="form-group">
                                <label>Password</label>
                                <div className="password-wrapper">
                                    <input
                                        className="form-input"
                                        type={showPassword ? "text" : "password"}
                                        value={authData.password}
                                        onChange={e => setAuthData({...authData, password: e.target.value})}
                                        placeholder="Enter password"
                                        onKeyDown={e => e.key === 'Enter' && handleAuth()}
                                        style={{ paddingRight: '40px' }}
                                    />
                                    <button
                                        type="button"
                                        className="password-toggle"
                                        onClick={() => setShowPassword(!showPassword)}
                                        tabIndex="-1"
                                        aria-label={showPassword ? "Hide password" : "Show password"}
                                    >
                                        <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                    </button>
                                </div>
                            </div>

                            {authMode === 'register' && (
                                <div className="form-group">
                                    <label>Full Name (optional)</label>
                                    <input
                                        className="form-input"
                                        value={authData.name}
                                        onChange={e => setAuthData({...authData, name: e.target.value})}
                                        placeholder="Enter your name"
                                    />
                                </div>
                            )}

                    {authError && (
                        <div>
                            <div className="error-msg">{authError}</div>
                            <div style={{ display: 'flex', gap: '8px', marginTop: '8px' }}>
                                <button
                                    className="btn btn-ghost"
                                    onClick={() => setAuthError('')}
                                    style={{ flex: 1 }}
                                >
                                    Try again
                                </button>
                                <button
                                    className="btn btn-ghost"
                                    onClick={() => setShowAuth(false)}
                                    style={{ flex: 1 }}
                                >
                                    Cancel
                                </button>
                            </div>
                        </div>
                    )}

                            <button className="btn btn-primary" onClick={handleAuth} style={{ width: '100%', marginTop: '16px' }}>
                                {authMode === 'login' ? 'Sign In' : 'Create Account'}
                            </button>

                            <button
                                className="btn btn-ghost"
                                onClick={() => setShowAuth(false)}
                                style={{ width: '100%', marginTop: '8px' }}
                            >
                                ← Back to Chat
                            </button>

                                    <button
                                        className="btn btn-ghost"
                                        onClick={() => {
                                            setAuthMode(authMode === 'login' ? 'register' : 'login');
                                            setAuthError('');
                                        }}
                                        style={{ width: '100%', marginTop: '8px' }}
                                    >
                                        {authMode === 'login' ? "Don't have an account? Sign up" : 'Already have an account? Sign in'}
                                    </button>
                                </div>
                            </div>
                        );
            }

            return (
                <div>
                    {/* Top bar */}
                    <div className="topbar">
                        <div className="topbar-left">
                            <button className="sidebar-toggle" onClick={() => setSidebarOpen(!sidebarOpen)}>
                                <i className="fas fa-bars"></i>
                            </button>
                            <div className="logo">DocIntake</div>
                            <div className="topbar-time">{currentTime}</div>
                        </div>
                        <div className="topbar-right">
                            {user ? (
                                <>
                                    <span style={{ fontSize: '13px', color: '#888' }}>Logged in as {user.username}</span>
                                    <button className="btn btn-ghost" onClick={handleLogout}>
                                        <i className="fas fa-sign-out-alt"></i> Logout
                                    </button>
                                </>
                            ) : (
                                <button className="btn btn-primary" onClick={() => setShowAuth(true)}>
                                    <i className="fas fa-user"></i> Login
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Main layout */}
                    <div className="main-layout">
                        {sidebarOpen && (
                            <div className="sidebar-backdrop" onClick={() => setSidebarOpen(false)} />
                        )}
                        {/* Sidebar */}
                        <div className={`sidebar ${!sidebarOpen ? 'collapsed' : ''}`}>
                            <div className="sidebar-header">
                                <button className="sidebar-btn" onClick={() => { handleResetChat(); if (window.innerWidth <= 768) setSidebarOpen(false); }}>
                                    <i className="fas fa-undo"></i>
                                    Reset Chat
                                </button>
                                <button className="sidebar-btn" onClick={() => { handleStartApplication(); if (window.innerWidth <= 768) setSidebarOpen(false); }} style={{ borderColor: '#84BD00', background: 'rgba(132, 189, 0, 0.1)' }}>
                                    <i className="fas fa-file-alt"></i>
                                    Start New Application
                                </button>
                            </div>

                            <div className="sidebar-section">
                                <div className="sidebar-section-title">Navigation</div>
                                <div className={`sidebar-item ${!showServicesPage && !showDocumentsPage && !showApplicationsPage && !showApplicationFlow ? 'active' : ''}`} onClick={() => { setShowDocumentsPage(false); setShowServicesPage(false); setShowApplicationsPage(false); setShowApplicationFlow(false); setMessages([]); if (window.innerWidth <= 768) setSidebarOpen(false); }}>
                                    <i className="fas fa-comment"></i> Chat
                                </div>
                                <div className={`sidebar-item ${showServicesPage ? 'active' : ''}`} onClick={() => { setShowServicesPage(true); setShowDocumentsPage(false); setShowApplicationsPage(false); setShowApplicationFlow(false); if (window.innerWidth <= 768) setSidebarOpen(false); }}>
                                    <i className="fas fa-cogs"></i> Services
                                </div>
                                <div className={`sidebar-item ${showDocumentsPage ? 'active' : ''}`} onClick={() => { setShowDocumentsPage(true); setShowServicesPage(false); setShowApplicationsPage(false); setShowApplicationFlow(false); loadDocuments(); if (window.innerWidth <= 768) setSidebarOpen(false); }}>
                                    <i className="fas fa-folder"></i> Documents
                                    <span style={{ marginLeft: 'auto', fontSize: '12px', color: '#666' }}>{documents.length}</span>
                                </div>
                                <div className={`sidebar-item ${showApplicationsPage ? 'active' : ''}`} onClick={() => { setShowApplicationsPage(true); setShowDocumentsPage(false); setShowServicesPage(false); setShowApplicationFlow(false); loadApplications(); if (window.innerWidth <= 768) setSidebarOpen(false); }}>
                                    <i className="fas fa-file-invoice"></i> Applications
                                    <span style={{ marginLeft: 'auto', fontSize: '12px', color: '#666' }}>{applications.length}</span>
                                </div>
                            </div>

                            <div className="sidebar-status">
                                <div className="status-item">
                                    <div className={`status-dot ${systemHealthy ? '' : 'offline'}`}></div>
                                    <span style={{ color: systemHealthy ? '#22c55e' : '#666' }}>
                                        {systemHealthy ? 'System Online' : 'System Offline'}
                                    </span>
                                </div>
                                <div className="status-item">
                                    <div className={`status-dot ${ollamaHealthy ? '' : 'offline'}`}></div>
                                    <span style={{ color: ollamaHealthy ? '#22c55e' : '#666' }}>
                                        {ollamaHealthy ? 'Ollama Connected' : 'Ollama Offline'}
                                    </span>
                                </div>
                            </div>
                        </div>

                        {/* Content area */}
                        {showServicesPage ? (
                            renderServicesPage()
                        ) : showDocumentsPage ? (
                            renderDocumentsPage()
                        ) : showApplicationsPage ? (
                            renderApplicationsPage()
                        ) : (
                            <div className="chat-area">
                            <div className="chat-messages">
                                {messages.length === 0 ? (
                                    <div className="welcome-message">
                                        <div className="welcome-icon">🦊</div>
                                        <div className="welcome-title">Welcome to DocIntake</div>
                                        <div className="welcome-text">Hi! I'm Lynx — your AI assistant for document onboarding. How can I help you today?</div>
                                        <div className="feature-grid">
                                            <div className="feature-card" onClick={() => handleFeatureClick('I want to apply for basic registration')}>
                                                <div className="feature-icon">🆔</div>
                                                <div className="feature-title">Basic Registration</div>
                                                <div className="feature-desc">Simple identity registration</div>
                                            </div>
                                            <div className="feature-card" onClick={() => handleFeatureClick('I want to apply for premium cross-border service')}>
                                                <div className="feature-icon">🌍</div>
                                                <div className="feature-title">Cross Border</div>
                                                <div className="feature-desc">International verification</div>
                                            </div>
                                            <div className="feature-card" onClick={() => handleFeatureClick('I need mobility or rental service')}>
                                                <div className="feature-icon">🚗</div>
                                                <div className="feature-title">Mobility/Rental</div>
                                                <div className="feature-desc">Vehicle rental service</div>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <>
                                        {messages.map((msg, idx) => (
                                            msg.role === 'system' ? (
                                                <div key={idx} className="system-message">
                                                    <div className="message-content">
                                                        {msg.content}
                                                    </div>
                                                </div>
                                            ) : (
                                                <div key={idx} className={`message ${msg.role}`}>
                                                    <div className="message-avatar">
                                                        {msg.role === 'assistant' ? '🦊' : '👤'}
                                                    </div>
                                                    <div>
                                                        <div className="message-content">
                                                            {msg.content.split('\n').map((line, i) => (
                                                                <div key={i}>{line}</div>
                                                            ))}
                                                        </div>
                                                        {renderWizardMessage(msg)}
                                                        {msg.service && (
                                                            <div className="service-badge">
                                                                <span>{getServiceIcon(msg.service)}</span>
                                                                <span>Connected to: {msg.service.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase())}</span>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            )
                                        ))}
                                    </>
                                )}
                                {loading && (
                                    <div className="message assistant">
                                        <div className="message-avatar">🦊</div>
                                        <div className="message-content">
                                            <div className="typing-indicator">
                                                <div className="typing-dot"></div>
                                                <div className="typing-dot"></div>
                                                <div className="typing-dot"></div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                                <div ref={chatEndRef} />
                            </div>

                            <div className="chat-input-area">
                                <div className="input-container">
                                    <div className="input-wrapper">
                                        <textarea
                                            id="chatInput"
                                            value={input}
                                            onChange={e => setInput(e.target.value)}
                                            placeholder="Type your message..."
                                            rows="1"
                                            onKeyDown={e => {
                                                if (e.key === 'Enter' && !e.shiftKey) {
                                                    e.preventDefault();
                                                    sendMessage();
                                                }
                                            }}
                                        />
                                        <button className="send-btn" onClick={() => sendMessage()} disabled={loading}>
                                            <i className="fas fa-paper-plane"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
