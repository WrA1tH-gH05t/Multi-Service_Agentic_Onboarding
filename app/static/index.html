<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocIntake - AI Document Onboarding</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e4e4e4;
            overflow: auto;
        }

        #root {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top bar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #141414;
            border-bottom: 1px solid #2a2a2a;
            z-index: 100;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-toggle {
            background: none;
            border: none;
            color: #888;
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .sidebar-toggle:hover {
            background: #2a2a2a;
            color: #fff;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #84BD00;
        }

        .topbar-time {
            font-size: 12px;
            color: #888;
            font-weight: 500;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-ghost {
            background: none;
            color: #888;
        }

        .btn-ghost:hover {
            color: #fff;
            background: #2a2a2a;
        }

        .btn-primary {
            background: #84BD00;
            color: #121314;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #5f8700;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #2a2a2a;
            color: #e4e4e4;
        }

        .btn-secondary:hover {
            background: #3a3a3a;
        }

        .btn-success {
            background: #22c55e;
            color: white;
        }

        .btn-success:hover {
            background: #16a34a;
        }

        /* Main layout */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: #111111;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            transition: width 0.3s, opacity 0.3s;
            overflow: hidden;
        }

        .sidebar.collapsed {
            width: 0;
            opacity: 0;
            border: none;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #2a2a2a;
        }

        .sidebar-btn {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #e4e4e4;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            transition: all 0.2s;
            margin-bottom: 8px;
        }

        .sidebar-btn:hover {
            background: #2a2a2a;
            border-color: #84BD00;
        }

        .sidebar-section {
            padding: 12px 16px;
        }

        .sidebar-section-title {
            font-size: 11px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .sidebar-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #999;
            transition: all 0.2s;
            margin-bottom: 2px;
        }

        .sidebar-item:hover, .sidebar-item.active {
            background: #1a1a1a;
            color: #e4e4e4;
        }

        .sidebar-item i {
            width: 16px;
            text-align: center;
        }

        .sidebar-status {
            margin-top: auto;
            padding: 16px;
            border-top: 1px solid #2a2a2a;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
        }

        .status-dot.offline {
            background: #666;
        }

        /* Chat area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
    }

    .scroll-to-top {
    position: fixed;
    bottom: 80px;
    right: 20px;
    width: 40px;
    height: 40px;
    background: #84BD00;
    border: none;
    border-radius: 50%;
    color: #121314;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 50;
    }

    .scroll-to-top.visible {
    opacity: 1;
    }

    .scroll-to-top:hover {
    background: #5f8700;
    }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.assistant .message-avatar {
            background: #84BD00;
            color: #121314;
        }

        .message.user .message-avatar {
            background: #333;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
        }

        .message.assistant .message-content {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-top-left-radius: 4px;
        }

        .message.user .message-content {
            background: #84BD00;
            color: #121314;
            border-top-right-radius: 4px;
        }

        .system-message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s ease-in;
            justify-content: center;
        }

        .system-message .message-content {
            background: transparent;
            border: 1px solid #2a2a2a;
            color: #888;
            font-size: 13px;
            padding: 8px 12px;
            text-align: center;
        }

        .service-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(132, 189, 0, 0.12);
            border: 1px solid rgba(132, 189, 0, 0.35);
            border-radius: 6px;
            font-size: 11px;
            color: #84BD00;
            margin-top: 8px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #666;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* Input area */
        .chat-input-area {
            padding: 20px;
            background: #141414;
            border-top: 1px solid #2a2a2a;
        }

        .input-container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 12px 16px;
            gap: 12px;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #84BD00;
        }

        .upload-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 4px;
            font-size: 18px;
            transition: color 0.2s;
        }

        .upload-btn:hover {
            color: #84BD00;
        }

        #chatInput {
            flex: 1;
            background: none;
            border: none;
            color: #e4e4e4;
            font-size: 15px;
            outline: none;
            resize: none;
            min-height: 24px;
            max-height: 120px;
        }

        .send-btn {
            background: #84BD00;
            border: none;
            color: #121314;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #5f8700;
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .file-preview {
            margin-top: 8px;
            padding: 8px 12px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            font-size: 12px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-remove {
            cursor: pointer;
            color: #ef4444;
        }

        /* Auth modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s;
        }

        .modal {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .modal-subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #999;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #e4e4e4;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #84BD00;
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 4px;
            font-size: 14px;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: #e4e4e4;
        }

        .error-msg {
            color: #ef4444;
            font-size: 12px;
            margin-top: 6px;
        }

        .welcome-message {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .welcome-icon {
            font-size: 48px;
            margin-bottom: 16px;
            color: #84BD00;
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #e4e4e4;
        }

        .welcome-text {
            font-size: 16px;
            margin-bottom: 32px;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            max-width: 860px;
            margin: 0 auto;
        }

        .feature-card {
            padding: 20px 16px;
            background: rgba(26, 26, 26, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            backdrop-filter: blur(12px);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(132, 189, 0, 0.6), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .feature-card:hover {
            border-color: rgba(132, 189, 0, 0.5);
            background: rgba(32, 35, 30, 0.85);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px -6px rgba(132, 189, 0, 0.15);
        }

        .feature-card:hover::before {
            opacity: 1;
        }

        .feature-icon {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .feature-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .feature-desc {
            font-size: 12px;
            color: #666;
        }

        /* Page header */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
        }

        .page-header h2 {
            font-size: 20px;
            font-weight: 600;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }

        /* Step indicator */
        .step-indicator {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 16px;
            margin-top: 8px;
            max-width: 520px;
        }

        .step-progress {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .step-node {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .step-node.active {
            background: rgba(132, 189, 0, 0.15);
            color: #84BD00;
            border: 1px solid rgba(132, 189, 0, 0.4);
        }

        .step-node.completed {
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .step-node.pending {
            background: #141414;
            color: #666;
            border: 1px solid #2a2a2a;
        }

        .step-arrow {
            color: #444;
            font-size: 10px;
        }

        .step-typing {
            font-size: 13px;
            color: #888;
            margin-top: 8px;
            font-style: italic;
        }

        .step-typing-cursor {
            display: inline-block;
            width: 2px;
            height: 14px;
            background: #84BD00;
            margin-left: 2px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Upload zone */
        .upload-zone {
            border: 2px dashed #2a2a2a;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            transition: all 0.2s;
            margin-top: 12px;
            cursor: pointer;
        }

        .upload-zone:hover, .upload-zone.drag-over {
            border-color: #84BD00;
            background: rgba(132, 189, 0, 0.05);
        }

        .upload-zone-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .upload-zone-text {
            font-size: 13px;
            color: #888;
            margin-bottom: 4px;
        }

        .upload-zone-hint {
            font-size: 11px;
            color: #666;
        }

        .upload-zone-browse {
            color: #84BD00;
            text-decoration: underline;
            cursor: pointer;
        }

        /* Check results */
        .check-result {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px;
            margin-top: 8px;
            font-size: 12px;
        }

        .check-result.success {
            border-color: rgba(34, 197, 94, 0.3);
        }

        .check-result.warning {
            border-color: rgba(234, 179, 8, 0.3);
        }

        .check-result.error {
            border-color: rgba(239, 68, 68, 0.3);
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .check-item:last-child {
            margin-bottom: 0;
        }

        .check-icon {
            font-size: 14px;
            width: 20px;
            text-align: center;
        }

        .check-icon.pass { color: #22c55e; }
        .check-icon.fail { color: #ef4444; }
        .check-icon.warn { color: #eab308; }

        /* Inline edit */
        .field-edit-row {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 6px 0;
            font-size: 12px;
        }

        .field-edit-label {
            color: #888;
            min-width: 120px;
        }

        .field-edit-value {
            flex: 1;
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            padding: 6px 10px;
            color: #e4e4e4;
            font-size: 12px;
            outline: none;
        }

        .field-edit-value:focus {
            border-color: #84BD00;
        }

        .field-edit-save {
            padding: 4px 10px;
            background: #84BD00;
            color: #121314;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
        }

        .field-edit-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .blurry-notice {
            background: rgba(234, 179, 8, 0.1);
            border: 1px solid rgba(234, 179, 8, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-top: 8px;
            font-size: 12px;
            color: #eab308;
        }

        .blurry-notice strong {
            display: block;
            margin-bottom: 4px;
        }

        /* Submission result */
        .submission-result {
            background: #1a1a1a;
            border: 2px solid #84BD00;
            border-radius: 12px;
            padding: 20px;
            margin-top: 8px;
            text-align: center;
        }

        .submission-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .submission-ref {
            font-size: 18px;
            font-weight: 700;
            color: #84BD00;
            margin: 12px 0;
            font-family: monospace;
        }

        .submission-detail {
            font-size: 13px;
            color: #888;
            margin: 6px 0;
        }

        .submission-detail strong {
            color: #e4e4e4;
        }

        /* ===== Responsive Design & Polish ===== */
        .sidebar-backdrop {
            display: none;
        }

        @media (max-width: 900px) {
            .feature-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            #root {
                height: 100dvh;
            }

            .topbar {
                padding: 10px 14px;
            }

            .logo {
                font-size: 18px;
            }

            .topbar-time {
                display: none;
            }

            .topbar-right span {
                display: none;
            }

            .main-layout {
                position: relative;
                overflow: hidden;
            }

            /* Responsive off-canvas sidebar */
            .sidebar {
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                width: 280px;
                z-index: 500;
                box-shadow: 4px 0 24px rgba(0, 0, 0, 0.7);
                transform: translateX(0);
                transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .sidebar.collapsed {
                transform: translateX(-100%);
                width: 280px;
                opacity: 1;
                pointer-events: none;
            }

            .sidebar-backdrop {
                display: block;
                position: absolute;
                inset: 0;
                background: rgba(0, 0, 0, 0.65);
                backdrop-filter: blur(4px);
                z-index: 490;
                animation: fadeIn 0.2s ease-in-out;
            }

            .chat-messages {
                padding: 14px 12px;
                gap: 12px;
            }

            .message {
                max-width: 92%;
            }

            .chat-input-area {
                padding: 12px;
            }

            .input-wrapper {
                padding: 8px 12px;
            }

            .welcome-message {
                padding: 30px 12px;
            }

            .welcome-title {
                font-size: 22px;
            }

            .welcome-text {
                font-size: 14px;
                margin-bottom: 20px;
            }

            .feature-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .page-header {
                padding: 14px 16px;
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .page-header .btn {
                align-self: flex-start;
            }

            .modal {
                padding: 22px 18px;
                margin: 16px;
                max-width: calc(100% - 32px);
            }

            .step-indicator {
                padding: 12px;
            }

            .step-progress {
                flex-wrap: wrap;
                gap: 6px;
            }

            .step-node {
                font-size: 11px;
                padding: 4px 8px;
            }

            .upload-zone {
                padding: 18px 12px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        const API_BASE = 'http://127.0.0.1:8000/api/v1';

        // ---- In-chat application wizard cards (rendered inside chat messages, no page overlay) ----
        function WizardCardShell({ children }) {
            return <div style={{ background: '#1a1a1a', border: '1px solid #2a2a2a', borderRadius: '12px', padding: '16px', marginTop: '8px', maxWidth: '520px' }}>{children}</div>;
        }

        // Step indicator component
        function StepIndicator({ steps, currentStep }) {
            const getLabel = (step, idx) => {
                const num = idx + 1;
                if (step === 'name')             return `${num}.Name`;
                if (step === 'id_upload')        return `${num}.National ID`;
                if (step === 'passport_upload')  return `${num}.Passport`;
                if (step === 'license_upload')   return `${num}.Driving License`;
                if (step === 'review')           return `${num}.Review`;
                if (step === 'submit')           return `${num}.Submit`;
                if (step === 'success')          return '✓Done';
                return `${num}.${step.replace(/_/g, ' ')}`;
            };

            return (
                <div className="step-indicator">
                    <div className="step-progress">
                        {steps.map((step, idx) => {
                            const isActive = step === currentStep;
                            const isCompleted = steps.indexOf(step) < steps.indexOf(currentStep);
                            const statusClass = isActive ? 'active' : isCompleted ? 'completed' : 'pending';
                            return (
                                <React.Fragment key={step}>
                                    <div className={`step-node ${statusClass}`}>
                                        {isCompleted && <span>✓</span>}
                                        {getLabel(step, idx)}
                                    </div>
                                    {idx < steps.length - 1 && <span className="step-arrow">→</span>}
                                </React.Fragment>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // Typing animation component
        function TypingText({ text }) {
            const [displayed, setDisplayed] = useState('');
            const [done, setDone] = useState(false);

            useEffect(() => {
                setDisplayed('');
                setDone(false);
                let i = 0;
                const interval = setInterval(() => {
                    if (i < text.length) {
                        setDisplayed(text.slice(0, i + 1));
                        i++;
                    } else {
                        setDone(true);
                        clearInterval(interval);
                    }
                }, 30);
                return () => clearInterval(interval);
            }, [text]);

            return (
                <div className="step-typing">
                    {displayed}
                    {!done && <span className="step-typing-cursor"></span>}
                </div>
            );
        }

        function WizardOffer({ onYes, onNo }) {
            return (
                <WizardCardShell>
                    <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                        <button className="btn btn-primary" onClick={onYes}>Yes, start my application</button>
                        <button className="btn btn-secondary" onClick={onNo}>Not now</button>
                    </div>
                </WizardCardShell>
            );
        }

        function WizardServices({ services, onPick }) {
            return (
                <WizardCardShell>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                        {services.map(sv => {
                            const ok = !sv.status || sv.status === 'available';
                            return <button key={sv.id} className="btn btn-secondary" disabled={!ok} onClick={() => onPick(sv.id)} style={{ textAlign: 'left' }}><strong>{sv.name}</strong>{!ok && ' (coming soon)'}</button>;
                        })}
                    </div>
                </WizardCardShell>
            );
        }

        function WizardUpload({ docs, uploaded, busy, onFile, isId, pretty, onCancel }) {
            // Map each required doc type to a wizard step key
            const docToStepKey = (d) => {
                if (/driving.?licen/i.test(d)) return 'license_upload';
                if (/passport/i.test(d))       return 'passport_upload';
                return 'id_upload';
            };
            const uploadStepKeys = docs.map(docToStepKey);
            const allSteps = ['name', ...uploadStepKeys, 'review'];

            // Sequential gating: find the FIRST doc not yet uploaded
            const nextPendingDoc = docs.find(d => !uploaded.some(u => u.docType === d));
            const pendingStepKey = nextPendingDoc
                ? docToStepKey(nextPendingDoc)
                : uploadStepKeys[uploadStepKeys.length - 1];

            // Only show completed docs + the current pending one (sequential reveal)
            const visibleDocs = docs.filter(d =>
                uploaded.some(u => u.docType === d) || d === nextPendingDoc
            );

            return (
                <WizardCardShell>
                    <StepIndicator
                        steps={allSteps}
                        currentStep={pendingStepKey}
                    />

                    {/* Progress banner shown when >=1 doc is done and more remain */}
                    {docs.length > 1 && uploaded.length > 0 && nextPendingDoc && (
                        <div style={{
                            marginTop: '14px',
                            padding: '10px 14px',
                            background: 'rgba(132, 189, 0, 0.08)',
                            border: '1px solid rgba(132, 189, 0, 0.3)',
                            borderRadius: '8px',
                            fontSize: '12px',
                            color: '#84BD00',
                            display: 'flex',
                            alignItems: 'center',
                            gap: '8px'
                        }}>
                            <span>✅</span>
                            <span>
                                <strong>{pretty(uploaded[uploaded.length - 1].docType)}</strong> approved and stored.
                                {' '}Step {uploaded.length + 1} of {docs.length}: now please upload your{' '}
                                <strong>{pretty(nextPendingDoc)}</strong>.
                            </span>
                        </div>
                    )}

                    {visibleDocs.map(d => {
                        const done = uploaded.some(u => u.docType === d);
                        const working = busy === d;
                        return (
                            <div key={d} style={{ marginTop: '16px' }}>
                                <div style={{ fontSize: '14px', fontWeight: 500, color: done ? '#22c55e' : working ? '#84BD00' : '#ccc', marginBottom: '8px' }}>
                                    {done ? '✅' : working ? '🔍' : '📄'} {pretty(d)}{' '}
                                    {done ? '— Verified & Approved' : working ? '— Scanning & Verifying...' : ''}
                                </div>

                                {done ? (
                                    <div style={{
                                        padding: '10px 14px',
                                        background: 'rgba(34, 197, 94, 0.06)',
                                        border: '1px solid rgba(34, 197, 94, 0.2)',
                                        borderRadius: '8px',
                                        fontSize: '12px',
                                        color: '#86efac',
                                        display: 'flex',
                                        alignItems: 'center',
                                        gap: '8px'
                                    }}>
                                        <i className="fas fa-check-circle" style={{ color: '#22c55e', fontSize: '14px' }}></i>
                                        <span>Document verified, extracted, and stored securely.</span>
                                    </div>
                                ) : (
                                    <div
                                        className={`upload-zone ${working ? 'working' : ''}`}
                                        onDragOver={(e) => { e.preventDefault(); if (!working) e.currentTarget.classList.add('drag-over'); }}
                                        onDragLeave={(e) => { e.currentTarget.classList.remove('drag-over'); }}
                                        onDrop={(e) => {
                                            e.preventDefault();
                                            e.currentTarget.classList.remove('drag-over');
                                            if (!working) {
                                                const file = e.dataTransfer.files[0];
                                                if (file) onFile(file, d);
                                            }
                                        }}
                                        onClick={() => {
                                            if (!working) {
                                                const input = document.createElement('input');
                                                input.type = 'file';
                                                input.accept = isId(d) ? '.pdf,application/pdf' : '.pdf,.png,.jpg,.jpeg,.tiff,.bmp';
                                                input.onchange = (ev) => {
                                                    const f = ev.target.files[0];
                                                    if (f) onFile(f, d);
                                                };
                                                input.click();
                                            }
                                        }}
                                    >
                                        {working ? (
                                            <div style={{ padding: '16px 8px', textAlign: 'center' }}>
                                                <div style={{ fontSize: '13px', fontWeight: '600', color: '#84BD00', marginBottom: '6px' }}>
                                                    🔍 Scanning &amp; Extracting Document Fields...
                                                </div>
                                                <div style={{ fontSize: '12px', color: '#aaa', lineHeight: '1.5' }}>
                                                    • Checking Malware Scan (ClamAV stream check)<br/>
                                                    • Checking PDF Validity &amp; Image Clarity<br/>
                                                    • Checking Name, Issue Date, Expiry, Authority...<br/>
                                                    • Calculating Confidence Score...
                                                </div>
                                            </div>
                                        ) : (
                                            <React.Fragment>
                                                <div className="upload-zone-icon">📁</div>
                                                <div className="upload-zone-text">
                                                    Drag and drop your {pretty(d)} here, or{' '}
                                                    <span className="upload-zone-browse">browse files</span>
                                                </div>
                                                <div className="upload-zone-hint">
                                                    {isId(d) ? 'PDF or scanned PDF, max 10 MB' : 'PDF or image, max 10 MB'}
                                                </div>
                                            </React.Fragment>
                                        )}
                                    </div>
                                )}
                            </div>
                        );
                    })}
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '12px' }}>
                        <div style={{ fontSize: '12px', color: '#888' }}>
                            You can drag files directly into the upload zone, or click to browse.
                        </div>
                        {onCancel && (
                            <button className="btn btn-ghost" style={{ color: '#ef4444', fontSize: '12px', padding: '4px 8px' }} onClick={onCancel}>
                                Cancel application
                            </button>
                        )}
                    </div>
                </WizardCardShell>
            );
        }

        // Check results component
        function CheckResults({ checks }) {
            if (!checks || checks.length === 0) return null;
            return (
                <div>
                    {checks.map((c, idx) => {
                        const confPct = c.confidencePct !== undefined ? c.confidencePct : (c.confidence !== undefined ? Math.round(c.confidence * 100) : null);
                        const isHumanReview = c.needsHumanReview || (confPct !== null && confPct >= 51 && confPct <= 79);
                        const isAutoApproved = !isHumanReview && (confPct === null || confPct >= 80);

                        return (
                        <div key={idx} style={{ marginTop: '8px' }}>
                            <div className={`check-result ${c.isBlurry ? 'warning' : 'success'}`}>
                                {c.malwareScan !== 'clean' ? (
                                    <div className="check-item">
                                        <span className="check-icon fail">⚠</span>
                                        <span>Malware scan: {c.malwareScan === 'infected' ? 'Failed - file may be harmful' : 'Pending'}</span>
                                    </div>
                                ) : (
                                    <div className="check-item">
                                        <span className="check-icon pass">✓</span>
                                        <span>Malware scan: {c.malwareDetails || 'Passed (ClamAV verified)'}</span>
                                    </div>
                                )}
                                {c.pdfValid !== undefined && (
                                    <div className="check-item">
                                        <span className={c.pdfValid ? 'check-icon pass' : 'check-icon fail'}>{c.pdfValid ? '✓' : '✗'}</span>
                                        <span>PDF validity: {c.pdfValid ? 'Valid PDF' : 'Invalid PDF'}</span>
                                    </div>
                                )}
                                {c.qualityScore !== undefined && (
                                    <div className="check-item">
                                        <span className={c.qualityScore >= 0.6 ? 'check-icon pass' : 'check-icon warn'}>{c.qualityScore >= 0.6 ? '✓' : '⚠'}</span>
                                        <span>Quality score: {(c.qualityScore * 100).toFixed(0)}%</span>
                                    </div>
                                )}
                                {confPct !== null && (
                                    <div className="check-item">
                                        <span className={confPct >= 80 ? 'check-icon pass' : confPct >= 51 ? 'check-icon warn' : 'check-icon fail'}>
                                            {confPct >= 80 ? '✓' : confPct >= 51 ? '📋' : '⚠'}
                                        </span>
                                        <span>Extraction confidence: <strong>{confPct}%</strong></span>
                                    </div>
                                )}
                                {c.isBlurry && c.blurryFields && c.blurryFields.length > 0 && (
                                    <div className="check-item">
                                        <span className="check-icon warn">⚠</span>
                                        <span>Blurry fields: {c.blurryFields.join(', ')}</span>
                                    </div>
                                )}
                            </div>

                            {/* Human Review vs Auto-Approved Status Callout */}
                            {isHumanReview ? (
                                <div style={{ marginTop: '6px', padding: '6px 12px', background: 'rgba(234, 179, 8, 0.15)', border: '1px solid rgba(234, 179, 8, 0.3)', borderRadius: '6px', fontSize: '12px', color: '#eab308', display: 'flex', alignItems: 'center', gap: '6px' }}>
                                    <span>⚠️</span>
                                    <span><strong>Human Review:</strong> Confidence score is {confPct}% (between 51% and 79%). Document routed for human review.</span>
                                </div>
                            ) : isAutoApproved && confPct !== null ? (
                                <div style={{ marginTop: '6px', padding: '6px 12px', background: 'rgba(34, 197, 94, 0.15)', border: '1px solid rgba(34, 197, 94, 0.3)', borderRadius: '6px', fontSize: '12px', color: '#22c55e', display: 'flex', alignItems: 'center', gap: '6px' }}>
                                    <span>✓</span>
                                    <span><strong>Auto-Approved:</strong> Confidence score is {confPct}% (80%+). All required information verified!</span>
                                </div>
                            ) : null}

                            {c.isBlurry && c.blurryFields && (
                                <div className="blurry-notice">
                                    <strong>⚠ Document appears blurry</strong>
                                    The following fields couldn't be extracted clearly: <strong>{c.blurryFields.join(', ')}</strong>.
                                    <br/>Please upload a clearer version for better accuracy.
                                </div>
                            )}
                        </div>
                        );
                    })}
                </div>
            );
        }

        function SuccessResult({ name, service, refId, status, processingTime }) {
            return (
                <div className="submission-result">
                    <div className="submission-icon">✅</div>
                    <div style={{ fontSize: '18px', fontWeight: 700, color: '#ccc', marginBottom: '8px' }}>Application Submitted</div>
                    <div className="submission-ref">{refId || 'Generating...'}</div>
                    <div className="submission-detail"><strong>Name:</strong> {name}</div>
                    <div className="submission-detail"><strong>Service:</strong> {service}</div>
                    <div className="submission-detail"><strong>Status:</strong> {String(status || '').replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</div>
                    <div className="submission-detail"><strong>Estimated processing time:</strong> {processingTime}</div>
                    <div style={{ fontSize: '12px', color: '#888', marginTop: '12px' }}>
                        We will notify you here as soon as there is an update.
                    </div>
                </div>
            );
        }

        function WizardReview({ name, docs, mask, pretty, disabled, onConfirm, onReplace, onRestart, onEdit, onCancel }) {
            const [shown, setShown] = useState({});
            const [editingField, setEditingField] = useState(null);
            const [editingRawKey, setEditingRawKey] = useState(null);
            const [editValue, setEditValue] = useState('');
            const [editSaving, setEditSaving] = useState(false);
            const toggle = k => setShown(p => ({ ...p, [k]: !p[k] }));

            const startEdit = (fieldKey, rawKey, currentValue) => {
                setEditingField(fieldKey);
                setEditingRawKey(rawKey);
                setEditValue(currentValue);
            };

            const saveEdit = async () => {
                setEditSaving(true);
                try {
                    const result = await onEdit(editingRawKey, editValue);
                    if (result) {
                        setEditingField(null);
                        setEditingRawKey(null);
                    }
                } catch (e) {
                    console.error('Edit failed:', e);
                } finally {
                    setEditSaving(false);
                }
            };

            // Derive step keys from the uploaded docs' types
            const docToStepKey = (dt) => {
                if (/driving.?licen/i.test(dt)) return 'license_upload';
                if (/passport/i.test(dt))       return 'passport_upload';
                return 'id_upload';
            };
            const uploadStepKeys = docs.map(d => docToStepKey(d.docType));
            const reviewSteps = ['name', ...uploadStepKeys, 'review', 'submit'];

            return (
                <WizardCardShell>
                    <StepIndicator
                        steps={reviewSteps}
                        currentStep="review"
                    />

                    <div style={{ fontSize: '13px', marginTop: '12px' }}>
                        <span style={{ color: '#888' }}>Applicant: </span><strong>{name}</strong>
                    </div>

                    {docs.map(d => (
                        <div key={d.docType} style={{ marginTop: '16px' }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                                <strong style={{ fontSize: '14px' }}>{pretty(d.docType)}</strong>
                                <button className="btn btn-ghost" disabled={disabled} onClick={() => onReplace(d.docType)} style={{ padding: '2px 8px', fontSize: '12px' }}>Replace</button>
                            </div>

                            {/* Show check results */}
                            <CheckResults checks={[{
                                malwareScan: d.malwareScan,
                                malwareDetails: d.malwareDetails,
                                pdfValid: d.pdfValid,
                                qualityScore: d.qualityScore,
                                confidence: d.confidence,
                                confidencePct: d.confidencePct,
                                needsHumanReview: d.needsHumanReview,
                                isBlurry: d.isBlurry,
                                blurryFields: d.blurryFields
                            }]} />

                            {/* Show extracted fields with inline edit */}
                            {Object.entries(d.extractedFields || {}).filter(([k]) => !k.startsWith('_')).map(([k, v]) => {
                                const key = d.docType + k;
                                const m = mask(k, v);
                                const sensitive = m !== String(v);
                                const isEditing = editingField === key;
                                const fieldLabel = (() => {
                                    const fn = k.toLowerCase();
                                    if (fn === 'license_no' || fn === 'license_number') return 'License No (Primary Key)';
                                    if (fn === 'gear_type' || fn === 'transmission') return 'Transmission (Automatic/Manual)';
                                    if (fn === 'glasses_requirement' || fn === 'glasses') return 'Vision (Glasses/No Glasses)';
                                    if (fn === 'traffic_code_no' || fn === 'traffic_code') return 'Traffic Code No';
                                    if (fn === 'place_of_issue') return 'Place of Issue';
                                    if (fn === 'licensing_authority') return 'Licensing Authority';
                                    if (fn === 'date_of_birth' || fn === 'dob') return 'Date of Birth';
                                    if (fn === 'issue_date') return 'Issue Date';
                                    if (fn === 'expiry_date') return 'Date of Expiry';
                                    if (fn === 'nationality') return 'Nationality';
                                    if (fn === 'name' || fn === 'full_name') return 'Name';
                                    return k.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                                })();

                                return (
                                    <div key={k} style={{ display: 'flex', gap: '8px', fontSize: '12px', padding: '6px 0', alignItems: 'center' }}>
                                        <span style={{ color: '#888', minWidth: '150px' }}>{fieldLabel}</span>
                                        {isEditing ? (
                                            <React.Fragment>
                                                <input
                                                    className="field-edit-value"
                                                    value={editValue}
                                                    onChange={e => setEditValue(e.target.value)}
                                                    autoFocus
                                                    style={{ flex: 1 }}
                                                />
                                                <button className="field-edit-save" onClick={saveEdit} disabled={editSaving || !editValue.trim()}>
                                                    {editSaving ? '...' : 'Save'}
                                                </button>
                                                <button className="btn btn-ghost" onClick={() => { setEditingField(null); setEditingRawKey(null); }} style={{ padding: '0 6px', fontSize: '11px' }}>Cancel</button>
                                            </React.Fragment>
                                        ) : (
                                            <React.Fragment>
                                                <span style={{ wordBreak: 'break-word', flex: 1, cursor: 'pointer' }} onClick={() => startEdit(key, k, v)}>
                                                    {shown[key] ? String(v) : m}
                                                </span>
                                                <button className="btn btn-ghost" onClick={() => toggle(key)} style={{ padding: '0 6px', fontSize: '11px' }}>
                                                    {shown[key] ? 'Hide' : 'Show'}
                                                </button>
                                                <button className="btn btn-ghost" onClick={() => startEdit(key, k, v)} style={{ padding: '0 6px', fontSize: '11px' }} title="Edit this field">✏️</button>
                                            </React.Fragment>
                                        )}
                                    </div>
                                );
                            })}

                            {/* Fallback if no extracted fields */}
                            {!d.extractedFields || Object.keys(d.extractedFields).length === 0 ? (
                                <div style={{ fontSize: '12px', color: '#666', fontStyle: 'italic', padding: '8px 0' }}>
                                    No data extracted from this document yet.
                                </div>
                            ) : null}
                        </div>
                    ))}

                    {/* Edit instructions */}
                    <div style={{ fontSize: '11px', color: '#666', marginTop: '12px', fontStyle: 'italic' }}>
                        💡 Tip: Click ✏️ next to any field to edit it, or type "My DOB is wrong, it is actually DD/MM/YYYY" in the chat.
                    </div>

                    <div style={{ display: 'flex', gap: '8px', marginTop: '16px', flexWrap: 'wrap' }}>
                        <button className="btn btn-primary" disabled={disabled} onClick={onConfirm}>Confirm and submit</button>
                        <button className="btn btn-secondary" disabled={disabled} onClick={onRestart}>Start over</button>
                        {onCancel && (
                            <button className="btn btn-ghost" style={{ color: '#ef4444' }} disabled={disabled} onClick={onCancel}>
                                Cancel application
                            </button>
                        )}
                    </div>
                </WizardCardShell>
            );
        }

        function App() {
            const [sidebarOpen, setSidebarOpen] = useState(true);
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [file, setFile] = useState(null);
            const [loading, setLoading] = useState(false);
            const [showAuth, setShowAuth] = useState(false);
            const [user, setUser] = useState(null);
            const [authMode, setAuthMode] = useState('login');
            const [authData, setAuthData] = useState({ username: '', password: '', name: '', email: '' });
            const [authError, setAuthError] = useState('');
            const [services, setServices] = useState([]);
            const [documents, setDocuments] = useState([]);
            const [applications, setApplications] = useState([]);
            const [showDocumentsPage, setShowDocumentsPage] = useState(false);
            const [showApplicationsPage, setShowApplicationsPage] = useState(false);
            const [showServicesPage, setShowServicesPage] = useState(false);
            const [showApplicationFlow, setShowApplicationFlow] = useState(false);
            // In-chat application wizard state
            const [wizardStep, setWizardStep] = useState(null); // null | name | upload | review | submitting | success
            const [wizardService, setWizardService] = useState(null);
            const [wizardName, setWizardName] = useState('');
            const [wizardAppId, setWizardAppId] = useState(null);
            const [wizardDocs, setWizardDocs] = useState([]);
            const [wizardBusy, setWizardBusy] = useState(null);
            const pendingApplyRef = useRef(null); // service to resume after login
            const [systemHealthy, setSystemHealthy] = useState(false);
            const [ollamaHealthy, setOllamaHealthy] = useState(false);
            const [currentTime, setCurrentTime] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const chatEndRef = useRef(null);
            const fileInputRef = useRef(null);

            // Refs to avoid stale closures
            const messagesRef = useRef([]);
            const loadingRef = useRef(false);

            useEffect(() => {
                // Initial check for mobile screen size
                if (window.innerWidth <= 768) {
                    setSidebarOpen(false);
                }
                const handleResize = () => {
                    if (window.innerWidth <= 768) {
                        setSidebarOpen(false);
                    } else {
                        setSidebarOpen(true);
                    }
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            useEffect(() => {
                // Clock every second
                const updateTime = () => {
                    const now = new Date();
                    const options = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
                    setCurrentTime(now.toLocaleDateString('en-US', options));
                };
                updateTime();
                const interval = setInterval(updateTime, 1000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                messagesRef.current = messages;
            }, [messages]);

            useEffect(() => {
                loadingRef.current = loading;
            }, [loading]);

            useEffect(() => {
                checkAuth();
                loadServices();
                loadDocuments();
                loadApplications();
                checkHealth();
                // Poll health every 30s
                const interval = setInterval(checkHealth, 30000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            const checkAuth = async () => {
                const token = localStorage.getItem('token');
                const username = localStorage.getItem('username');
                if (token && username) {
                    // Verify the token is still valid on the server
                    try {
                        const res = await fetch(`${API_BASE}/auth/me?token=${encodeURIComponent(token)}`);
                        if (res.ok) {
                            const data = await res.json();
                            const verifiedUsername = data.user?.username || username;
                            setUser({ token, username: verifiedUsername });
                            loadDocuments();
                            loadApplications();
                        } else {
                            // Token invalid on server — clear it
                            localStorage.removeItem('token');
                            localStorage.removeItem('username');
                        }
                    } catch (e) {
                        // Network error — assume token still valid to avoid logging out on startup
                        setUser({ token, username });
                        loadDocuments();
                        loadApplications();
                    }
                }
            };

            const checkHealth = async () => {
                try {
                    const res = await fetch(`${API_BASE}/health`);
                    const data = await res.json();
                    setSystemHealthy(data.status === 'healthy');
                    setOllamaHealthy(data.services?.generation === 'healthy' || data.services?.generation === 'model_not_found');
                } catch (e) {
                    setSystemHealthy(false);
                    setOllamaHealthy(false);
                }
            };

            const loadServices = async () => {
                try {
                    const token = getToken();
                    const res = await fetch(`${API_BASE}/services?token=${encodeURIComponent(token)}`);
                    const data = await res.json();
                    setServices(data.data?.services || []);
                } catch (e) {
                    console.error('Failed to load services:', e);
                }
            };

            const loadDocuments = async () => {
                try {
                    const token = getToken();
                    if (!token) return;
                    const res = await fetch(`${API_BASE}/documents?token=${encodeURIComponent(token)}`);
                    const data = await res.json();
                    setDocuments(data.data?.documents || []);
                } catch (e) {
                    console.error('Failed to load documents:', e);
                }
            };

            const loadApplications = async () => {
                try {
                    const token = getToken();
                    if (!token) return;
                    const res = await fetch(`${API_BASE}/applications?token=${encodeURIComponent(token)}`);
                    const data = await res.json();
                    setApplications(data.data?.applications || []);
                } catch (e) {
                    console.error('Failed to load applications:', e);
                }
            };

            const handleCancelApplication = async (appId) => {
                if (!window.confirm('Are you sure you want to cancel this application? The uploaded document(s) along with it will be permanently removed.')) {
                    return;
                }
                try {
                    setLoading(true);
                    const token = getToken();
                    const url = `${API_BASE}/applications/${encodeURIComponent(appId)}/cancel${token ? `?token=${encodeURIComponent(token)}` : ''}`;
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    const data = await res.json().catch(() => ({}));
                    if (res.ok && (data.success || data.deleted)) {
                        alert('Application has been cancelled and the uploaded documents have been removed.');
                        loadApplications();
                        loadDocuments();
                    } else {
                        const errMsg = data.detail || data.message || 'Could not cancel application';
                        alert(`Error: ${errMsg}`);
                    }
                } catch (e) {
                    console.error('Failed to cancel application:', e);
                    alert(`Failed to cancel application: ${e.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const handleAuth = async () => {
                setAuthError('');
                try {
                    const endpoint = authMode === 'login' ? '/auth/login' : '/auth/register';
                    const emailVal = (authData.email || '').trim() || (authData.username.includes('@') ? authData.username.trim() : `${authData.username.trim()}@example.com`);
                    const body = authMode === 'login'
                        ? { username: authData.username.trim(), password: authData.password }
                        : { username: authData.username.trim(), password: authData.password, email: emailVal, name: authData.name || authData.username.trim() };

                    const res = await fetch(`${API_BASE}${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });

                    const data = await res.json().catch(() => ({}));

                    if (data.success && (authMode === 'login' || authMode === 'register')) {
                        const token = data.data?.token;
                        const username = data.data?.email || data.data?.username || authData.username;
                        if (token) {
                            localStorage.setItem('token', token);
                            localStorage.setItem('username', username);
                            setUser({ token, username });
                        }
                        setShowAuth(false);
                        setAuthMode('login');
                        // Always redirect back to main page
                        setShowDocumentsPage(false);
                        setShowApplicationsPage(false);
                        setShowServicesPage(false);

                        const pending = pendingApplyRef.current;
                        if (pending) {
                            pendingApplyRef.current = null;
                            addMessage('assistant', `Welcome ${username}! Let us pick up your application.`);
                            setTimeout(() => resumePendingApply(pending), 0);
                        } else {
                            addMessage('assistant', authMode === 'register' 
                                ? `Welcome ${username}! Your account has been created successfully and you are now signed in.` 
                                : `Welcome back, ${username}!`);
                        }
                        loadDocuments();
                        loadApplications();
                    } else {
                        let errText = 'Authentication failed';
                        if (typeof data.detail === 'string') {
                            errText = data.detail;
                        } else if (Array.isArray(data.detail)) {
                            errText = data.detail.map(d => (d.loc ? d.loc.slice(-1) + ': ' : '') + d.msg).join('; ');
                        } else if (data.message) {
                            errText = data.message;
                        } else if (data.error) {
                            errText = data.error;
                        }
                        setAuthError(errText);
                    }
                } catch (e) {
                    setAuthError(e.message || 'Connection error');
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('token');
                localStorage.removeItem('username');
                setUser(null);
                setDocuments([]);
                setApplications([]);
            };
            const handleChatScroll = (e) => {
                const { scrollTop, scrollHeight, clientHeight } = e.target;
                setShowScrollTop(scrollHeight - scrollTop - clientHeight > 100);
            };

            const scrollToTop = () => {
                if (chatMessagesRef.current) {
                    chatMessagesRef.current.scrollTop = 0;
                }
            };
            

            const handleFileUpload = async () => {
                if (!file) return;

                // During the wizard, the paperclip sends the file to the next missing required document
                if (wizardStep === 'upload') {
                    const next = wizardRequiredDocs().find(d => !wizardDocs.some(u => u.docType === d));
                    if (next) {
                        const f = file;
                        setFile(null);
                        if (fileInputRef.current) fileInputRef.current.value = '';
                        wizardUploadDocument(f, next);
                        return;
                    }
                }

                const formData = new FormData();
                formData.append('file', file);

                try {
                    const token = getToken();
                    // Use /upload (not /extract) so the document is persisted to the DB under this user
                    const res = await fetch(`${API_BASE}/documents/upload?token=${encodeURIComponent(token)}`, {
                        method: 'POST',
                        body: formData
                    });

                    const data = await res.json();

                    if (data.success) {
                        const extractedFields = data.data?.extracted_fields || {};
                        const fieldCount = Object.keys(extractedFields).filter(k => !k.startsWith('_')).length;

                        addMessage('system', `✅ Document uploaded: ${file.name}`);

                        if (fieldCount > 0) {
                            let fieldDetails = `\n📋 **Extracted Fields** (${fieldCount} fields):\n`;
                            for (const [key, value] of Object.entries(extractedFields)) {
                                if (!key.startsWith('_') && value) {
                                    fieldDetails += `• **${key}**: ${value}\n`;
                                }
                            }
                            addMessage('system', fieldDetails.trim());
                        }

                        setFile(null);
                        if (fileInputRef.current) fileInputRef.current.value = '';
                        loadDocuments();
                    } else {
                        addMessage('system', `❌ Upload failed: ${data.error || data.detail || 'Unknown error'}`);
                    }
                } catch (e) {
                    addMessage('system', `❌ Upload error: ${e.message}`);
                }
            };

            const isGreeting = (text) => {
                const greetings = ['hi', 'hello', 'hey', 'good morning', 'good afternoon', 'good evening', 'good night', 'greetings'];
                return greetings.some(g => text.toLowerCase().includes(g));
            };

            const getTimeGreeting = () => {
                const hour = new Date().getHours();
                if (hour < 12) return 'Good morning';
                if (hour < 17) return 'Good afternoon';
                if (hour < 21) return 'Good evening';
                return 'Good night';
            };

            const getLynxGreeting = () => {
                return `${getTimeGreeting()}! I'm Lynx, your DocIntake assistant. I'm ready to help you with document onboarding, service inquiries, and applications. How can I assist you?`;
            };

            const sendMessage = async (messageText) => {
                const query = messageText || input.trim();
                if (!query && !file) return;
                if (loadingRef.current) return;

                const userMessage = query;
                addMessage('user', userMessage);

                // While the wizard waits for the applicant's name, the chat input is the answer
                if (wizardStep === 'name' && wizardService) {
                    setInput('');
                    wizardProceedToUpload(userMessage);
                    return;
                }

                setLoading(true);
                setInput('');
                setFile(null);
                if (fileInputRef.current) fileInputRef.current.value = '';

                // Handle greetings locally with Lynx personality
                if (isGreeting(query)) {
                    setTimeout(() => {
                        addMessage('assistant', getLynxGreeting());
                        setLoading(false);
                    }, 500);
                    return;
                }

                try {
                    const token = getToken();
                    const res = await fetch(`${API_BASE}/chat/message?token=${encodeURIComponent(token)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query: userMessage })
                    });

                    const data = await res.json();

                    let responseText = data.response || 'No response';
                    let matchedService = data.matched_service;

                    if (data.sources && data.sources.length > 0) {
                        const sourceNames = data.sources.map(s => s.filename).join(', ');
                        responseText += `\n\n📚 Sources: ${sourceNames}`;
                    }

                    if (data.confidence !== undefined) {
                        responseText += `\n\n🎯 Confidence: ${(data.confidence * 100).toFixed(0)}%`;
                    }

                    addMessage('assistant', responseText, matchedService);

                    // Offer to start an application when the user wants to apply or is asking about services,
                    // provided the matched service is not 'coming soon'
                    const matchedSvcObj = matchedService ? services.find(s => s.id === matchedService) : null;
                    const isComingSoon = matchedSvcObj && matchedSvcObj.status && matchedSvcObj.status !== 'available';

                    const wantsApply = !isComingSoon && (data.intent === 'apply' || /\b(apply|application|register|registration|sign ?up|enrol+)\b/i.test(userMessage));
                    const asksServices = !isComingSoon && (!!matchedService || /\b(services?|offer(ed)?|available|requirements?|eligib\w+)\b/i.test(userMessage));
                    if ((wantsApply || asksServices) && !(wizardStep && wizardStep !== 'success')) {
                        offerApplication(matchedService, wantsApply);
                    }
                } catch (e) {
                    addMessage('assistant', `Error: ${e.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const addMessage = (role, content, service = null, extra = null) => {
                setMessages(prev => [...prev, { role, content, service, timestamp: new Date(), ...(extra || {}) }]);
            };

            const formatFileSize = (bytes) => {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            };

            const getServiceIcon = (serviceId) => {
                const icons = {
                    basic_registration: '🆔',
                    premium_crossborder: '🌍',
                    mobility_rental: '🚗'
                };
                return icons[serviceId] || '📋';
            };

            const requireAuth = (callback) => {
                if (!user) {
                    setShowAuth(true);
                    return false;
                }
                callback();
                return true;
            };

            const handleFeatureClick = (messageText) => {
                if (messageText === 'Upload a document') {
                    if (!requireAuth(() => fileInputRef.current?.click())) return;
                } else if (/apply|register/i.test(messageText)) {
                    const svcId = /basic|registration/i.test(messageText) ? 'basic_registration'
                        : /premium|cross/i.test(messageText) ? 'premium_crossborder'
                        : /mobility|rental/i.test(messageText) ? 'mobility_rental' : null;
                    startApplication(svcId);
                } else {
                    if (!requireAuth(() => sendMessage(messageText))) return;
                }
            };

            const handleServiceClick = (serviceId, serviceName) => {
                if (!requireAuth(() => sendMessage(`Tell me about ${serviceName}`))) return;
            };

            const handleResetChat = () => {
                setMessages([]);
                resetWizard();
            };

            const handleStartApplication = () => startApplication(null);

            // ================= In-chat application wizard =================
            // Every step (service, name, documents, review, submit) happens inside the chat. Nothing covers the page.
            const getToken = () => user?.token || localStorage.getItem('token') || '';
            const wizardRequiredDocs = () => wizardService?.documents_required || [];
            const isIdDocument = (d) => /national.?id|passport|driving.?licen|(^|[\s_])id([\s_]|$)/i.test(d);
            const prettyDoc = (d) => d.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

            // PII masking for anything shown in chat; the raw value appears only when the user taps "Show"
            const SENSITIVE_KEY = /(^|_)(id|eid|passport|dob|birth|phone|mobile|email|address|iban|account|licen[sc]e)(_|$)|number/i;
            const maskWizardValue = (key, value) => {
                const v = String(value);
                if (!SENSITIVE_KEY.test(key)) return v;
                if (/birth|dob/i.test(key)) return '••/••/••••';
                return v.length <= 4 ? '••••' : '•'.repeat(v.length - 3) + v.slice(-3);
            };

            const clearWizardState = () => {
                setWizardDocs([]);
                setWizardAppId(null);
                setWizardBusy(null);
            };

            const resetWizard = () => {
                clearWizardState();
                setWizardService(null);
                setWizardName('');
                setWizardStep(null);
            };

            const dismissOffers = () => setMessages(prev => prev.map(m => m.type === 'wizard_offer' ? { ...m, dismissed: true } : m));

            // Bot offers to start an application; needs a login first
            const offerApplication = (serviceId, explicit) => {
                const svc = services.find(s => s.id === serviceId);
                if (!getToken()) {
                    if (explicit) {
                        pendingApplyRef.current = serviceId || 'any';
                        addMessage('assistant', 'To start an application you need to be signed in. Please sign in and I will continue right here.');
                        setShowAuth(true);
                    } else {
                        addMessage('assistant', 'If you would like to apply, please sign in first and I can start the application for you here in chat.');
                    }
                    return;
                }
                addMessage('assistant', svc ? `Would you like me to start a new ${svc.name} application for you?` : 'Would you like me to start a new application for you?', null, { type: 'wizard_offer', serviceId: serviceId || null });
            };

            const startApplication = (serviceId) => {
                setShowServicesPage(false);
                setShowDocumentsPage(false);
                if (!getToken()) {
                    pendingApplyRef.current = serviceId || 'any';
