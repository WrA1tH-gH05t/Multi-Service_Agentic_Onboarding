                                                        <div style={{ display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' }}>
                                                            {doc.extraction_confidence !== undefined && (
                                                                <span style={{ fontSize: '12px', fontFamily: 'var(--font-mono)', fontWeight: '600', color: doc.extraction_confidence > 0.7 ? 'var(--accent)' : doc.extraction_confidence > 0.4 ? 'var(--warning)' : 'var(--danger)' }}>
                                                                    {(doc.extraction_confidence * 100).toFixed(0)}% confidence
                                                                </span>
                                                            )}
                                                            <span style={{ fontSize: '12px', color: 'var(--accent)', marginRight: '4px', fontWeight: '600' }}>
                                                                ✓ Processed
                                                            </span>

                                                            {/* View & Download buttons */}
                                                            {docId && (
                                                                <button
                                                                    onClick={() => {
                                                                        const urlToUse = doc.minio_url || viewUrl;
                                                                        setViewingDoc({
                                                                            url: urlToUse,
                                                                            filename: doc.filename || doc.name || 'Document',
                                                                            docId: docId
                                                                        });
                                                                    }}
                                                                    className="btn btn-secondary"
                                                                    style={{ fontSize: '12px', padding: '6px 10px', display: 'inline-flex', alignItems: 'center', gap: '5px', cursor: 'pointer' }}
                                                                    title="View original document in site"
                                                                >
                                                                    <i className="fas fa-eye"></i> View
                                                                </button>
                                                            )}
                                                            {docId && (
                                                                <a
                                                                    href={downloadUrl}
                                                                    download
                                                                    className="btn btn-primary"
                                                                    style={{ fontSize: '12px', padding: '6px 10px', textDecoration: 'none', display: 'inline-flex', alignItems: 'center', gap: '5px' }}
                                                                    title="Download original document"
                                                                >
                                                                    <i className="fas fa-download"></i> Download
                                                                </a>
                                                            )}
                                                        </div>
                                                    </div>
                                                    
                                                    {/* Extracted Fields Table */}
                                                    {fields.length > 0 ? (
                                                        <div>
                                                            <div style={{ fontSize: '11px', color: 'var(--text-dim)', marginBottom: '8px', fontWeight: '700', fontFamily: 'var(--font-mono)', letterSpacing: '1px', textTransform: 'uppercase' }}>
                                                                EXTRACTED DATA ({fields.length} fields)
                                                            </div>
                                                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: '8px' }}>
                                                                {fields.map(([key, value]) => (
                                                                    <div key={key} style={{
                                                                        padding: '8px 12px',
                                                                        background: 'rgba(15, 19, 17, 0.75)',
                                                                        border: '1px solid var(--border-hairline)',
                                                                        borderRadius: '8px',
                                                                        fontSize: '12px',
                                                                    }}>
                                                                        <div style={{ color: 'var(--text-dim)', marginBottom: '3px', fontSize: '10.5px', fontFamily: 'var(--font-mono)' }}>
                                                                            {labels[key] || key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}
                                                                        </div>
                                                                        <div style={{ color: 'var(--text-pure)', wordBreak: 'break-word', fontWeight: '600' }}>
                                                                            {formatFieldValue(key, value, doc.service_id)}
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div style={{ fontSize: '12px', color: 'var(--text-dim)', fontStyle: 'italic', padding: '8px 0' }}>
                                                            No data extracted yet.
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {accountTab === 'applications' && (
                            <div>
                                <div style={{ marginBottom: '16px', color: '#888', fontSize: '13px' }}>
                                    Your previous service onboarding applications:
                                </div>
                                {applications.length === 0 ? (
                                    <div style={{ textAlign: 'center', padding: '60px 20px', color: '#666' }}>
                                        <div style={{ fontSize: '48px', marginBottom: '16px' }}>📝</div>
                                        <div style={{ fontSize: '18px', marginBottom: '8px' }}>No applications submitted yet</div>
                                        <div style={{ fontSize: '14px', color: '#888', marginBottom: '16px' }}>
                                            Your completed service onboarding applications will be securely stored and listed here.
                                        </div>
                                        <button className="btn btn-primary" onClick={() => {
                                            setShowAccountPage(false);
                                            handleStartApplication();
                                        }}>
                                            Start an Application
                                        </button>
                                    </div>
                                ) : (
                                    <div style={{ display: 'grid', gap: '16px' }}>
                                        {applications.map((app, idx) => {
                                            const serviceLabel = app.service_name || (app.service_type || app.service_id || 'Application').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                                            const appStatus = (app.status || 'PENDING').toUpperCase();
                                            const isComplete = appStatus === 'COMPLETE' || appStatus === 'COMPLETED' || appStatus === 'SUBMITTED' || appStatus === 'PASS';
                                            const isReview = appStatus.includes('REVIEW');
                                            const badgeBg = isComplete ? 'rgba(34, 197, 94, 0.15)' : isReview ? 'rgba(196, 154, 74, 0.15)' : 'rgba(239, 68, 68, 0.15)';
                                            const badgeColor = isComplete ? '#22c55e' : isReview ? '#c49a4a' : '#ef4444';
                                            const badgeBorder = isComplete ? 'rgba(34, 197, 94, 0.35)' : isReview ? 'rgba(196, 154, 74, 0.35)' : 'rgba(239, 68, 68, 0.35)';

                                            return (
                                                <div key={app.id || app.application_id || idx} style={{
                                                    padding: '24px',
                                                    background: 'var(--bg-card)',
                                                    border: '1px solid var(--border-hairline)',
                                                    borderRadius: '16px',
                                                    display: 'flex',
                                                    flexDirection: 'column',
                                                    gap: '14px',
                                                    boxShadow: '0 8px 32px rgba(0,0,0,0.4)',
                                                    backdropFilter: 'blur(12px)',
                                                    transition: 'all 0.25s ease'
                                                }}>
                                                    <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: '16px' }}>
                                                        <div>
                                                            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                                                                <span style={{ fontSize: '22px' }}>{getServiceIcon(app.service_id || app.service_type)}</span>
                                                                <div style={{ fontSize: '18px', fontFamily: 'var(--font-editorial)', fontWeight: '800', color: 'var(--text-pure)', letterSpacing: '0.02em' }}>
                                                                    {serviceLabel}
                                                                </div>
                                                            </div>
                                                            {app.applicant_name && (
                                                                <div style={{ fontSize: '13px', color: 'var(--accent)', marginTop: '6px', fontWeight: '600' }}>
                                                                    <i className="fas fa-user" style={{ marginRight: '6px', opacity: 0.8 }}></i>
                                                                    Applicant: {app.applicant_name}
                                                                </div>
                                                            )}
                                                            <div style={{ fontSize: '12px', color: 'var(--text-dim)', marginTop: '6px', fontFamily: 'var(--font-mono)' }}>
                                                                Ref: <span style={{ color: 'var(--accent)', background: 'rgba(120,221,178,0.08)', padding: '2px 8px', borderRadius: '4px', border: '1px solid var(--border-hairline)' }}>{app.id || app.application_id}</span> • Submitted: {app.created_at || app.submitted_at ? new Date(app.created_at || app.submitted_at).toLocaleString() : 'Recent'}
                                                            </div>
                                                        </div>
                                                        <span style={{
                                                            padding: '6px 14px',
                                                            borderRadius: '20px',
                                                            fontSize: '11px',
                                                            fontFamily: 'var(--font-mono)',
                                                            fontWeight: '700',
                                                            letterSpacing: '0.05em',
                                                            background: badgeBg,
                                                            color: badgeColor,
                                                            border: `1px solid ${badgeBorder}`,
                                                            boxShadow: `0 0 14px ${badgeBg}`
                                                        }}>
                                                            {appStatus.replace(/_/g, ' ')}
                                                        </span>
                                                    </div>

                                                    {app.metadata && Object.keys(app.metadata).length > 0 && (
                                                        <div style={{ background: 'rgba(15, 19, 17, 0.75)', padding: '14px', borderRadius: '10px', border: '1px solid var(--border-hairline)' }}>
                                                            <div style={{ fontSize: '10.5px', color: 'var(--text-dim)', fontWeight: '700', fontFamily: 'var(--font-mono)', marginBottom: '8px', letterSpacing: '1px', textTransform: 'uppercase' }}>DETAILS</div>
                                                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '8px', fontSize: '12px' }}>
                                                                {Object.entries(app.metadata).map(([k, v]) => (
                                                                    <div key={k}>
                                                                        <span style={{ color: 'var(--text-dim)' }}>{k.replace(/_/g, ' ')}: </span>
                                                                        <span style={{ color: 'var(--text-pure)', fontWeight: '600' }}>{typeof v === 'object' ? JSON.stringify(v) : String(v)}</span>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}

                                                    <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: '6px', paddingTop: '12px', borderTop: '1px solid var(--border-hairline)' }}>
                                                        <button
                                                            className="btn btn-ghost"
                                                            style={{
                                                                color: 'var(--danger)',
                                                                borderColor: 'rgba(201, 112, 110, 0.3)',
                                                                background: 'rgba(201, 112, 110, 0.08)',
                                                                fontSize: '12px',
                                                                padding: '6px 14px',
                                                                borderRadius: '8px',
                                                                cursor: 'pointer',
                                                                display: 'inline-flex',
                                                                alignItems: 'center',
                                                                gap: '6px',
                                                            }}
                                                            onClick={() => handleCancelApplication(app.id || app.application_id)}
                                                        >
                                                            <i className="fas fa-times-circle"></i> Cancel Application
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );

            const renderServicesPage = () => {
                const availableServices = services.filter(s => s.status === 'available');
                const comingSoonServices = services.filter(s => s.status !== 'available');

                const renderServiceCard = (svc, isAvailable) => (
                    <div key={svc.id} style={{
                        padding: '24px',
                        background: 'var(--bg-card)',
                        border: isAvailable ? '1px solid var(--border-medium)' : '1px dashed rgba(255, 255, 255, 0.12)',
                        borderRadius: '16px',
                        backdropFilter: 'blur(14px)',
                        display: 'flex',
                        flexDirection: 'column',
                        gap: '14px',
                        transition: 'all 0.25s ease',
                        boxShadow: isAvailable ? '0 8px 30px rgba(0,0,0,0.4)' : 'none',
                        opacity: isAvailable ? 1 : 0.85
                    }}>
                        <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: '12px' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '14px' }}>
                                <div style={{ fontSize: '32px', filter: isAvailable ? 'drop-shadow(0 0 10px var(--accent-glow))' : 'grayscale(60%)' }}>
                                    {getServiceIcon(svc.id)}
                                </div>
                                <div>
                                    <div style={{ fontSize: '17px', fontFamily: 'var(--font-editorial)', fontWeight: '800', color: 'var(--text-pure)', letterSpacing: '0.02em' }}>
                                        {svc.name}
                                    </div>
                                    <div style={{ fontSize: '10.5px', fontFamily: 'var(--font-mono)', fontWeight: '700', textTransform: 'uppercase', letterSpacing: '1px', color: isAvailable ? 'var(--accent)' : 'var(--text-dim)', marginTop: '4px' }}>
                                        {isAvailable ? '● Available Now' : '⏳ Coming Soon'}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div style={{ fontSize: '13px', color: 'var(--text-muted)', lineHeight: '1.6' }}>
                            {svc.description || 'Comprehensive document onboarding and verification service.'}
                        </div>

                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', fontSize: '12px', background: 'rgba(15, 19, 17, 0.7)', padding: '12px', borderRadius: '10px', border: '1px solid var(--border-hairline)' }}>
                            <div>
                                <span style={{ color: 'var(--text-dim)', fontWeight: '700', textTransform: 'uppercase', fontSize: '10px', fontFamily: 'var(--font-mono)', letterSpacing: '0.08em' }}>Required Documents:</span>
                                <div style={{ marginTop: '6px', display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
                                    {(svc.documents_required || []).length > 0 
                                        ? (svc.documents_required || []).map((d, i) => (
                                            <span key={i} style={{ 
                                                display: 'inline-flex',
                                                alignItems: 'center',
                                                padding: '4px 10px', 
                                                background: 'rgba(184, 164, 122, 0.08)', 
                                                border: '1px solid var(--border-hairline)',
                                                borderRadius: '6px', 
                                                fontSize: '11px',
                                                fontFamily: 'var(--font-mono)',
                                                color: 'var(--accent)'
                                            }}>
                                                <i className="fas fa-file-check" style={{ marginRight: '6px', fontSize: '10px', color: 'var(--accent)' }}></i>
                                                {d.replace(/_/g, ' ')}
                                            </span>
                                        ))
                                        : <span style={{ color: 'var(--text-dim)', fontStyle: 'italic' }}>None specified</span>
                                    }
                                </div>
                            </div>
                            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: '4px', paddingTop: '6px', borderTop: '1px solid var(--border-hairline)' }}>
                                <span style={{ color: 'var(--text-dim)', fontWeight: '700', textTransform: 'uppercase', fontSize: '10px', fontFamily: 'var(--font-mono)', letterSpacing: '0.08em' }}>Processing Time:</span>
                                <span style={{ color: 'var(--accent)', fontWeight: '700', fontFamily: 'var(--font-mono)' }}>{svc.processing_time || 'Instant'}</span>
                            </div>
                        </div>

                        <div style={{ display: 'flex', gap: '10px', marginTop: '6px' }}>
                            {isAvailable ? (
                                <button className="btn btn-primary" onClick={() => {
                                    setShowServicesPage(false);
                                    startApplication(svc.id);
                                }} style={{ flex: 1, padding: '10px 14px', fontSize: '13px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', borderRadius: '8px' }}>
                                    <i className="fas fa-play"></i> Apply for this service
                                </button>
                            ) : (
                                <div style={{ flex: 1, padding: '10px 14px', fontSize: '12px', textAlign: 'center', color: 'var(--text-dim)', background: 'rgba(255,255,255,0.02)', borderRadius: '8px', border: '1px solid var(--border-hairline)' }}>
                                    <i className="fas fa-lock" style={{ marginRight: '6px' }}></i>Opening soon
                                </div>
                            )}
                            <button className="btn btn-secondary" onClick={() => {
                                if (user) {
                                    setShowServicesPage(false);
                                    sendMessage(`Tell me about ${svc.name}`);
                                } else {
                                    setShowAuth(true);
                                }
                            }} style={{ padding: '10px 16px', fontSize: '13px', borderRadius: '8px' }} title="Ask Lynx AI about this service">
                                <i className="fas fa-comment-dots" style={{ marginRight: '4px' }}></i> Ask
                            </button>
                        </div>
                    </div>
                );

                return (
                    <div className="chat-area" style={{ overflowY: 'auto' }}>
                        <div className="page-header" style={{ borderBottom: '1px solid var(--border-hairline)', padding: '20px 36px' }}>
                            <div>
                                <h2 style={{ fontSize: '22px', fontFamily: 'var(--font-editorial)', fontWeight: '800', letterSpacing: '0.02em', display: 'flex', alignItems: 'center', gap: '12px' }}>
                                    <i className="fas fa-cubes" style={{ color: 'var(--accent)' }}></i> Service Catalog
                                </h2>
                                <div style={{ fontSize: '13px', color: 'var(--text-muted)', marginTop: '4px' }}>
                                    Browse available intake programs and upcoming automated verification pipelines.
                                </div>
                            </div>
                            <button className="btn btn-secondary" onClick={() => setShowServicesPage(false)} style={{ borderRadius: '8px' }}>
                                <i className="fas fa-arrow-left" style={{ marginRight: '6px' }}></i>Back to Chat
                            </button>
                        </div>

                        <div style={{ padding: '24px' }}>
                            {services.length === 0 ? (
                                <div style={{ textAlign: 'center', padding: '60px 20px', color: '#666' }}>
                                    <div style={{ fontSize: '48px', marginBottom: '16px' }}>🔧</div>
                                    <div style={{ fontSize: '18px', marginBottom: '8px' }}>No services available</div>
                                    <div style={{ fontSize: '14px', color: '#888' }}>
                                        No services have been loaded yet. Please check the system configuration.
                                    </div>
                                </div>
                            ) : (
                                <div style={{
                                    display: 'grid',
                                    gridTemplateColumns: 'repeat(auto-fit, minmax(340px, 1fr))',
                                    gap: '24px',
                                    alignItems: 'start'
                                }}>
                                    {/* Column 1: Available Services */}
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                                        <div style={{
                                            display: 'flex',
                                            alignItems: 'center',
                                            justifyContent: 'space-between',
                                            paddingBottom: '8px',
                                            borderBottom: '2px solid var(--border-medium)'
                                        }}>
                                            <div style={{ fontSize: '15px', fontWeight: '700', color: '#fff', display: 'flex', alignItems: 'center', gap: '8px' }}>
                                                <i className="fas fa-check-circle" style={{ color: 'var(--accent)' }}></i>
                                                Available Services
                                            </div>
                                            <span style={{ fontSize: '12px', background: 'rgba(184, 164, 122, 0.12)', color: 'var(--accent)', border: '1px solid var(--border-medium)', padding: '2px 8px', borderRadius: '10px', fontWeight: '600' }}>
                                                {availableServices.length} Active
                                            </span>
                                        </div>

                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                                            {availableServices.length === 0 ? (
                                                <div style={{ padding: '20px', color: '#666', textAlign: 'center', background: '#161616', borderRadius: '10px' }}>
                                                    No available services right now.
                                                </div>
                                            ) : (
                                                availableServices.map(svc => renderServiceCard(svc, true))
                                            )}
                                        </div>
                                    </div>

                                    {/* Column 2: Coming Soon */}
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                                        <div style={{
                                            display: 'flex',
                                            alignItems: 'center',
                                            justifyContent: 'space-between',
                                            paddingBottom: '8px',
                                            borderBottom: '2px solid rgba(255, 255, 255, 0.15)'
                                        }}>
                                            <div style={{ fontSize: '15px', fontWeight: '700', color: '#bbb', display: 'flex', alignItems: 'center', gap: '8px' }}>
                                                <i className="fas fa-clock" style={{ color: '#888' }}></i>
                                                Coming Soon
                                            </div>
                                            <span style={{ fontSize: '12px', background: 'rgba(255, 255, 255, 0.08)', color: '#aaa', padding: '2px 8px', borderRadius: '10px', fontWeight: '600' }}>
                                                {comingSoonServices.length} In Pipeline
                                            </span>
                                        </div>

                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                                            {comingSoonServices.length === 0 ? (
                                                <div style={{ padding: '20px', color: '#666', textAlign: 'center', background: '#161616', borderRadius: '10px' }}>
                                                    No upcoming services announced yet.
                                                </div>
                                            ) : (
                                                comingSoonServices.map(svc => renderServiceCard(svc, false))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // Auth Modal
            if (showAuth) {
                return (
                    <div className="modal-overlay">
                        <div className="modal">
                            <div className="modal-title">
                                {authMode === 'login' ? 'Welcome Back' : authMode === 'register' ? 'Create Account' : 'Reset Password'}
                            </div>
                            <div className="modal-subtitle">
                                {authMode === 'login' ? 'Sign in to continue' : authMode === 'register' ? 'Get started with DocIntake' : 'Enter your username or email and choose a new password'}
                            </div>

                            {/* Navigation Tabs inside modal */}
                            <div style={{ display: 'flex', gap: '6px', marginBottom: '18px', background: 'rgba(255,255,255,0.04)', padding: '4px', borderRadius: '8px' }}>
                                <button
                                    type="button"
                                    onClick={() => { setAuthMode('login'); setAuthError(''); setAuthSuccess(''); }}
                                    style={{
                                        flex: 1,
                                        padding: '8px 12px',
                                        fontSize: '12px',
                                        fontWeight: 600,
                                        borderRadius: '6px',
                                        border: 'none',
                                        cursor: 'pointer',
                                        transition: 'all 0.2s',
                                        background: authMode === 'login' ? 'var(--accent, #00d285)' : 'transparent',
                                        color: authMode === 'login' ? '#000' : 'var(--text-muted, #888)'
                                    }}
                                >
                                    <i className="fas fa-sign-in-alt"></i> Sign In
                                </button>
                                <button
                                    type="button"
                                    onClick={() => { setAuthMode('register'); setAuthError(''); setAuthSuccess(''); }}
                                    style={{
                                        flex: 1,
                                        padding: '8px 12px',
                                        fontSize: '12px',
                                        fontWeight: 600,
                                        borderRadius: '6px',
                                        border: 'none',
                                        cursor: 'pointer',
                                        transition: 'all 0.2s',
                                        background: authMode === 'register' ? 'var(--accent, #00d285)' : 'transparent',
                                        color: authMode === 'register' ? '#000' : 'var(--text-muted, #888)'
                                    }}
                                >
                                    <i className="fas fa-user-plus"></i> Sign Up
                                </button>
                                <button
                                    type="button"
                                    onClick={() => { setAuthMode('reset'); setAuthError(''); setAuthSuccess(''); }}
                                    style={{
                                        flex: 1,
                                        padding: '8px 12px',
                                        fontSize: '12px',
                                        fontWeight: 600,
                                        borderRadius: '6px',
                                        border: 'none',
                                        cursor: 'pointer',
                                        transition: 'all 0.2s',
                                        background: authMode === 'reset' ? 'var(--accent, #00d285)' : 'transparent',
                                        color: authMode === 'reset' ? '#000' : 'var(--text-muted, #888)'
                                    }}
                                >
                                    <i className="fas fa-key"></i> Reset
                                </button>
                            </div>

                            <div className="form-group">
                                <label>{authMode === 'reset' ? 'Username or Email' : 'Username'}</label>
                                <input
                                    className="form-input"
                                    value={authData.username}
                                    onChange={e => setAuthData({...authData, username: e.target.value})}
                                    placeholder={authMode === 'reset' ? 'Enter username or email' : 'Enter username'}
                                    autoFocus
                                />
                            </div>

                            {authMode === 'register' && (
                                <div className="form-group">
                                    <label>Email Address</label>
                                    <input
                                        className="form-input"
                                        type="email"
                                        value={authData.email}
                                        onChange={e => setAuthData({...authData, email: e.target.value})}
                                        placeholder="Enter your email"
                                        autoComplete="email"
                                    />
                                </div>
                            )}

                            {authMode !== 'reset' && (
                                <div className="form-group">
                                    <label>Password</label>
                                    <div className="password-wrapper">
                                        <input
                                            className="form-input"
                                            type={showPassword ? "text" : "password"}
                                            value={authData.password}
                                            onChange={e => setAuthData({...authData, password: e.target.value})}
                                            placeholder="Enter password"
                                            onKeyDown={e => e.key === 'Enter' && handleAuth()}
                                            style={{ paddingRight: '40px' }}
                                        />
                                        <button
                                            type="button"
                                            className="password-toggle"
                                            onClick={() => setShowPassword(!showPassword)}
                                            tabIndex="-1"
                                            aria-label={showPassword ? "Hide password" : "Show password"}
                                        >
                                            <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                        </button>
                                    </div>
                                </div>
                            )}

                            {authMode === 'reset' && (
                                <div className="form-group">
                                    <label>New Password (min 4 chars)</label>
                                    <div className="password-wrapper">
                                        <input
                                            className="form-input"
                                            type={showPassword ? "text" : "password"}
                                            value={authData.new_password || authData.password}
                                            onChange={e => setAuthData({...authData, new_password: e.target.value, password: e.target.value})}
                                            placeholder="Enter new password"
                                            onKeyDown={e => e.key === 'Enter' && handleAuth()}
                                            style={{ paddingRight: '40px' }}
                                        />
                                        <button
                                            type="button"
                                            className="password-toggle"
                                            onClick={() => setShowPassword(!showPassword)}
                                            tabIndex="-1"
                                            aria-label={showPassword ? "Hide password" : "Show password"}
                                        >
                                            <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                        </button>
                                    </div>
                                </div>
                            )}

                            {authMode === 'register' && (
                                <React.Fragment>
                                    <div className="form-group">
                                        <label>Full Legal Name *</label>
                                        <input
                                            className="form-input"
                                            value={authData.full_name}
                                            onChange={e => setAuthData({...authData, full_name: e.target.value, name: e.target.value})}
                                            placeholder="Enter your full legal name"
                                            required
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>Date of Birth *</label>
                                        <input
                                            className="form-input"
                                            type="date"
                                            value={authData.birthday}
                                            onChange={e => setAuthData({...authData, birthday: e.target.value})}
                                            required
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>Gender *</label>
                                        <select
                                            className="form-input"
                                            value={authData.gender}
                                            onChange={e => setAuthData({...authData, gender: e.target.value})}
                                            required
                                        >
                                            <option value="">Select Gender</option>
                                            <option value="Male">Male</option>
                                            <option value="Female">Female</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                </React.Fragment>
                            )}

                            {authSuccess && (
                                <div style={{
                                    padding: '10px 14px',
                                    borderRadius: '8px',
                                    background: 'rgba(0, 210, 133, 0.15)',
                                    border: '1px solid var(--accent, #00d285)',
                                    color: 'var(--accent, #00d285)',
                                    fontSize: '13px',
                                    marginBottom: '12px'
                                }}>
                                    <i className="fas fa-check-circle" style={{ marginRight: '6px' }}></i>
                                    {authSuccess}
                                </div>
                            )}

                            {authError && (
                                <div>
                                    <div className="error-msg">{authError}</div>
                                    <div style={{ display: 'flex', gap: '8px', marginTop: '8px' }}>
                                        <button
                                            className="btn btn-ghost"
                                            onClick={() => setAuthError('')}
                                            style={{ flex: 1 }}
                                        >
                                            Try again
                                        </button>
                                        <button
                                            className="btn btn-ghost"
                                            onClick={() => setShowAuth(false)}
                                            style={{ flex: 1 }}
                                        >
                                            Cancel
                                        </button>
                                    </div>
                                </div>
                            )}

                            <button className="btn btn-primary" onClick={handleAuth} style={{ width: '100%', marginTop: '16px' }}>
                                {authMode === 'login' ? 'Sign In' : authMode === 'register' ? 'Create Account' : 'Reset Password'}
                            </button>

                            <button
                                className="btn btn-ghost"
                                onClick={() => setShowAuth(false)}
                                style={{ width: '100%', marginTop: '8px' }}
                            >
                                ← Back to Chat
                            </button>

                            <div style={{ display: 'flex', justifyContent: 'center', gap: '12px', marginTop: '12px', fontSize: '12px' }}>
                                {authMode === 'login' ? (
                                    <>
                                        <a href="#reset" onClick={(e) => { e.preventDefault(); setAuthMode('reset'); setAuthError(''); setAuthSuccess(''); }} style={{ color: 'var(--accent, #00d285)', textDecoration: 'none' }}>
                                            Forgot password? Reset
                                        </a>
                                        <span style={{ color: '#555' }}>•</span>
                                        <a href="#signup" onClick={(e) => { e.preventDefault(); setAuthMode('register'); setAuthError(''); setAuthSuccess(''); }} style={{ color: 'var(--text-muted, #aaa)', textDecoration: 'none' }}>
                                            Need an account? Sign up
                                        </a>
                                    </>
                                ) : authMode === 'reset' ? (
                                    <a href="#signin" onClick={(e) => { e.preventDefault(); setAuthMode('login'); setAuthError(''); setAuthSuccess(''); }} style={{ color: 'var(--accent, #00d285)', textDecoration: 'none' }}>
                                        Remembered your password? Sign in
                                    </a>
                                ) : (
                                    <a href="#signin" onClick={(e) => { e.preventDefault(); setAuthMode('login'); setAuthError(''); setAuthSuccess(''); }} style={{ color: 'var(--accent, #00d285)', textDecoration: 'none' }}>
                                        Already have an account? Sign in
                                    </a>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div>
                    {/* Top bar */}
                    <div className="topbar">
                        <div className="topbar-left">
                            <button className="sidebar-toggle" onClick={() => setSidebarOpen(!sidebarOpen)}>
                                <i className="fas fa-bars"></i>
                            </button>
                            <div className="logo">
                                DOCINTAKE
                                <span className="brand-badge">TASK 1</span>
                            </div>
                            <div className="topbar-time">{currentTime}</div>
                        </div>
                        <div className="topbar-right">
                            {user ? (
                                <>
                                    <span style={{ fontSize: '13px', color: '#888' }}>Logged in as {user.username}</span>
                                    <button className="btn btn-ghost" onClick={handleLogout}>
                                        <i className="fas fa-sign-out-alt"></i> Logout
                                    </button>
                                </>
                            ) : (
                                <button className="btn btn-primary" onClick={() => setShowAuth(true)}>
                                    <i className="fas fa-user"></i> Login
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Main layout */}
                    <div className="main-layout">
                        {sidebarOpen && (
                            <div className="sidebar-backdrop" onClick={() => setSidebarOpen(false)} />
                        )}
                        {/* Sidebar */}
                        <div className={`sidebar ${!sidebarOpen ? 'collapsed' : ''}`}>
                            <div className="sidebar-header">
                                <button className="sidebar-btn" onClick={() => { handleResetChat(); if (window.innerWidth <= 768) setSidebarOpen(false); }}>
                                    <i className="fas fa-undo"></i>
                                    Reset Chat
                                </button>
                                <button className="sidebar-btn" onClick={() => { handleStartApplication(); if (window.innerWidth <= 768) setSidebarOpen(false); }} style={{ borderColor: 'var(--border-medium)', background: 'rgba(184, 164, 122, 0.08)' }}>
                                    <i className="fas fa-file-alt" style={{ color: 'var(--accent)' }}></i>
                                    Start New Application
                                </button>
                            </div>

                            <div className="sidebar-section">
                                <div className="sidebar-section-title">Navigation</div>
                                <div className={`sidebar-item ${!showServicesPage && !showAccountPage && !showApplicationFlow ? 'active' : ''}`} onClick={() => { setShowServicesPage(false); setShowAccountPage(false); setShowApplicationFlow(false); if (window.innerWidth <= 768) setSidebarOpen(false); }}>
                                    <i className="fas fa-comment"></i> Chat
                                </div>
                                <div className={`sidebar-item ${showServicesPage ? 'active' : ''}`} onClick={() => { setShowServicesPage(true); setShowAccountPage(false); setShowApplicationFlow(false); if (window.innerWidth <= 768) setSidebarOpen(false); }}>
                                    <i className="fas fa-cogs"></i> Services
                                </div>
                                <div className={`sidebar-item ${showAccountPage ? 'active' : ''}`} onClick={() => { setShowAccountPage(true); setShowServicesPage(false); setShowApplicationFlow(false); loadUserProfile(); loadDocuments(); loadApplications(); if (window.innerWidth <= 768) setSidebarOpen(false); }}>
                                    <i className="fas fa-user-circle"></i> Account
                                    <span style={{ marginLeft: 'auto', fontSize: '11px', background: '#252525', padding: '2px 8px', borderRadius: '10px', color: '#888' }}>
                                        {documents.length + applications.length}
                                    </span>
                                </div>
                            </div>

                            <div className="sidebar-status">
                                <div className="status-item">
                                    <div className={`status-dot ${systemHealthy ? '' : 'offline'}`}></div>
                                    <span style={{ color: systemHealthy ? '#22c55e' : '#666' }}>
                                        {systemHealthy ? 'System Online' : 'System Offline'}
                                    </span>
                                </div>
                                <div className="status-item">
                                    <div className={`status-dot ${ollamaHealthy ? '' : 'offline'}`}></div>
                                    <span style={{ color: ollamaHealthy ? '#22c55e' : '#666' }}>
                                        {ollamaHealthy ? 'Ollama Connected' : 'Ollama Offline'}
                                    </span>
                                </div>
                            </div>
                        </div>

                        {/* Content area */}
                        {showServicesPage ? (
                            renderServicesPage()
                        ) : showAccountPage || showDocumentsPage || showApplicationsPage ? (
                            renderAccountPage()
                        ) : (
                            <div className="chat-area">
                            <div className="chat-messages">
                                {messages.length === 0 ? (
                                    <div className="welcome-message">
                                        <div className="welcome-badge">AUTONOMOUS MULTI-SERVICE INTAKE</div>
                                        <div className="welcome-icon">⚡</div>
                                        <div className="welcome-title">DocIntake</div>
                                        <div className="welcome-text">Agentic document onboarding &amp; instant vision AI verification across multi-service registries. How can we assist your onboarding today?</div>
                                        <div className="feature-grid">
                                            <div className="feature-card" onClick={() => handleFeatureClick('I want to apply for basic registration')}>
                                                <div className="feature-icon">🆔</div>
                                                <div className="feature-title">Basic Registration</div>
                                                <div className="feature-desc">National ID extraction with automated ClamAV hygiene &amp; clarity scoring</div>
                                            </div>
                                            <div className="feature-card" onClick={() => handleFeatureClick('I want to apply for premium cross-border service')}>
                                                <div className="feature-icon">🌍</div>
                                                <div className="feature-title">Cross Border</div>
                                                <div className="feature-desc">Multi-document cross validation with passport &amp; Emirates ID matching</div>
                                            </div>
                                            <div className="feature-card" onClick={() => handleFeatureClick('I need mobility or rental service')}>
                                                <div className="feature-icon">🚗</div>
                                                <div className="feature-title">Mobility &amp; Rental</div>
                                                <div className="feature-desc">Instant driving license category &amp; traffic code extraction</div>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <>
                                        {messages.map((msg, idx) => (
                                            msg.role === 'system' ? (
                                                <div key={idx} className="system-message">
                                                    <div className="message-content">
                                                        {msg.content}
                                                    </div>
                                                </div>
                                            ) : (
                                                <div key={idx} className={`message ${msg.role}`}>
                                                    <div className="message-avatar">
                                                        {msg.role === 'assistant' ? '🦊' : '👤'}
                                                    </div>
                                                    <div>
                                                        <div className="message-content">
                                                            {msg.content.split('\n').map((line, i) => (
                                                                <div key={i}>{line}</div>
                                                            ))}
                                                        </div>
                                                        {renderWizardMessage(msg)}
                                                        {msg.service && (
                                                            <div className="service-badge">
                                                                <span>{getServiceIcon(msg.service)}</span>
                                                                <span>Connected to: {msg.service.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase())}</span>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            )
                                        ))}
                                    </>
                                )}
                                {loading && (
                                    <div className="message assistant">
                                        <div className="message-avatar">🦊</div>
                                        <div className="message-content">
                                            <div className="typing-indicator">
                                                <div className="typing-dot"></div>
                                                <div className="typing-dot"></div>
                                                <div className="typing-dot"></div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                                <div ref={chatEndRef} />
                            </div>

                            <div className="chat-input-area">
                                <div className="input-container">
                                    <div className="input-wrapper">
                                        <textarea
                                            id="chatInput"
                                            value={input}
                                            onChange={e => setInput(e.target.value)}
                                            placeholder="Type your message..."
                                            rows="1"
                                            onKeyDown={e => {
                                                if (e.key === 'Enter' && !e.shiftKey) {
                                                    e.preventDefault();
                                                    sendMessage();
                                                }
                                            }}
                                        />
                                        <button className="send-btn" onClick={() => sendMessage()} disabled={loading}>
                                            <i className="fas fa-paper-plane"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        )}
                    </div>

                    {/* In-website Document Viewer Modal */}
                    {viewingDoc && (
                        <div style={{
                            position: 'fixed',
                            top: 0,
                            left: 0,
                            right: 0,
                            bottom: 0,
                            background: 'rgba(0, 0, 0, 0.85)',
                            display: 'flex',
                            flexDirection: 'column',
                            zIndex: 9999,
                            padding: '16px'
                        }}>
                            <div style={{
                                display: 'flex',
                                justifyContent: 'space-between',
                                alignItems: 'center',
                                background: '#1e1e1e',
                                padding: '12px 20px',
                                borderRadius: '8px 8px 0 0',
                                borderBottom: '1px solid #333'
                            }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                                    <span style={{ fontSize: '18px' }}>📄</span>
                                    <span style={{ fontWeight: '600', color: '#fff', fontSize: '15px' }}>{viewingDoc.filename}</span>
                                </div>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                                    <a
                                        href={viewingDoc.url}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="btn btn-secondary"
                                        style={{ fontSize: '12px', padding: '6px 12px', textDecoration: 'none', color: '#fff' }}
                                    >
                                        <i className="fas fa-external-link-alt" style={{ marginRight: '6px' }}></i> Open in new tab
                                    </a>
                                    <button
                                        onClick={() => setViewingDoc(null)}
                                        className="btn btn-ghost"
                                        style={{ fontSize: '18px', padding: '4px 10px', color: '#aaa', cursor: 'pointer' }}
                                        title="Close viewer"
                                    >
                                        ✕
                                    </button>
                                </div>
                            </div>
                            <div style={{
                                flex: 1,
                                background: '#121212',
                                borderRadius: '0 0 8px 8px',
                                overflow: 'hidden',
                                display: 'flex',
                                justifyContent: 'center',
                                alignItems: 'center'
                            }}>
                                <iframe
                                    src={viewingDoc.url}
                                    style={{
                                        width: '100%',
                                        height: '100%',
                                        border: 'none',
                                        background: '#fff'
                                    }}
                                    title="Document Preview"
                                />
                            </div>
                        </div>
                    )}

                    {/* Bottom-right sticky version badge */}
                    <div style={{
                        position: 'fixed',
                        bottom: '14px',
                        right: '18px',
                        zIndex: 9999,
                        background: 'rgba(18, 24, 21, 0.9)',
                        backdropFilter: 'blur(10px)',
                        WebkitBackdropFilter: 'blur(10px)',
                        border: '1px solid var(--border-medium)',
                        borderRadius: '20px',
                        padding: '5px 14px',
                        display: 'flex',
                        alignItems: 'center',
                        gap: '8px',
                        fontSize: '11px',
                        fontFamily: 'var(--font-mono)',
                        color: 'var(--text-muted)',
                        boxShadow: '0 4px 16px rgba(0, 0, 0, 0.5), 0 0 15px var(--accent-glow)',
                        pointerEvents: 'none',
                        letterSpacing: '0.06em'
                    }}>
                        <span style={{
                            width: '7px',
                            height: '7px',
                            borderRadius: '50%',
                            background: 'var(--accent)',
                            display: 'inline-block',
                            boxShadow: '0 0 8px var(--accent)'
                        }}></span>
                        <span>TASK 1 • v2.2</span>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
