<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocIntake - AI Document Onboarding</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e4e4e4;
            overflow: hidden;
        }

        #root {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top bar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #141414;
            border-bottom: 1px solid #2a2a2a;
            z-index: 100;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-toggle {
            background: none;
            border: none;
            color: #888;
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .sidebar-toggle:hover {
            background: #2a2a2a;
            color: #fff;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #84BD00;
        }

        .topbar-time {
            font-size: 12px;
            color: #888;
            font-weight: 500;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-ghost {
            background: none;
            color: #888;
        }

        .btn-ghost:hover {
            color: #fff;
            background: #2a2a2a;
        }

        .btn-primary {
            background: #84BD00;
            color: #121314;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #5f8700;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #2a2a2a;
            color: #e4e4e4;
        }

        .btn-secondary:hover {
            background: #3a3a3a;
        }

        .btn-success {
            background: #22c55e;
            color: white;
        }

        .btn-success:hover {
            background: #16a34a;
        }

        /* Main layout */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: #111111;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            transition: width 0.3s, opacity 0.3s;
            overflow: hidden;
        }

        .sidebar.collapsed {
            width: 0;
            opacity: 0;
            border: none;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #2a2a2a;
        }

        .sidebar-btn {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #e4e4e4;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            transition: all 0.2s;
            margin-bottom: 8px;
        }

        .sidebar-btn:hover {
            background: #2a2a2a;
            border-color: #84BD00;
        }

        .sidebar-section {
            padding: 12px 16px;
        }

        .sidebar-section-title {
            font-size: 11px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .sidebar-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #999;
            transition: all 0.2s;
            margin-bottom: 2px;
        }

        .sidebar-item:hover, .sidebar-item.active {
            background: #1a1a1a;
            color: #e4e4e4;
        }

        .sidebar-item i {
            width: 16px;
            text-align: center;
        }

        .sidebar-status {
            margin-top: auto;
            padding: 16px;
            border-top: 1px solid #2a2a2a;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
        }

        .status-dot.offline {
            background: #666;
        }

        /* Chat area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.assistant .message-avatar {
            background: #84BD00;
            color: #121314;
        }

        .message.user .message-avatar {
            background: #333;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
        }

        .message.assistant .message-content {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-top-left-radius: 4px;
        }

        .message.user .message-content {
            background: #84BD00;
            color: #121314;
            border-top-right-radius: 4px;
        }

        .system-message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s ease-in;
            justify-content: center;
        }

        .system-message .message-content {
            background: transparent;
            border: 1px solid #2a2a2a;
            color: #888;
            font-size: 13px;
            padding: 8px 12px;
            text-align: center;
        }

        .service-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(132, 189, 0, 0.12);
            border: 1px solid rgba(132, 189, 0, 0.35);
            border-radius: 6px;
            font-size: 11px;
            color: #84BD00;
            margin-top: 8px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #666;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* Input area */
        .chat-input-area {
            padding: 20px;
            background: #141414;
            border-top: 1px solid #2a2a2a;
        }

        .input-container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 12px 16px;
            gap: 12px;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #84BD00;
        }

        .upload-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 4px;
            font-size: 18px;
            transition: color 0.2s;
        }

        .upload-btn:hover {
            color: #84BD00;
        }

        #chatInput {
            flex: 1;
            background: none;
            border: none;
            color: #e4e4e4;
            font-size: 15px;
            outline: none;
            resize: none;
            min-height: 24px;
            max-height: 120px;
        }

        .send-btn {
            background: #84BD00;
            border: none;
            color: #121314;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #5f8700;
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .file-preview {
            margin-top: 8px;
            padding: 8px 12px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            font-size: 12px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-remove {
            cursor: pointer;
            color: #ef4444;
        }

        /* Auth modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s;
        }

        .modal {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .modal-subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #999;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #e4e4e4;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #84BD00;
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 4px;
            font-size: 14px;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: #e4e4e4;
        }

        .error-msg {
            color: #ef4444;
            font-size: 12px;
            margin-top: 6px;
        }

        .welcome-message {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .welcome-icon {
            font-size: 48px;
            margin-bottom: 16px;
            color: #84BD00;
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #e4e4e4;
        }

        .welcome-text {
            font-size: 16px;
            margin-bottom: 32px;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 500px;
            margin: 0 auto;
        }

        .feature-card {
            padding: 16px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .feature-card:hover {
            border-color: #84BD00;
            transform: translateY(-2px);
        }

        .feature-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .feature-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .feature-desc {
            font-size: 12px;
            color: #666;
        }

        /* Page header */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
        }

        .page-header h2 {
            font-size: 20px;
            font-weight: 600;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        const API_BASE = 'http://127.0.0.1:8000/api/v1';

        // ---- In-chat application wizard cards (rendered inside chat messages, no page overlay) ----
        function WizardCardShell({ children }) {
            return <div style={{ background: '#1a1a1a', border: '1px solid #2a2a2a', borderRadius: '12px', padding: '16px', marginTop: '8px', maxWidth: '520px' }}>{children}</div>;
        }

        function WizardOffer({ onYes, onNo }) {
            return (
                <WizardCardShell>
                    <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                        <button className="btn btn-primary" onClick={onYes}>Yes, start my application</button>
                        <button className="btn btn-secondary" onClick={onNo}>Not now</button>
                    </div>
                </WizardCardShell>
            );
        }

        function WizardServices({ services, onPick }) {
            return (
                <WizardCardShell>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                        {services.map(sv => {
                            const ok = !sv.status || sv.status === 'available';
                            return <button key={sv.id} className="btn btn-secondary" disabled={!ok} onClick={() => onPick(sv.id)} style={{ textAlign: 'left' }}><strong>{sv.name}</strong>{!ok && ' (coming soon)'}</button>;
                        })}
                    </div>
                </WizardCardShell>
            );
        }

        function WizardUpload({ docs, uploaded, busy, onFile, isId, pretty }) {
            return (
                <WizardCardShell>
                    {docs.map(d => {
                        const done = uploaded.some(u => u.docType === d);
                        const working = busy === d;
                        return (
                            <div key={d} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '12px', padding: '8px 0' }}>
                                <div>
                                    <div style={{ fontSize: '14px', fontWeight: 500, color: done ? '#22c55e' : '#ccc' }}>{done ? '✅ ' : '📄 '}{pretty(d)}</div>
                                    <div style={{ fontSize: '11px', color: '#888' }}>{isId(d) ? 'PDF or scanned PDF, max 10 MB' : 'PDF or image, max 10 MB'}</div>
                                </div>
                                <label className="btn btn-secondary" style={{ cursor: done || working ? 'default' : 'pointer', opacity: done || working ? 0.6 : 1 }}>
                                    <input type="file" style={{ display: 'none' }} disabled={done || working}
                                        accept={isId(d) ? '.pdf,application/pdf' : '.pdf,.png,.jpg,.jpeg,.tiff,.bmp'}
                                        onChange={e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) onFile(f, d); }} />
                                    {working ? 'Checking...' : done ? 'Uploaded' : 'Choose file'}
                                </label>
                            </div>
                        );
                    })}
                    <div style={{ fontSize: '12px', color: '#888', marginTop: '6px' }}>You can also use the paperclip in the message box. Sensitive details are masked in this chat.</div>
                </WizardCardShell>
            );
        }

        function WizardReview({ name, docs, mask, pretty, disabled, onConfirm, onReplace, onRestart }) {
            const [shown, setShown] = useState({});
            const toggle = k => setShown(p => ({ ...p, [k]: !p[k] }));
            return (
                <WizardCardShell>
                    <div style={{ fontSize: '13px' }}><span style={{ color: '#888' }}>Applicant: </span><strong>{name}</strong></div>
                    {docs.map(d => (
                        <div key={d.docType} style={{ marginTop: '12px' }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <strong style={{ fontSize: '13px' }}>{pretty(d.docType)}</strong>
                                <button className="btn btn-ghost" disabled={disabled} onClick={() => onReplace(d.docType)} style={{ padding: '2px 8px', fontSize: '12px' }}>Replace</button>
                            </div>
                            {Object.entries(d.extractedFields || {}).map(([k, v]) => {
                                const key = d.docType + k;
                                const m = mask(k, v);
                                const sensitive = m !== String(v);
                                return (
                                    <div key={k} style={{ display: 'flex', gap: '8px', fontSize: '12px', padding: '3px 0' }}>
                                        <span style={{ color: '#888', minWidth: '130px' }}>{k.replace(/_/g, ' ')}</span>
                                        <span style={{ wordBreak: 'break-word' }}>{shown[key] ? String(v) : m}</span>
                                        {sensitive && <button className="btn btn-ghost" onClick={() => toggle(key)} style={{ padding: '0 6px', fontSize: '11px' }}>{shown[key] ? 'Hide' : 'Show'}</button>}
                                    </div>
                                );
                            })}
                        </div>
                    ))}
                    <div style={{ display: 'flex', gap: '8px', marginTop: '16px' }}>
                        <button className="btn btn-primary" disabled={disabled} onClick={onConfirm}>Confirm and submit</button>
                        <button className="btn btn-secondary" disabled={disabled} onClick={onRestart}>Start over</button>
                    </div>
                </WizardCardShell>
            );
        }

        function App() {
            const [sidebarOpen, setSidebarOpen] = useState(true);
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [file, setFile] = useState(null);
            const [loading, setLoading] = useState(false);
            const [showAuth, setShowAuth] = useState(false);
            const [user, setUser] = useState(null);
            const [authMode, setAuthMode] = useState('login');
            const [authData, setAuthData] = useState({ username: '', password: '', name: '' });
            const [authError, setAuthError] = useState('');
            const [services, setServices] = useState([]);
            const [documents, setDocuments] = useState([]);
            const [showDocumentsPage, setShowDocumentsPage] = useState(false);
            const [showServicesPage, setShowServicesPage] = useState(false);
            const [showApplicationFlow, setShowApplicationFlow] = useState(false);
            // In-chat application wizard state
            const [wizardStep, setWizardStep] = useState(null); // null | name | upload | review | submitting | success
            const [wizardService, setWizardService] = useState(null);
            const [wizardName, setWizardName] = useState('');
            const [wizardAppId, setWizardAppId] = useState(null);
            const [wizardDocs, setWizardDocs] = useState([]);
            const [wizardBusy, setWizardBusy] = useState(null);
            const pendingApplyRef = useRef(null); // service to resume after login
            const [systemHealthy, setSystemHealthy] = useState(false);
            const [ollamaHealthy, setOllamaHealthy] = useState(false);
            const [currentTime, setCurrentTime] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const chatEndRef = useRef(null);
            const fileInputRef = useRef(null);

            // Refs to avoid stale closures
            const messagesRef = useRef([]);
            const loadingRef = useRef(false);

            useEffect(() => {
                // Clock every second
                const updateTime = () => {
                    const now = new Date();
                    const options = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
                    setCurrentTime(now.toLocaleDateString('en-US', options));
                };
                updateTime();
                const interval = setInterval(updateTime, 1000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                messagesRef.current = messages;
            }, [messages]);

            useEffect(() => {
                loadingRef.current = loading;
            }, [loading]);

            useEffect(() => {
                loadServices();
                loadDocuments();
                checkAuth();
                checkHealth();
                // Poll health every 30s
                const interval = setInterval(checkHealth, 30000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            const checkAuth = async () => {
                const token = localStorage.getItem('token');
                const username = localStorage.getItem('username');
                if (token && username) {
                    setUser({ token, username });
                }
            };

            const checkHealth = async () => {
                try {
                    const res = await fetch(`${API_BASE}/health`);
                    const data = await res.json();
                    setSystemHealthy(data.status === 'healthy');
                    setOllamaHealthy(data.services?.generation === 'healthy' || data.services?.generation === 'model_not_found');
                } catch (e) {
                    setSystemHealthy(false);
                    setOllamaHealthy(false);
                }
            };

            const loadServices = async () => {
                try {
                    const res = await fetch(`${API_BASE}/services`);
                    const data = await res.json();
                    setServices(data.data?.services || []);
                } catch (e) {
                    console.error('Failed to load services:', e);
                }
            };

            const loadDocuments = async () => {
                try {
                    const res = await fetch(`${API_BASE}/documents`);
                    const data = await res.json();
                    setDocuments(data.data?.documents || []);
                } catch (e) {
                    console.error('Failed to load documents:', e);
                }
            };

            const handleAuth = async () => {
                setAuthError('');
                try {
                    const endpoint = authMode === 'login' ? '/auth/login' : '/auth/register';
                    const body = authMode === 'login'
                        ? { username: authData.username, password: authData.password }
                        : { username: authData.username, password: authData.password, name: authData.name || authData.username };

                    const res = await fetch(`${API_BASE}${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });

                    const data = await res.json();

                    if (authMode === 'login' && data.success) {
                        localStorage.setItem('token', data.data.token);
                        localStorage.setItem('username', data.data.email || authData.username);
                        setUser({ token: data.data.token, username: data.data.email || authData.username });
                        setShowAuth(false);
                        const pending = pendingApplyRef.current;
                        if (pending) {
                            pendingApplyRef.current = null;
                            addMessage('assistant', 'Welcome back! Let us pick up your application.');
                            setTimeout(() => resumePendingApply(pending), 0);
                        }
                    } else if (authMode === 'register' && data.success) {
                        setAuthMode('login');
                        alert('Account created! Please login.');
                    } else {
                        setAuthError(data.detail || data.error || 'Authentication failed');
                    }
                } catch (e) {
                    setAuthError('Connection error');
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('token');
                localStorage.removeItem('username');
                setUser(null);
            };

            const handleFileUpload = async () => {
                if (!file) return;

                // During the wizard, the paperclip sends the file to the next missing required document
                if (wizardStep === 'upload') {
                    const next = wizardRequiredDocs().find(d => !wizardDocs.some(u => u.docType === d));
                    if (next) {
                        const f = file;
                        setFile(null);
                        if (fileInputRef.current) fileInputRef.current.value = '';
                        wizardUploadDocument(f, next);
                        return;
                    }
                }

                const formData = new FormData();
                formData.append('file', file);

                try {
                    const res = await fetch(`${API_BASE}/documents/extract`, {
                        method: 'POST',
                        body: formData
                    });

                    const data = await res.json();

                    if (data.success) {
                        const extractedFields = data.data?.extracted_fields || {};
                        const fieldCount = Object.keys(extractedFields).length;

                        addMessage('system', `✅ Document processed: ${file.name}`);

                        if (fieldCount > 0) {
                            let fieldDetails = `\n📋 **Extracted Fields** (${fieldCount} fields):\n`;
                            for (const [key, value] of Object.entries(extractedFields)) {
                                if (!key.startsWith('_')) {
                                    fieldDetails += `• **${key}**: ${value}\n`;
                                }
                            }
                            addMessage('system', fieldDetails.trim());
                        }

                        setFile(null);
                        if (fileInputRef.current) fileInputRef.current.value = '';
                        loadDocuments();
                    } else {
                        addMessage('system', `❌ Extraction failed: ${data.error || data.detail || 'Unknown error'}`);
                    }
                } catch (e) {
                    addMessage('system', `❌ Upload error: ${e.message}`);
                }
            };

            const isGreeting = (text) => {
                const greetings = ['hi', 'hello', 'hey', 'good morning', 'good afternoon', 'good evening', 'good night', 'greetings'];
                return greetings.some(g => text.toLowerCase().includes(g));
            };

            const getTimeGreeting = () => {
                const hour = new Date().getHours();
                if (hour < 12) return 'Good morning';
                if (hour < 17) return 'Good afternoon';
                if (hour < 21) return 'Good evening';
                return 'Good night';
            };

            const getLynxGreeting = () => {
                return `${getTimeGreeting()}! I'm Lynx, your DocIntake assistant. I'm ready to help you with document onboarding, service inquiries, and applications. How can I assist you?`;
            };

            const sendMessage = async (messageText) => {
                const query = messageText || input.trim();
                if (!query && !file) return;
                if (loadingRef.current) return;

                const userMessage = query;
                addMessage('user', userMessage);

                // While the wizard waits for the applicant's name, the chat input is the answer
                if (wizardStep === 'name' && wizardService) {
                    setInput('');
                    wizardProceedToUpload(userMessage);
                    return;
                }

                setLoading(true);
                setInput('');
                setFile(null);
                if (fileInputRef.current) fileInputRef.current.value = '';

                // Handle greetings locally with Lynx personality
                if (isGreeting(query)) {
                    setTimeout(() => {
                        addMessage('assistant', getLynxGreeting());
                        setLoading(false);
                    }, 500);
                    return;
                }

                try {
                    const token = getToken();
                    const res = await fetch(`${API_BASE}/chat/message?token=${encodeURIComponent(token)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query: userMessage })
                    });

                    const data = await res.json();

                    let responseText = data.response || 'No response';
                    let matchedService = data.matched_service;

                    if (data.sources && data.sources.length > 0) {
                        const sourceNames = data.sources.map(s => s.filename).join(', ');
                        responseText += `\n\n📚 Sources: ${sourceNames}`;
                    }

                    if (data.confidence !== undefined) {
                        responseText += `\n\n🎯 Confidence: ${(data.confidence * 100).toFixed(0)}%`;
                    }

                    addMessage('assistant', responseText, matchedService);

                    // Offer to start an application when the user wants to apply or is asking about services
                    const wantsApply = data.intent === 'apply' || /\b(apply|application|register|registration|sign ?up|enrol+)\b/i.test(userMessage);
                    const asksServices = !!matchedService || /\b(services?|offer(ed)?|available|requirements?|eligib\w+)\b/i.test(userMessage);
                    if ((wantsApply || asksServices) && !(wizardStep && wizardStep !== 'success')) {
                        offerApplication(matchedService, wantsApply);
                    }
                } catch (e) {
                    addMessage('assistant', `Error: ${e.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const addMessage = (role, content, service = null, extra = null) => {
                setMessages(prev => [...prev, { role, content, service, timestamp: new Date(), ...(extra || {}) }]);
            };

            const formatFileSize = (bytes) => {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            };

            const getServiceIcon = (serviceId) => {
                const icons = {
                    basic_registration: '🆔',
                    premium_crossborder: '🌍',
                    mobility_rental: '🚗'
                };
                return icons[serviceId] || '📋';
            };

            const requireAuth = (callback) => {
                if (!user) {
                    setShowAuth(true);
                    return false;
                }
                callback();
                return true;
            };

            const handleFeatureClick = (messageText) => {
                if (messageText === 'Upload a document') {
                    if (!requireAuth(() => fileInputRef.current?.click())) return;
                } else if (/apply|register/i.test(messageText)) {
                    const svcId = /basic|registration/i.test(messageText) ? 'basic_registration'
                        : /premium|cross/i.test(messageText) ? 'premium_crossborder'
                        : /mobility|rental/i.test(messageText) ? 'mobility_rental' : null;
                    startApplication(svcId);
                } else {
                    if (!requireAuth(() => sendMessage(messageText))) return;
                }
            };

            const handleServiceClick = (serviceId, serviceName) => {
                if (!requireAuth(() => sendMessage(`Tell me about ${serviceName}`))) return;
            };

            const handleResetChat = () => {
                setMessages([]);
                resetWizard();
            };

            const handleStartApplication = () => startApplication(null);

            // ================= In-chat application wizard =================
            // Every step (service, name, documents, review, submit) happens inside the chat. Nothing covers the page.
            const getToken = () => user?.token || localStorage.getItem('token') || '';
            const wizardRequiredDocs = () => wizardService?.documents_required || [];
            const isIdDocument = (d) => /national.?id|passport|(^|[\s_])id([\s_]|$)/i.test(d);
            const prettyDoc = (d) => d.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

            // PII masking for anything shown in chat; the raw value appears only when the user taps "Show"
            const SENSITIVE_KEY = /(^|_)(id|eid|passport|dob|birth|phone|mobile|email|address|iban|account|licen[sc]e)(_|$)|number/i;
            const maskWizardValue = (key, value) => {
                const v = String(value);
                if (!SENSITIVE_KEY.test(key)) return v;
                if (/birth|dob/i.test(key)) return '••/••/••••';
                return v.length <= 4 ? '••••' : '•'.repeat(v.length - 3) + v.slice(-3);
            };

            const clearWizardState = () => {
                setWizardDocs([]);
                setWizardAppId(null);
                setWizardBusy(null);
            };

            const resetWizard = () => {
                clearWizardState();
                setWizardService(null);
                setWizardName('');
                setWizardStep(null);
            };

            const dismissOffers = () => setMessages(prev => prev.map(m => m.type === 'wizard_offer' ? { ...m, dismissed: true } : m));

            // Bot offers to start an application; needs a login first
            const offerApplication = (serviceId, explicit) => {
                const svc = services.find(s => s.id === serviceId);
                if (!getToken()) {
                    if (explicit) {
                        pendingApplyRef.current = serviceId || 'any';
                        addMessage('assistant', 'To start an application you need to be signed in. Please sign in and I will continue right here.');
                        setShowAuth(true);
                    } else {
                        addMessage('assistant', 'If you would like to apply, please sign in first and I can start the application for you here in chat.');
                    }
                    return;
                }
                addMessage('assistant', svc ? `Would you like me to start a new ${svc.name} application for you?` : 'Would you like me to start a new application for you?', null, { type: 'wizard_offer', serviceId: serviceId || null });
            };

            const startApplication = (serviceId) => {
                setShowServicesPage(false);
                setShowDocumentsPage(false);
                if (!getToken()) {
                    pendingApplyRef.current = serviceId || 'any';
                    addMessage('assistant', 'Please sign in to start an application. I will continue right here once you are in.');
                    setShowAuth(true);
                    return;
                }
                resumePendingApply(serviceId || 'any');
            };

            const resumePendingApply = (serviceId) => {
                const svc = serviceId && serviceId !== 'any' ? services.find(s => s.id === serviceId) : null;
                if (svc) beginService(svc); else initWizardSession();
            };

            const initWizardSession = () => {
                resetWizard();
                setWizardStep('welcome');
                addMessage('assistant', 'Which service would you like to apply for?', null, { type: 'wizard_services' });
            };

            const beginService = (svc) => {
                if (svc.status && svc.status !== 'available') {
                    addMessage('assistant', `${svc.name} is not open for applications yet.`);
                    return;
                }
                dismissOffers();
                clearWizardState();
                setWizardName('');
                setWizardService(svc);
                setWizardStep('name');
                addMessage('assistant', `Let us start your ${svc.name} application. You will need: ${(svc.documents_required || []).map(prettyDoc).join(', ')}. Everything happens right here in chat. What is your full name as it appears on your ID?`, svc.id);
            };

            const startWizardService = (serviceId) => {
                const svc = services.find(s => s.id === serviceId);
                if (svc) beginService(svc);
            };

            const wizardProceedToUpload = async (nameInput) => {
                const name = (nameInput || '').trim();
                const ask = (msg) => addMessage('assistant', msg + ' Please send your full name again.');
                if (name.length < 2) return ask('Your name must be at least 2 characters.');
                if (!/^[A-Za-zÀ-ÖØ-öø-ÿ\u00C0-\u024F ]+$/.test(name)) return ask('Names can only contain letters and single spaces.');

                setLoading(true);
                try {
                    const token = getToken();
                    // Step 1: Create wizard session
                    const res = await fetch(`${API_BASE}/wizard/create?token=${encodeURIComponent(token)}&service_id=${encodeURIComponent(wizardService.id)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    const data = await res.json();
                    if (!data.success) {
                        const d = data.detail || data.error;
                        addMessage('assistant', `I could not start your application${typeof d === 'string' ? ': ' + d : ''}. Please send your name again.`);
                        return;
                    }
                    const wizardSessionId = data.data.session_id;
                    // Step 2: Submit name
                    const nameRes = await fetch(`${API_BASE}/wizard/${wizardSessionId}/name?token=${encodeURIComponent(token)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name })
                    });
                    const nameData = await nameRes.json();
                    if (!nameData.success) {
                        addMessage('assistant', `I could not record your name. Please send it again.`);
                        return;
                    }
                    setWizardName(name);
                    setWizardAppId(wizardSessionId);
                    setWizardStep('upload');
                    addMessage('assistant', `Thanks, ${name}. Now please upload your documents using the card below.`, null, { type: 'wizard_upload' });
                } catch (e) {
                    addMessage('assistant', `I could not start your application (${e.message}). Please send your name again.`);
                } finally {
                    setLoading(false);
                }
            };

            const wizardUploadDocument = async (file, docType) => {
                const wizardSessionId = wizardAppId;
                if (!wizardSessionId) {
                    addMessage('assistant', 'Your application has not been created yet. Please tell me your full name first.');
                    return false;
                }
                const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
                if (isIdDocument(docType) && !isPdf) {
                    addMessage('assistant', `"${file.name}" is not a PDF. Please send your ${prettyDoc(docType)} as a PDF or scanned PDF.`, null, { type: 'wizard_upload' });
                    return false;
                }
                if (file.size > 10 * 1024 * 1024) {
                    addMessage('assistant', `"${file.name}" is larger than 10 MB. Please send a smaller file.`, null, { type: 'wizard_upload' });
                    return false;
                }

                addMessage('user', `📎 ${file.name}`);
                setWizardBusy(docType);
                const resend = (why) => addMessage('assistant', `I could not accept "${file.name}": ${why} Please send your ${prettyDoc(docType)} again.`, null, { type: 'wizard_upload' });

                try {
                    const formData = new FormData();
                    formData.append('file', file);
                    const token = getToken();
                    const res = await fetch(`${API_BASE}/wizard/${wizardSessionId}/upload?token=${encodeURIComponent(token)}`, {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json().catch(() => ({}));

                    if (!res.ok || data.success === false) {
                        const d = data.detail || data.error || data.message;
                        const issues = data.data?.issues || [];
                        if (issues.length) {
                            resend(issues.join('; '));
                        } else {
                            resend(typeof d === 'string' ? d : 'the upload failed.');
                        }
                        return false;
                    }

                    // If the wizard backend returned clarity check results, show them
                    if (data.data?.clarity_status === 'fail' && data.data?.quality_score) {
                        addMessage('assistant', `⚠️ Document clarity check: quality score ${data.data.quality_score.toFixed(2)}. Please upload a clearer image.`, null, { type: 'wizard_upload' });
                        return false;
                    }

                    // For National ID, also check name match using existing logic
                    // (name was already verified when set via /wizard/{id}/name)

                    const docs = [...wizardDocs.filter(d => d.docType !== docType),
                        { docType, filename: file.name, extractedFields: {} }];
                    setWizardDocs(docs);

                    const nextDoc = wizardRequiredDocs().find(d => !docs.some(u => u.docType === d));
                    if (nextDoc) {
                        addMessage('assistant', `Your ${prettyDoc(docType)} looks good. Next I need your ${prettyDoc(nextDoc)}.`, null, { type: 'wizard_upload' });
                    } else {
                        setWizardStep('review');
                        addMessage('assistant', 'All documents passed the checks. Please review what I filled in. Sensitive fields are masked and you can tap Show to double check them. Confirm when everything is correct, or replace a document.', null, { type: 'wizard_review' });
                    }
                    return true;
                } catch (e) {
                    resend('I could not reach the server.');
                    return false;
                } finally {
                    setWizardBusy(null);
                }
            };

            const wizardSubmitReview = async () => {
                if (wizardStep !== 'review') return;
                addMessage('user', 'Confirm and submit');
                setWizardStep('submitting');
                setLoading(true);
                try {
                    const token = getToken();
                    const res = await fetch(`${API_BASE}/wizard/${wizardAppId}/submit?token=${encodeURIComponent(token)}`, {
                        method: 'POST',
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok || !data.success) {
                        const d = data.detail || data.error || data.message;
                        setWizardStep('review');
                        addMessage('assistant', `Submission failed: ${typeof d === 'string' ? d : 'unknown error'}. You can try Confirm again.`, null, { type: 'wizard_review' });
                        return;
                    }
                    const refId = data.data?.reference_id;
                    setWizardStep('success');
                    addMessage('assistant',
                        `Done. Your ${wizardService.name} is submitted.\n\n` +
                        `Status: Submitted\n` +
                        `Reference: ${refId}\n` +
                        `Processing time: ${data.data?.processing_time || '2-3 business days'}\n` +
                        `I will notify you here as soon as there is an update.`, null, { type: 'wizard_review' });
                    loadDocuments();
                } catch (e) {
                    setWizardStep('review');
                    addMessage('assistant', `Submission failed: ${e.message}. You can try Confirm again.`, null, { type: 'wizard_review' });
                } finally {
                    setLoading(false);
                }
            };

            const wizardReplaceDoc = (docType) => {
                setWizardDocs(prev => prev.filter(d => d.docType !== docType));
                setWizardStep('upload');
                addMessage('assistant', `No problem. Please send a new ${prettyDoc(docType)}.`, null, { type: 'wizard_upload' });
            };

            const wizardRestart = () => {
                addMessage('user', 'Start over');
                if (wizardService) beginService(wizardService);
            };

            // Called from the message list: {renderWizardMessage(msg)}. Only the newest card of each kind is shown.
            const renderWizardMessage = (msg) => {
                if (!msg.type || msg.dismissed) return null;
                if (messages.filter(m => m.type === msg.type).slice(-1)[0] !== msg) return null;
                if (msg.type === 'wizard_offer') {
                    if (wizardStep && wizardStep !== 'success') return null;
                    return <WizardOffer
                        onYes={() => { addMessage('user', 'Yes, start my application'); const svc = services.find(s => s.id === msg.serviceId); if (svc) beginService(svc); else initWizardSession(); }}
                        onNo={() => { dismissOffers(); addMessage('user', 'Not now'); addMessage('assistant', 'No problem. Just say the word whenever you want to apply.'); }} />;
                }
                if (msg.type === 'wizard_services') return <WizardServices services={services} onPick={startWizardService} />;
                if (msg.type === 'wizard_upload') {
                    return <WizardUpload docs={wizardRequiredDocs()} uploaded={wizardDocs} busy={wizardBusy}
                        onFile={wizardUploadDocument} isId={isIdDocument} pretty={prettyDoc} />;
                }
                if (msg.type === 'wizard_review') {
                    return <WizardReview name={wizardName} docs={wizardDocs} mask={maskWizardValue} pretty={prettyDoc}
                        disabled={wizardStep !== 'review'} onConfirm={wizardSubmitReview} onReplace={wizardReplaceDoc} onRestart={wizardRestart} />;
                }
                return null;
            };

            const renderDocumentsPage = () => (
                <div className="chat-area">
                    <div className="page-header">
                        <h2><i className="fas fa-folder" style={{ marginRight: '8px' }}></i>Uploaded Documents ({documents.length})</h2>
                        <button className="btn btn-secondary" onClick={() => setShowDocumentsPage(false)}>
                            <i className="fas fa-arrow-left" style={{ marginRight: '4px' }}></i>Back to Chat
                        </button>
                    </div>
                    <div style={{ padding: '0 24px 24px' }}>
                        {documents.length === 0 ? (
                            <div style={{ textAlign: 'center', padding: '60px 20px', color: '#666' }}>
                                <div style={{ fontSize: '48px', marginBottom: '16px' }}>📄</div>
                                <div style={{ fontSize: '18px', marginBottom: '8px' }}>No documents yet</div>
                                <div style={{ fontSize: '14px', color: '#888' }}>
                                    Upload your first document using the paperclip icon in the chat input
                                </div>
                            </div>
                        ) : (
                            <div style={{ display: 'grid', gap: '12px' }}>
                                {documents.map((doc, idx) => (
                                    <div key={idx} style={{
                                        padding: '16px',
                                        background: '#1a1a1a',
                                        border: '1px solid #2a2a2a',
                                        borderRadius: '12px',
                                        display: 'flex',
                                        alignItems: 'center',
                                        gap: '12px'
                                    }}>
                                        <div style={{ fontSize: '24px' }}>📄</div>
                                        <div style={{ flex: 1 }}>
                                            <div style={{ fontSize: '14px', fontWeight: '500', marginBottom: '4px' }}>
                                                {doc.filename || doc.name || 'Unknown file'}
                                            </div>
                                            <div style={{ fontSize: '12px', color: '#666' }}>
                                                {doc.upload_date || doc.date || doc.uploaded_at || 'Unknown date'}
                                                {' · '}{formatFileSize(doc.file_size || doc.size || 0)}
                                            </div>
                                        </div>
                                        <div style={{ fontSize: '12px', color: '#22c55e' }}>
                                            Processed
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );

            const renderServicesPage = () => (
                <div className="chat-area">
                    <div className="page-header">
                        <h2><i className="fas fa-cogs" style={{ marginRight: '8px' }}></i>Services</h2>
                        <button className="btn btn-secondary" onClick={() => setShowServicesPage(false)}>
                            <i className="fas fa-arrow-left" style={{ marginRight: '4px' }}></i>Back to Chat
                        </button>
                    </div>
                    <div style={{ padding: '0 24px 24px' }}>
                        {services.length === 0 ? (
                            <div style={{ textAlign: 'center', padding: '60px 20px', color: '#666' }}>
                                <div style={{ fontSize: '48px', marginBottom: '16px' }}>🔧</div>
                                <div style={{ fontSize: '18px', marginBottom: '8px' }}>No services available</div>
                                <div style={{ fontSize: '14px', color: '#888' }}>
                                    No services have been loaded yet. Please check the system configuration.
                                </div>
                            </div>
                        ) : (
                            <div style={{ display: 'grid', gap: '16px' }}>
                                {services.map((svc, idx) => (
                                    <div key={idx} style={{
                                        padding: '20px',
                                        background: '#1a1a1a',
                                        border: '1px solid #2a2a2a',
                                        borderRadius: '12px',
                                        display: 'flex',
                                        flexDirection: 'column',
                                        gap: '12px'
                                    }}>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                                            <div style={{ fontSize: '28px' }}>{getServiceIcon(svc.id)}</div>
                                            <div style={{ flex: 1 }}>
                                                <div style={{ fontSize: '16px', fontWeight: '600' }}>{svc.name}</div>
                                                <div style={{ fontSize: '12px', color: svc.status === 'available' ? '#22c55e' : '#666', marginTop: '2px' }}>
                                                    {svc.status === 'available' ? '● Available' : '○ Coming Soon'}
                                                </div>
                                            </div>
                                            <button className="btn btn-primary" onClick={() => {
                                                if (user) {
                                                    setShowServicesPage(false);
                                                    sendMessage(`Tell me about ${svc.name}`);
                                                } else {
                                                    setShowAuth(true);
                                                }
                                            }} style={{ padding: '6px 16px', fontSize: '13px' }}>
                                                Ask about this
                                            </button>
                                        </div>
                                        <div style={{ fontSize: '14px', color: '#ccc', lineHeight: '1.5' }}>
                                            {svc.description || 'No description available.'}
                                        </div>
                                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '16px', fontSize: '13px', color: '#888' }}>
                                            <div>
                                                <strong style={{ color: '#aaa' }}>Required Documents:</strong>
                                                <div style={{ marginTop: '4px' }}>
                                                    {(svc.documents_required || []).length > 0 
                                                        ? (svc.documents_required || []).map((d, i) => (
                                                            <span key={i} style={{ 
                                                                display: 'inline-block', 
                                                                padding: '2px 8px', 
                                                                background: '#2a2a2a', 
                                                                borderRadius: '4px', 
                                                                marginRight: '4px',
                                                                fontSize: '12px'
                                                            }}>{d.replace(/_/g, ' ')}</span>
                                                        ))
                                                        : <span style={{ color: '#666' }}>None specified</span>
                                                    }
                                                </div>
                                            </div>
                                            <div>
                                                <strong style={{ color: '#aaa' }}>Processing Time:</strong>
                                                <span style={{ marginLeft: '8px' }}>{svc.processing_time || 'TBD'}</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );

            // Auth Modal
            if (showAuth) {
                return (
                    <div className="modal-overlay">
                        <div className="modal">
                            <div className="modal-title">
                                {authMode === 'login' ? 'Welcome Back' : 'Create Account'}
                            </div>
                            <div className="modal-subtitle">
                                {authMode === 'login' ? 'Sign in to continue' : 'Get started with DocIntake'}
                            </div>

                            <div className="form-group">
                                <label>Username</label>
                                <input
                                    className="form-input"
                                    value={authData.username}
                                    onChange={e => setAuthData({...authData, username: e.target.value})}
                                    placeholder="Enter username"
                                />
                            </div>

                            <div className="form-group">
                                <label>Password</label>
                                <div className="password-wrapper">
                                    <input
                                        className="form-input"
                                        type={showPassword ? "text" : "password"}
                                        value={authData.password}
                                        onChange={e => setAuthData({...authData, password: e.target.value})}
                                        placeholder="Enter password"
                                        onKeyDown={e => e.key === 'Enter' && handleAuth()}
                                        style={{ paddingRight: '40px' }}
                                    />
                                    <button
                                        type="button"
                                        className="password-toggle"
                                        onClick={() => setShowPassword(!showPassword)}
                                        tabIndex="-1"
                                        aria-label={showPassword ? "Hide password" : "Show password"}
                                    >
                                        <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                    </button>
                                </div>
                            </div>

                            {authMode === 'register' && (
                                <div className="form-group">
                                    <label>Name (optional)</label>
                                    <input
                                        className="form-input"
                                        value={authData.name}
                                        onChange={e => setAuthData({...authData, name: e.target.value})}
                                        placeholder="Enter your name"
                                    />
                                </div>
                            )}

                    {authError && (
                        <div>
                            <div className="error-msg">{authError}</div>
                            <div style={{ display: 'flex', gap: '8px', marginTop: '8px' }}>
                                <button
                                    className="btn btn-ghost"
                                    onClick={() => setAuthError('')}
                                    style={{ flex: 1 }}
                                >
                                    Try again
                                </button>
                                <button
                                    className="btn btn-ghost"
                                    onClick={() => setShowAuth(false)}
                                    style={{ flex: 1 }}
                                >
                                    Cancel
                                </button>
                            </div>
                        </div>
                    )}

                            <button className="btn btn-primary" onClick={handleAuth} style={{ width: '100%', marginTop: '16px' }}>
                                {authMode === 'login' ? 'Sign In' : 'Create Account'}
                            </button>

                            <button
                                className="btn btn-ghost"
                                onClick={() => setShowAuth(false)}
                                style={{ width: '100%', marginTop: '8px' }}
                            >
                                ← Back to Chat
                            </button>

                                    <button
                                        className="btn btn-ghost"
                                        onClick={() => {
                                            setAuthMode(authMode === 'login' ? 'register' : 'login');
                                            setAuthError('');
                                        }}
                                        style={{ width: '100%', marginTop: '8px' }}
                                    >
                                        {authMode === 'login' ? "Don't have an account? Sign up" : 'Already have an account? Sign in'}
                                    </button>
                                </div>
                            </div>
                        );
            }

            return (
                <div>
                    {/* Top bar */}
                    <div className="topbar">
                        <div className="topbar-left">
                            <button className="sidebar-toggle" onClick={() => setSidebarOpen(!sidebarOpen)}>
                                <i className="fas fa-bars"></i>
                            </button>
                            <div className="logo">DocIntake</div>
                            <div className="topbar-time">{currentTime}</div>
                        </div>
                        <div className="topbar-right">
                            {user ? (
                                <>
                                    <span style={{ fontSize: '13px', color: '#888' }}>Logged in as {user.username}</span>
                                    <button className="btn btn-ghost" onClick={handleLogout}>
                                        <i className="fas fa-sign-out-alt"></i> Logout
                                    </button>
                                </>
                            ) : (
                                <button className="btn btn-primary" onClick={() => setShowAuth(true)}>
                                    <i className="fas fa-user"></i> Login
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Main layout */}
                    <div className="main-layout">
                        {/* Sidebar */}
                        <div className={`sidebar ${!sidebarOpen ? 'collapsed' : ''}`}>
                            <div className="sidebar-header">
                                <button className="sidebar-btn" onClick={handleResetChat}>
                                    <i className="fas fa-undo"></i>
                                    Reset Chat
                                </button>
                                <button className="sidebar-btn" onClick={handleStartApplication} style={{ borderColor: '#84BD00', background: 'rgba(132, 189, 0, 0.1)' }}>
                                    <i className="fas fa-file-alt"></i>
                                    Start New Application
                                </button>
                            </div>

                            <div className="sidebar-section">
                                <div className="sidebar-section-title">Navigation</div>
                                <div className={`sidebar-item ${!showServicesPage && !showDocumentsPage && !showApplicationFlow ? 'active' : ''}`} onClick={() => { setShowDocumentsPage(false); setShowServicesPage(false); setShowApplicationFlow(false); setMessages([]); }}>
                                    <i className="fas fa-comment"></i> Chat
                                </div>
                                <div className={`sidebar-item ${showServicesPage ? 'active' : ''}`} onClick={() => { setShowServicesPage(true); setShowDocumentsPage(false); setShowApplicationFlow(false); }}>
                                    <i className="fas fa-cogs"></i> Services
                                </div>
                                <div className={`sidebar-item ${showDocumentsPage ? 'active' : ''}`} onClick={() => { setShowDocumentsPage(true); setShowServicesPage(false); setShowApplicationFlow(false); loadDocuments(); }}>
                                    <i className="fas fa-folder"></i> Documents
                                    <span style={{ marginLeft: 'auto', fontSize: '12px', color: '#666' }}>{documents.length}</span>
                                </div>
                            </div>

                            {services.length > 0 && (
                                <div className="sidebar-section">
                                    <div className="sidebar-section-title">Services</div>
                                    {services.map(svc => (
                                        <div key={svc.id} className="sidebar-item" onClick={() => handleServiceClick(svc.id, svc.name)}>
                                            <span>{getServiceIcon(svc.id)}</span>
                                            {svc.name}
                                        </div>
                                    ))}
                                </div>
                            )}

                            <div className="sidebar-status">
                                <div className="status-item">
                                    <div className={`status-dot ${systemHealthy ? '' : 'offline'}`}></div>
                                    <span style={{ color: systemHealthy ? '#22c55e' : '#666' }}>
                                        {systemHealthy ? 'System Online' : 'System Offline'}
                                    </span>
                                </div>
                                <div className="status-item">
                                    <div className={`status-dot ${ollamaHealthy ? '' : 'offline'}`}></div>
                                    <span style={{ color: ollamaHealthy ? '#22c55e' : '#666' }}>
                                        {ollamaHealthy ? 'Ollama Connected' : 'Ollama Offline'}
                                    </span>
                                </div>
                            </div>
                        </div>

                        {/* Content area */}
                        {showServicesPage ? (
                            renderServicesPage()
                        ) : showDocumentsPage ? (
                            renderDocumentsPage()
                        ) : (
                            <div className="chat-area">
                            <div className="chat-messages">
                                {messages.length === 0 ? (
                                    <div className="welcome-message">
                                        <div className="welcome-icon">🦊</div>
                                        <div className="welcome-title">Welcome to DocIntake</div>
                                        <div className="welcome-text">Hi! I'm Lynx — your AI assistant for document onboarding. How can I help you today?</div>
                                        <div className="feature-grid">
                                            <div className="feature-card" onClick={() => handleFeatureClick('I want to apply for basic registration')}>
                                                <div className="feature-icon">🆔</div>
                                                <div className="feature-title">Basic Registration</div>
                                                <div className="feature-desc">Simple identity registration</div>
                                            </div>
                                            <div className="feature-card" onClick={() => handleFeatureClick('I want to apply for premium cross-border service')}>
                                                <div className="feature-icon">🌍</div>
                                                <div className="feature-title">Cross Border</div>
                                                <div className="feature-desc">International verification</div>
                                            </div>
                                            <div className="feature-card" onClick={() => handleFeatureClick('I need mobility or rental service')}>
                                                <div className="feature-icon">🚗</div>
                                                <div className="feature-title">Mobility/Rental</div>
                                                <div className="feature-desc">Vehicle rental service</div>
                                            </div>
                                            <div className="feature-card" onClick={() => handleFeatureClick('Upload a document')}>
                                                <div className="feature-icon">📎</div>
                                                <div className="feature-title">Upload Document</div>
                                                <div className="feature-desc">Upload documents (PDF, PNG, JPG)</div>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <>
                                        {messages.map((msg, idx) => (
                                            msg.role === 'system' ? (
                                                <div key={idx} className="system-message">
                                                    <div className="message-content">
                                                        {msg.content}
                                                    </div>
                                                </div>
                                            ) : (
                                                <div key={idx} className={`message ${msg.role}`}>
                                                    <div className="message-avatar">
                                                        {msg.role === 'assistant' ? '🦊' : '👤'}
                                                    </div>
                                                    <div>
                                                        <div className="message-content">
                                                            {msg.content.split('\n').map((line, i) => (
                                                                <div key={i}>{line}</div>
                                                            ))}
                                                        </div>
                                                        {renderWizardMessage(msg)}
                                                        {msg.service && (
                                                            <div className="service-badge">
                                                                <span>{getServiceIcon(msg.service)}</span>
                                                                <span>Connected to: {msg.service.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase())}</span>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            )
                                        ))}
                                    </>
                                )}
                                {loading && (
                                    <div className="message assistant">
                                        <div className="message-avatar">🦊</div>
                                        <div className="message-content">
                                            <div className="typing-indicator">
                                                <div className="typing-dot"></div>
                                                <div className="typing-dot"></div>
                                                <div className="typing-dot"></div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                                <div ref={chatEndRef} />
                            </div>

                            <div className="chat-input-area">
                                <div className="input-container">
                                    {file && (
                                        <div className="file-preview">
                                            <i className="fas fa-file-pdf"></i>
                                            <span>{file.name}</span>
                                            <span className="file-remove" onClick={() => { setFile(null); if (fileInputRef.current) fileInputRef.current.value = ''; }}>
                                                <i className="fas fa-times"></i>
                                            </span>
                                            <button className="btn btn-primary" onClick={() => { if (!user) { setShowAuth(true); } else { handleFileUpload(); } }} style={{ marginLeft: 'auto', padding: '4px 12px', fontSize: '12px' }}>
                                                Upload
                                            </button>
                                        </div>
                                    )}
                                    <div className="input-wrapper">
                                        <button className="upload-btn" onClick={() => { if (!user) { setShowAuth(true); } else { fileInputRef.current?.click(); } }}>
                                            <i className="fas fa-paperclip"></i>
                                        </button>
                                        <input
                                            type="file"
                                            ref={fileInputRef}
                                            accept=".pdf,.png,.jpg,.jpeg,.tiff,.bmp"
                                            style={{ display: 'none' }}
                                            onChange={e => setFile(e.target.files[0])}
                                        />
                                        <textarea
                                            id="chatInput"
                                            value={input}
                                            onChange={e => setInput(e.target.value)}
                                            placeholder="Type your message..."
                                            rows="1"
                                            onKeyDown={e => {
                                                if (e.key === 'Enter' && !e.shiftKey) {
                                                    e.preventDefault();
                                                    sendMessage();
                                                }
                                            }}
                                        />
                                        <button className="send-btn" onClick={() => sendMessage()} disabled={loading}>
                                            <i className="fas fa-paper-plane"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
